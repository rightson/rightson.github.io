<article class="post-card">
  <div class="card-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time>{% include domain-label.html post=post %}</div>
  <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
  <p>{{ post.description | default: post.excerpt | strip_html | normalize_whitespace | truncate: 150 | escape }}</p>
  <a class="read-link" href="{{ post.url | relative_url }}">閱讀文章 <span aria-hidden="true">↗</span><span class="sr-only">：{{ post.title | escape }}</span></a>
</article>
