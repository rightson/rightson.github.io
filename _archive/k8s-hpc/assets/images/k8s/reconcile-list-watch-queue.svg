<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="white"/><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:30px;font-weight:700}.m{font-size:22px}.s{font-size:17px;fill:#444}.b{fill:#f7f7f7;stroke:#333;stroke-width:2}.c{fill:#eaf2ff;stroke:#2458a6;stroke-width:2}.g{fill:#edf8ed;stroke:#397a3b;stroke-width:2}.a{stroke:#333;stroke-width:2.4;fill:none;marker-end:url(#x)}.d{stroke:#777;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="700" y="46" text-anchor="middle" class="t h">Kubernetes controller data path: state first, events second</text>
<rect x="70" y="130" width="220" height="100" rx="12" class="c"/><text x="180" y="172" text-anchor="middle" class="t m">kube-apiserver</text><text x="180" y="202" text-anchor="middle" class="t s">LIST / WATCH</text>
<rect x="370" y="130" width="220" height="100" rx="12" class="c"/><text x="480" y="172" text-anchor="middle" class="t m">Reflector</text><text x="480" y="202" text-anchor="middle" class="t s">ListAndWatch</text>
<rect x="670" y="130" width="220" height="100" rx="12" class="g"/><text x="780" y="172" text-anchor="middle" class="t m">local cache</text><text x="780" y="202" text-anchor="middle" class="t s">object snapshots</text>
<rect x="970" y="130" width="220" height="100" rx="12" class="g"/><text x="1080" y="172" text-anchor="middle" class="t m">workqueue</text><text x="1080" y="202" text-anchor="middle" class="t s">keys + retry/backoff</text>
<rect x="970" y="360" width="220" height="105" rx="12" class="c"/><text x="1080" y="402" text-anchor="middle" class="t m">reconcile(key)</text><text x="1080" y="432" text-anchor="middle" class="t s">read latest state</text>
<rect x="670" y="360" width="220" height="105" rx="12" class="b"/><text x="780" y="402" text-anchor="middle" class="t m">desired-current diff</text><text x="780" y="432" text-anchor="middle" class="t s">derive minimal action</text>
<rect x="370" y="360" width="220" height="105" rx="12" class="b"/><text x="480" y="402" text-anchor="middle" class="t m">side effect</text><text x="480" y="432" text-anchor="middle" class="t s">create / update / delete / external call</text>
<path d="M290 180 L370 180" class="a"/><path d="M590 180 L670 180" class="a"/><path d="M890 180 L970 180" class="a"/><path d="M1080 230 L1080 360" class="a"/><path d="M970 412 L890 412" class="a"/><path d="M670 412 L590 412" class="a"/><path d="M480 360 C480 305 300 300 230 230" class="d"/>
<text x="700" y="555" text-anchor="middle" class="t m">Event != truth</text><text x="700" y="590" text-anchor="middle" class="t s">Events enqueue work; reconcile re-reads current state before deciding. Duplicate or missed events need not corrupt correctness.</text>
<text x="700" y="650" text-anchor="middle" class="t s">resourceVersion lets a client build a snapshot and then continue from subsequent changes.</text>
