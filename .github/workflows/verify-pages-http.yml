name: Verify GitHub Pages HTTP

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest post URL
        id: resolve
        shell: bash
        run: |
          POST="$(git log -1 --name-only --pretty=format: -- '_posts/*' | sed '/^$/d' | head -n 1)"
          test -n "$POST"

          POST="$POST" python3 - <<'PY'
          import os, re
          from pathlib import Path

          post = Path(os.environ["POST"])
          text = post.read_text(encoding="utf-8")
          fm = text.split("---", 2)[1]

          def field(name):
              m = re.search(rf"(?m)^{re.escape(name)}:\s*(.+?)\s*$", fm)
              return m.group(1).strip() if m else ""

          title = field("title").strip("'\"")
          cats = field("categories").strip("[]")
          categories = [x.strip("'\" ") for x in re.split(r"[\s,]+", cats) if x.strip("'\" ")]

          m = re.match(r"(\d{4})-(\d{2})-(\d{2})-(.+)\.(?:md|markdown)$", post.name)
          if not m:
              raise SystemExit(f"Unsupported post filename: {post}")
          year, month, day, slug = m.groups()

          cfg = Path("_config.yml").read_text(encoding="utf-8")
          url_m = re.search(r'(?m)^url:\s*["\']?([^"\'\s]+)', cfg)
          base_m = re.search(r'(?m)^baseurl:\s*["\']?([^"\']*)', cfg)
          permalink_m = re.search(r'(?m)^permalink:\s*["\']?([^"\'\s]+)', cfg)

          site = url_m.group(1).rstrip("/") if url_m else "https://rightson.github.io"
          base = (base_m.group(1).strip() if base_m else "").rstrip("/")
          permalink = permalink_m.group(1).strip() if permalink_m else "date"

          cat_path = "/".join(categories)
          prefix = f"/{cat_path}" if cat_path else ""

          if permalink == "date":
              path = f"{prefix}/{year}/{month}/{day}/{slug}.html"
          elif permalink == "pretty":
              path = f"{prefix}/{year}/{month}/{day}/{slug}/"
          else:
              raise SystemExit(f"Custom permalink '{permalink}' requires explicit resolver update before claiming publication success.")

          final_url = f"{site}{base}{path}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"url={final_url}\n")
              f.write(f"title={title}\n")
              f.write(f"post={post.as_posix()}\n")
          print(final_url)
          PY

      - name: Verify actual HTTP page
        env:
          URL: ${{ steps.resolve.outputs.url }}
          TITLE: ${{ steps.resolve.outputs.title }}
        shell: bash
        run: |
          ok=0
          for attempt in $(seq 1 24); do
            code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ]; then
              if python3 - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          title = os.environ["TITLE"]
          html = Path("/tmp/page.html").read_text(encoding="utf-8", errors="ignore")

          class H1Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.buf = []
                  self.h1 = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "h1":
                      self.depth += 1
                      if self.depth == 1:
                          self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == "h1" and self.depth:
                      if self.depth == 1:
                          self.h1.append("".join(self.buf).strip())
                      self.depth -= 1
              def handle_data(self, data):
                  if self.depth:
                      self.buf.append(data)

          p = H1Parser()
          p.feed(html)
          matches = sum(1 for h in p.h1 if h == title)
          if matches != 1:
              raise SystemExit(f"Expected exactly one post-title H1, found {matches}. H1s={p.h1}")
          print(f"HTTP 200 and exactly one matching H1: {title}")
          PY
              then
                ok=1
                break
              fi
            fi
            echo "Attempt $attempt: HTTP $code or content not ready"
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "Verification failed: $URL"
            exit 1
          fi

          echo "Verified: $URL" >> "$GITHUB_STEP_SUMMARY"
