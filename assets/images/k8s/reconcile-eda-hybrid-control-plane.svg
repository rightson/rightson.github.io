<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="white"/><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:30px;font-weight:700}.m{font-size:22px}.s{font-size:17px;fill:#444}.cp{fill:#eaf2ff;stroke:#2458a6;stroke-width:2}.ex{fill:#edf8ed;stroke:#397a3b;stroke-width:2}.st{fill:#fff4e5;stroke:#aa6b12;stroke-width:2}.a{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#x)}.d{stroke:#777;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="t h">EDA / HPC hybrid control plane: reconcile intent, keep specialized execution backends</text>
<rect x="90" y="105" width="1220" height="125" rx="14" class="cp"/><text x="700" y="145" text-anchor="middle" class="t m">Domain desired state</text><text x="700" y="180" text-anchor="middle" class="t s">run spec · design inputs · tool/version · license class · resource/topology policy · artifact contract</text><text x="700" y="207" text-anchor="middle" class="t s">status: admitted / running / blocked / failed / completed / artifact digest</text>
<rect x="545" y="285" width="310" height="115" rx="14" class="cp"/><text x="700" y="327" text-anchor="middle" class="t m">reconciliation controller</text><text x="700" y="360" text-anchor="middle" class="t s">observe → diff → act → report</text>
<rect x="80" y="485" width="250" height="115" rx="14" class="ex"/><text x="205" y="527" text-anchor="middle" class="t m">Kubernetes Job</text><text x="205" y="560" text-anchor="middle" class="t s">container-native stages</text>
<rect x="390" y="485" width="250" height="115" rx="14" class="ex"/><text x="515" y="527" text-anchor="middle" class="t m">LSF / Slurm</text><text x="515" y="560" text-anchor="middle" class="t s">existing batch farms</text>
<rect x="760" y="485" width="250" height="115" rx="14" class="ex"/><text x="885" y="527" text-anchor="middle" class="t m">bare metal</text><text x="885" y="560" text-anchor="middle" class="t s">latency / license / topology</text>
<rect x="1070" y="485" width="250" height="115" rx="14" class="ex"/><text x="1195" y="527" text-anchor="middle" class="t m">specialized service</text><text x="1195" y="560" text-anchor="middle" class="t s">farm / appliance / remote API</text>
<rect x="250" y="680" width="900" height="90" rx="14" class="st"/><text x="700" y="715" text-anchor="middle" class="t m">Shared physical constraints remain visible</text><text x="700" y="748" text-anchor="middle" class="t s">license server · NFS/SAN/local scratch · NUMA · memory bandwidth · network/RDMA · artifact storage</text>
<path d="M700 230 L700 285" class="a"/><path d="M620 400 C500 445 320 450 205 485" class="a"/><path d="M660 400 C620 445 565 450 515 485" class="a"/><path d="M740 400 C780 445 835 450 885 485" class="a"/><path d="M780 400 C900 445 1080 450 1195 485" class="a"/>
<path d="M205 600 C205 650 400 665 500 680" class="d"/><path d="M515 600 C515 650 560 665 610 680" class="d"/><path d="M885 600 C885 650 840 665 790 680" class="d"/><path d="M1195 600 C1195 650 1000 665 900 680" class="d"/>
<text x="700" y="805" text-anchor="middle" class="t s">The control plane can unify intent and evidence without pretending every workload needs the same execution engine.</text>
</svg>