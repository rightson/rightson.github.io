<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<style>.b{fill:#f7f7f7;stroke:#333;stroke-width:2}.p{fill:#eaf2ff;stroke:#2458a6;stroke-width:2}.s{fill:#edf8ee;stroke:#397a3b;stroke-width:2}.t{font:22px Arial,sans-serif;fill:#111;text-anchor:middle}.m{font:17px Arial,sans-serif;fill:#333;text-anchor:middle}.ar{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#777;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#a)}</style>
<text x="700" y="45" class="t" font-weight="bold">watch cache：讀取規模擴大時，kube-apiserver 不能讓每個 controller 都直接壓 etcd</text>
<rect x="565" y="95" rx="14" width="270" height="105" class="s"/><text x="700" y="135" class="t">etcd</text><text x="700" y="168" class="m">durable MVCC state</text>
<rect x="500" y="285" rx="14" width="400" height="125" class="p"/><text x="700" y="330" class="t">kube-apiserver watch cache</text><text x="700" y="364" class="m">in-memory mirror + recent events</text><text x="700" y="392" class="m">resourceVersion / snapshots</text>
<path d="M700 200 L700 285" class="ar"/>
<rect x="70" y="535" rx="12" width="260" height="100" class="b"/><text x="200" y="573" class="t">Scheduler</text><text x="200" y="606" class="m">LIST / WATCH Pods</text>
<rect x="405" y="535" rx="12" width="260" height="100" class="b"/><text x="535" y="573" class="t">Controllers</text><text x="535" y="606" class="m">LIST / WATCH resources</text>
<rect x="740" y="535" rx="12" width="260" height="100" class="b"/><text x="870" y="573" class="t">Operators</text><text x="870" y="606" class="m">CRDs / watches</text>
<rect x="1075" y="535" rx="12" width="260" height="100" class="b"/><text x="1205" y="573" class="t">kubectl / API clients</text><text x="1205" y="606" class="m">GET / LIST / WATCH</text>
<path d="M610 410 L200 535" class="ar"/><path d="M660 410 L535 535" class="ar"/><path d="M740 410 L870 535" class="ar"/><path d="M790 410 L1205 535" class="ar"/>
<path d="M835 145 C1050 145 1130 300 1130 500" class="d"/>
<text x="1130" y="325" class="m">strong-consistency / cache-miss paths</text>
<text x="700" y="700" class="m">Kubernetes 1.37 可用 watch cache 服務 most-recent reads（配合 etcd progress notification），降低 quorum-read 壓力。</text>
</svg>