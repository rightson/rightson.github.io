<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<style>.c{fill:#eaf2ff;stroke:#2458a6;stroke-width:2}.s{fill:#edf8ee;stroke:#397a3b;stroke-width:2}.e{fill:#fff0f0;stroke:#b84242;stroke-width:2}.t{font:22px Arial,sans-serif;fill:#111;text-anchor:middle}.m{font:17px Arial,sans-serif;fill:#333;text-anchor:middle}.ar{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
<text x="700" y="45" class="t" font-weight="bold">resourceVersion：Kubernetes 用 optimistic concurrency 防止兩個 controller 互相覆蓋</text>
<rect x="70" y="110" rx="12" width="240" height="95" class="c"/><text x="190" y="147" class="t">Controller A</text><text x="190" y="180" class="m">read object rv=100</text>
<rect x="1090" y="110" rx="12" width="240" height="95" class="c"/><text x="1210" y="147" class="t">Controller B</text><text x="1210" y="180" class="m">read object rv=100</text>
<rect x="540" y="100" rx="12" width="320" height="115" class="s"/><text x="700" y="140" class="t">kube-apiserver</text><text x="700" y="175" class="m">object rv=100</text>
<path d="M540 145 L310 145" class="ar"/><path d="M860 145 L1090 145" class="ar"/>
<rect x="70" y="310" rx="12" width="240" height="95" class="c"/><text x="190" y="347" class="t">A writes</text><text x="190" y="380" class="m">PUT with rv=100</text>
<path d="M310 355 L540 355" class="ar"/>
<rect x="540" y="300" rx="12" width="320" height="115" class="s"/><text x="700" y="340" class="t">commit succeeds</text><text x="700" y="375" class="m">object becomes rv=101</text>
<rect x="1090" y="310" rx="12" width="240" height="95" class="c"/><text x="1210" y="347" class="t">B writes later</text><text x="1210" y="380" class="m">PUT with stale rv=100</text>
<path d="M1090 355 L860 355" class="ar"/>
<rect x="540" y="505" rx="12" width="320" height="120" class="e"/><text x="700" y="548" class="t">409 Conflict</text><text x="700" y="582" class="m">stale write is rejected</text><text x="700" y="608" class="m">B must re-read / merge / retry</text>
<path d="M700 415 L700 505" class="ar"/>
<text x="700" y="700" class="m">這不是 distributed lock；它把「誰先拿到鎖」改成「誰基於最新 state 提交可接受的 mutation」。</text>
</svg>