<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><style>.t{font:21px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#333;text-anchor:middle}.b{fill:#fff4e5;stroke:#aa6b12;stroke-width:2}.r{fill:#fff0f0;stroke:#a33;stroke-width:2}.g{fill:#eef8ee;stroke:#397a3b;stroke-width:2}.x{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><text x="600" y="45" class="t" font-weight="bold">I/O tail latency can propagate into control-plane unavailability</text><rect x="45" y="120" width="205" height="105" rx="10" class="b"/><text x="148" y="158" class="t">Slow fsync</text><text x="148" y="190" class="s">WAL persistence</text><rect x="300" y="120" width="205" height="105" rx="10" class="b"/><text x="403" y="158" class="t">Replication delay</text><text x="403" y="190" class="s">peer ACK late</text><rect x="555" y="120" width="205" height="105" rx="10" class="r"/><text x="658" y="158" class="t">Heartbeat miss</text><text x="658" y="190" class="s">leader suspected</text><rect x="810" y="120" width="205" height="105" rx="10" class="r"/><text x="913" y="158" class="t">Election</text><text x="913" y="190" class="s">write path pauses</text><rect x="780" y="360" width="260" height="115" rx="10" class="r"/><text x="910" y="397" class="t">New mutations stall</text><text x="910" y="430" class="s">bind / status / lease</text><rect x="430" y="360" width="260" height="115" rx="10" class="g"/><text x="560" y="397" class="t">Existing workload</text><text x="560" y="430" class="s">may keep running locally</text><rect x="90" y="360" width="260" height="115" rx="10" class="b"/><text x="220" y="397" class="t">Queue grows</text><text x="220" y="430" class="s">controllers cannot commit</text><path d="M250 172 L300 172" class="x"/><path d="M505 172 L555 172" class="x"/><path d="M760 172 L810 172" class="x"/><path d="M913 225 L913 360" class="x"/><path d="M780 417 L690 417" class="x"/><path d="M430 417 L350 417" class="x"/><text x="600" y="570" class="s">Control-plane storage and workload storage are different paths.</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#333" i]{fill:#d2d5d6}[fill="white" i]{fill:#1b1f20}.t{fill:#dee1e1}.s{fill:#d2d5d6}.b{fill:#352714;stroke:#e7aa55}.r{fill:#311212;stroke:#da8383}.g{fill:#1d2b1d;stroke:#bad3bb}.x{stroke:#d2d5d6}}</style>
</svg>