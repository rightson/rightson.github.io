<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><style>.t{font:22px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:17px Arial,sans-serif;fill:#333;text-anchor:middle}.ok{fill:#eef8ee;stroke:#397a3b;stroke-width:2}.bad{fill:#fff0f0;stroke:#a33;stroke-width:2}.b{fill:#f7f7f7;stroke:#333;stroke-width:2}.x{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><text x="600" y="45" class="t" font-weight="bold">Compaction creates a recovery boundary for slow watchers</text><rect x="70" y="110" width="220" height="100" rx="10" class="ok"/><text x="180" y="148" class="t">Watcher cache</text><text x="180" y="180" class="s">last rev 9000</text><rect x="390" y="110" width="260" height="100" rx="10" class="bad"/><text x="520" y="148" class="t">History compacted</text><text x="520" y="180" class="s">keep rev ≥ 12000</text><rect x="760" y="110" width="300" height="100" rx="10" class="bad"/><text x="910" y="148" class="t">Resume fails</text><text x="910" y="180" class="s">old revision unavailable</text><rect x="760" y="320" width="300" height="100" rx="10" class="b"/><text x="910" y="358" class="t">Fresh LIST</text><text x="910" y="390" class="s">rebuild snapshot</text><rect x="390" y="470" width="260" height="100" rx="10" class="ok"/><text x="520" y="508" class="t">New resourceVersion</text><text x="520" y="540" class="s">start new WATCH</text><path d="M290 160 L390 160" class="x"/><path d="M650 160 L760 160" class="x"/><path d="M910 210 L910 320" class="x"/><path d="M760 370 C650 390 610 450 650 510" class="x"/><text x="600" y="610" class="s">Clients must tolerate relist/re-watch; infinite change history is not free.</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#333" i]{fill:#d2d5d6}[fill="white" i]{fill:#1b1f20}.t{fill:#dee1e1}.s{fill:#d2d5d6}.ok{fill:#1d2b1d;stroke:#bad3bb}.bad{fill:#311212;stroke:#da8383}.b{fill:#1f2325;stroke:#d2d5d6}.x{stroke:#d2d5d6}}</style>
</svg>