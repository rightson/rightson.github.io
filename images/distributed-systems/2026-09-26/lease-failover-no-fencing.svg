<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img">
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#172b4d}.t{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:650}.s{font-size:15px;fill:#435574}.b{fill:#f5f8fc;stroke:#8ca0bd;stroke-width:2}.g{fill:#edf8f1;stroke:#5c9b74;stroke-width:2}.r{fill:#fff0ee;stroke:#c8766d;stroke-width:2}.l{stroke:#6b7f9f;stroke-width:2;fill:none}.d{stroke:#c8766d;stroke-width:2;fill:none;stroke-dasharray:7 5}</style>
<rect width="760" height="600" fill="#fff"/><text x="38" y="40" class="t">Lease 能協調接手，但不會 fence 外部 side effect</text>
<rect x="45" y="82" width="205" height="88" rx="12" class="g"/><text x="148" y="113" text-anchor="middle" class="h">Replica A：Leader</text><text x="148" y="138" text-anchor="middle" class="s">Lease 15s / renew 10s</text>
<rect x="510" y="82" width="205" height="88" rx="12" class="b"/><text x="612" y="113" text-anchor="middle" class="h">Replica B：Standby</text><text x="612" y="138" text-anchor="middle" class="s">retry period 2s</text>
<path d="M250 125h260" class="l"/><text x="380" y="112" text-anchor="middle" class="s">shared Lease object</text>
<path d="M148 170v75" class="l"/><rect x="45" y="245" width="205" height="88" rx="12" class="r"/><text x="148" y="276" text-anchor="middle" class="h">API connectivity lost</text><text x="148" y="301" text-anchor="middle" class="s">renew deadline exceeded</text>
<path d="M612 170v160" class="l"/><rect x="510" y="330" width="205" height="88" rx="12" class="g"/><text x="612" y="361" text-anchor="middle" class="h">B acquires leadership</text><text x="612" y="386" text-anchor="middle" class="s">controller loops restart</text>
<path d="M148 333v112" class="d"/><rect x="45" y="445" width="205" height="88" rx="12" class="r"/><text x="148" y="476" text-anchor="middle" class="h">舊 external job 仍可能活著</text><text x="148" y="501" text-anchor="middle" class="s">LSF / volume / API side effect</text>
<path d="M510 374H360v115H250" class="d"/><text x="385" y="471" text-anchor="middle" class="s">新 leader 可能再次觸發</text>
<text x="380" y="570" text-anchor="middle" class="s">因此 external side effect 還需要 idempotency / ownership / fencing contract</text>
</svg>