<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img">
<style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#172b4d}.t{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:650}.s{font-size:15px;fill:#435574}.b{fill:#f5f8fc;stroke:#8ca0bd;stroke-width:2}.g{fill:#edf8f1;stroke:#5c9b74;stroke-width:2}.q{fill:#fff4e8;stroke:#ba854a;stroke-width:2}.l{stroke:#6b7f9f;stroke-width:2;fill:none}</style>
<rect width="760" height="600" fill="#fff"/><text x="38" y="40" class="t">Observation 與 Work 分開，event 只負責提示</text>
<rect x="245" y="68" width="270" height="70" rx="12" class="b"/><text x="380" y="99" text-anchor="middle" class="h">kube-apiserver</text><text x="380" y="123" text-anchor="middle" class="s">LIST + WATCH</text>
<path d="M380 138v42" class="l"/><rect x="245" y="180" width="270" height="70" rx="12" class="g"/><text x="380" y="211" text-anchor="middle" class="h">Reflector / Watch</text><text x="380" y="235" text-anchor="middle" class="s">接收 object changes</text>
<path d="M380 250v42" class="l"/><rect x="245" y="292" width="270" height="70" rx="12" class="g"/><text x="380" y="323" text-anchor="middle" class="h">Store / Indexer</text><text x="380" y="347" text-anchor="middle" class="s">eventually consistent local cache</text>
<path d="M380 362v42" class="l"/><rect x="245" y="404" width="270" height="70" rx="12" class="q"/><text x="380" y="435" text-anchor="middle" class="h">Handler → workqueue key</text><text x="380" y="459" text-anchor="middle" class="s">namespace/name，而非完整 event history</text>
<path d="M380 474v42" class="l"/><rect x="245" y="516" width="270" height="58" rx="12" class="b"/><text x="380" y="550" text-anchor="middle" class="h">sync(key) → 讀最新 state → reconcile</text>
</svg>