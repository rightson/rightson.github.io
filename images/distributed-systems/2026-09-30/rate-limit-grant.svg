<svg xmlns="http://www.w3.org/2000/svg" width="600" height="605" viewBox="0 0 600 605" role="img" aria-label="局部額度：中央扣除、重試與 incarnation 消耗"><title>局部額度：中央扣除、重試與 incarnation 消耗</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="600" height="605" fill="#ffffff"/><text x="300" y="35" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">局部額度：先扣除，再交給單一 owner</text><rect x="65" y="60" width="470" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="89" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">權威桶：原子扣 q，保存 grant_id</text><text x="300.0" y="116" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">與 owner incarnation、版本、expiry</text><path d="M300,150 L300,182" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="173" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#0f172a">確認後回 grant</text><rect x="65" y="185" width="470" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="214" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">Gateway：未消耗總量 ≤ q</text><text x="300.0" y="241" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">本機原子扣除；沒有本機 refill</text><path d="M300,275 L165,312" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300,275 L435,312" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="315" width="260" height="115" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="165.0" y="344" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">正常請求</text><text x="165.0" y="371" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">期限內且餘額足夠</text><text x="165.0" y="398" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">扣 cost → 單次轉送</text><rect x="320" y="315" width="245" height="115" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="442.5" y="344" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">重啟／到期</text><text x="442.5" y="371" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">丟棄剩餘 grant</text><text x="442.5" y="398" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">不退回中央桶</text><rect x="65" y="460" width="470" height="75" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="489" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">同 grant_id 的 RPC 重試：回原 grant</text><text x="300.0" y="516" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">新 process：新 incarnation，拒收舊 grant</text><text x="300" y="572" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">包絡：A(T) ≤ rT + B + U；U ≤ Nq</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#0f172a" i]{fill:#d1d7e6}[fill="#475569" i]{fill:#c0c6cd}[fill="#eff6ff" i]{fill:#132031}[fill="#f0fdf4" i]{fill:#162e1e}[fill="#fff7ed" i]{fill:#322413}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#15803d" i]{stroke:#47e180}[stroke="#2563eb" i]{stroke:#82a4ed}[stroke="#475569" i]{stroke:#c0c6cd}[stroke="#c2410c" i]{stroke:#e98b65}}</style>
</svg>