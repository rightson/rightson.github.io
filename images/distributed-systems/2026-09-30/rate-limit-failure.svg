<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-label="分區隔離時的有限准入與恢復"><title>分區隔離時的有限准入與恢復</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="600" height="560" fill="#ffffff"/><text x="300" y="35" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">失聯時只消耗已確認且未過期的額度</text><rect x="65" y="60" width="470" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="89" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">權威分區失聯：判定 deadline 到期</text><path d="M300,125 L165,158" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300,125 L435,158" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="161" width="260" height="88" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="165.0" y="190" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">集中模式</text><text x="165.0" y="217" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">沒有確認 → 503</text><rect x="320" y="161" width="245" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="442.5" y="190" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">局部 grant 模式</text><text x="442.5" y="217" font-family="Arial, Noto Sans CJK TC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#0f172a">檢查期限與剩量</text><path d="M435,249 L435,285" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y=