<svg xmlns="http://www.w3.org/2000/svg" width="680" height="895" viewBox="0 0 680 895" role="img" aria-labelledby="title desc"><title id="title">One tenant&#x27;s burst can delay another</title><desc id="desc">One tenant&#x27;s burst can delay another. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="895" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">One tenant&#x27;s burst can delay another</text>
<rect x="20" y="68" width="640" height="237" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. Two tenants share the platform</text>
<rect x="60" y="135" width="250" height="78" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="185.0" y="162" text-anchor="middle" class="small">tenant A</text>
<text x="185.0" y="187" text-anchor="middle" class="small">batch burst</text>
<rect x="370" y="135" width="250" height="78" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="495.0" y="162" text-anchor="middle" class="small">tenant B</text>
<text x="495.0" y="187" text-anchor="middle" class="small">normal requests</text>
<rect x="105" y="236" width="470" height="49" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="340.0" y="263" text-anchor="middle" class="small">API keys authenticate the tenant</text>
<line x1="185" y1="216" x2="245" y2="232" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<line x1="495" y1="216" x2="435" y2="232" stroke="#087c72" stroke-width="3" marker-end="url(#teal)"/>
<rect x="20" y="329" width="640" height="265" rx="12" fill="#f0f5fa"/>
<text x="40" y="365" text-anchor="start" class="bold">2. Multiple entry points feed shared capacity</text>
<rect x="65" y="391" width="230" height="66" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="180.0" y="418" text-anchor="middle" class="small">gateway 1</text>
<rect x="385" y="391" width="230" height="66" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="500.0" y="418" text-anchor="middle" class="small">gateway 2</text>
<rect x="152" y="500" width="376" height="63" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="340.0" y="527" text-anchor="middle" class="small">shared backend queue</text>
<line x1="180" y1="462" x2="250" y2="495" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="500" y1="462" x2="430" y2="495" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<rect x="20" y="618" width="640" height="194" rx="12" fill="#f0f5fa"/>
<text x="40" y="654" text-anchor="start" class="bold">3. Decide whose budget protects this work</text>
<text x="45" y="682" text-anchor="start">A&#x27;s burst consumes service and queue space.</text>
<text x="45" y="734" text-anchor="start" class="small">B waits even when B&#x27;s own traffic is unchanged.</text>
<text x="36" y="856" text-anchor="start" class="small">Author scenario; quota algorithm is derived later.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#183047" i]{fill:#c8d5e1}[fill="#b55b0c" i]{fill:#e79c59}[fill="#b83232" i]{fill:#df8a8a}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}}</style>
</svg>
