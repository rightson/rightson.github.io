<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" aria-labelledby="title desc"><title id="title">Local IDs become ambiguous after merging</title><desc id="desc">Local IDs become ambiguous after merging. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="850" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">Local IDs become ambiguous after merging</text>
<rect x="20" y="68" width="640" height="201" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. Each partition creates a local object</text>
<rect x="55" y="134" width="250" height="95" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="180.0" y="161" text-anchor="middle" class="small">partition A</text>
<text x="180.0" y="186" text-anchor="middle" class="small">order ID = 101</text>
<rect x="375" y="134" width="250" height="95" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="500.0" y="161" text-anchor="middle" class="small">partition B</text>
<text x="500.0" y="186" text-anchor="middle" class="small">order ID = 101</text>
<rect x="20" y="293" width="640" height="272" rx="12" fill="#f0f5fa"/>
<text x="40" y="329" text-anchor="start" class="bold">2. A common index removes the local context</text>
<rect x="173" y="365" width="334" height="102" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="340.0" y="392" text-anchor="middle" class="small">shared lookup / audit</text>
<text x="340.0" y="417" text-anchor="middle" class="small">101 -&gt; which object?</text>
<path d="M 180,234 L 38,284 L 38,415 L 166,415" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<path d="M 500,234 L 642,284 L 642,415 L 514,415" fill="none" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<text x="40" y="531" text-anchor="start" class="small">The collision is in the lookup contract.</text>
<rect x="20" y="588" width="640" height="188" rx="12" fill="#f0f5fa"/>
<text x="40" y="624" text-anchor="start" class="bold">3. Define the scope before choosing an algorithm</text>
<text x="45" y="650" text-anchor="start">partition + local ID</text>
<text x="45" y="703" text-anchor="start">or an ID unique across all participating writers</text>
<text x="36" y="820" text-anchor="start" class="small">Author scenario; no range or timestamp design chosen yet.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#183047" i]{fill:#c8d5e1}[fill="#b55b0c" i]{fill:#e79c59}[fill="#b83232" i]{fill:#df8a8a}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}}</style>
</svg>
