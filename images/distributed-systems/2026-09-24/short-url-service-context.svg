<svg xmlns="http://www.w3.org/2000/svg" width="680" height="795" viewBox="0 0 680 795" role="img" aria-labelledby="title desc"><title id="title">A short link has a lifecycle</title><desc id="desc">A short link has a lifecycle. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="795" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">A short link has a lifecycle</text>
<rect x="20" y="68" width="640" height="203" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. Create something convenient to share</text>
<rect x="50" y="128" width="175" height="84" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="137.5" y="155" text-anchor="middle" class="small">creator</text>
<text x="137.5" y="180" text-anchor="middle" class="small">long URL</text>
<rect x="408" y="128" width="210" height="84" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="513.0" y="155" text-anchor="middle" class="small">short-link service</text>
<text x="513.0" y="180" text-anchor="middle" class="small">returns short URL</text>
<line x1="232" y1="170" x2="402" y2="170" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<text x="270" y="155" text-anchor="start" class="small">create</text>
<rect x="20" y="293" width="640" height="224" rx="12" fill="#f0f5fa"/>
<text x="40" y="329" text-anchor="start" class="bold">2. Opening the link must resolve its meaning</text>
<rect x="50" y="353" width="175" height="84" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="137.5" y="380" text-anchor="middle" class="small">recipient</text>
<text x="137.5" y="405" text-anchor="middle" class="small">short URL</text>
<rect x="408" y="353" width="210" height="84" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="513.0" y="380" text-anchor="middle" class="small">service</text>
<text x="513.0" y="405" text-anchor="middle" class="small">redirect / stop</text>
<line x1="232" y1="389" x2="402" y2="389" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="402" y1="418" x2="232" y2="418" stroke="#087c72" stroke-width="3" marker-end="url(#teal)"/>
<text x="278" y="374" text-anchor="start" class="small">open</text>
<text x="252" y="474" text-anchor="start" class="small">destination or explicit refusal</text>
<rect x="20" y="542" width="640" height="177" rx="12" fill="#f0f5fa"/>
<text x="40" y="578" text-anchor="start" class="bold">3. The owner can end the link&#x27;s validity</text>
<rect x="50" y="604" width="175" height="68" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="137.5" y="631" text-anchor="middle" class="small">owner</text>
<text x="137.5" y="656" text-anchor="middle" class="small">expiry / revoke</text>
<rect x="408" y="604" width="210" height="68" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="513.0" y="631" text-anchor="middle" class="small">service</text>
<text x="513.0" y="656" text-anchor="middle" class="small">honor new status</text>
<line x1="232" y1="638" x2="402" y2="638" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<text x="36" y="764" text-anchor="start" class="small">Author service scenario; storage and caching undecided.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#183047" i]{fill:#c8d5e1}[fill="#b55b0c" i]{fill:#e79c59}[fill="#b83232" i]{fill:#df8a8a}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}}</style>
</svg>
