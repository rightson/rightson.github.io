<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<style>text{font-family:Arial,sans-serif;fill:#1f2937}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.h{font-size:24px;font-weight:700}.s{font-size:18px}@media(prefers-color-scheme:dark){text{fill:#e5e7eb}.box{fill:#111827;stroke:#94a3b8}}</style>
<text x="60" y="55" class="h">Worker ID ownership lifecycle</text>
<rect x="70" y="180" width="230" height="120" rx="16" class="box"/><text x="185" y="230" text-anchor="middle" class="h">Free</text><text x="185" y="265" text-anchor="middle" class="s">尚未授權</text>
<rect x="365" y="180" width="230" height="120" rx="16" class="box"/><text x="480" y="230" text-anchor="middle" class="h">Leased</text><text x="480" y="265" text-anchor="middle" class="s">owner + generation</text>
<rect x="660" y="180" width="230" height="120" rx="16" class="box"/><text x="775" y="230" text-anchor="middle" class="h">Quarantine</text><text x="775" y="265" text-anchor="middle" class="s">等待 reuse barrier</text>
<rect x="955" y="180" width="180" height="120" rx="16" class="box"/><text x="1045" y="230" text-anchor="middle" class="h">Reassign</text><text x="1045" y="265" text-anchor="middle" class="s">new incarnation</text>
<text x="70" y="410" class="h">兩個時間邊界</text>
<text x="70" y="465" class="s">local permit 先到期，舊 process 停止產生新 ID。</text>
<text x="70" y="510" class="s">reuse delay 再結束，新 process 才能使用相同 worker bits。</text>
</svg>