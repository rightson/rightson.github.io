<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 505" role="img"><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:650}.sub{font-size:16px;fill:#435574}.note{font-size:15px;fill:#58677d}.box{fill:#f5f8fc;stroke:#95a6c0;stroke-width:2}.gate{fill:#e9f5ee;stroke:#5a9e75;stroke-width:2}.bad{fill:#fff0ee;stroke:#cf756d;stroke-width:2}.line{stroke:#677b9b;stroke-width:2;fill:none}</style><rect width="680" height="505" fill="#fff"/><text class="title" x="45" y="44">同一個 0.7，量尺方向不同</text><rect class="box" x="45" y="67" width="590" height="78" rx="12"/><text class="head" x="67" y="99">DeepEval 3：矛盾比例</text><text class="sub" x="67" y="125">低分較好；0.7 是舊量尺的上限</text><path class="line" d="M340 145v29"/><path class="line" d="m333 167 7 8 7-8"/><rect class="box" x="45" y="180" width="590" height="78" rx="12"/><text class="head" x="67" y="212">DeepEval 4：未矛盾比例</text><text class="sub" x="67" y="238">高分較好；0.7 是新量尺的下限</text><path class="line" d="M340 258v29"/><path class="line" d="m333 280 7 8 7-8"/><rect class="gate" x="45" y="293" width="590" height="78" rx="12"/><text class="head" x="67" y="325">測試：10 份 context、3 份矛盾</text><text class="sub" x="67" y="351">新分數 0.7，通過；4 份矛盾則 0.6，失敗</text><path class="line" d="M340 371v29"/><path class="line" d="m333 393 7 8 7-8"/><rect class="bad" x="45" y="406" width="590" height="78" rx="12"/><text class="head" x="67" y="438">不可直接接成一條歷史曲線</text><text class="sub" x="67" y="464">保存 metric version、方向與原始 verdict</text></svg>