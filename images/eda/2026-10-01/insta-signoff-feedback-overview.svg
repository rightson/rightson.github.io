<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
<title id="title">INSTA 與 reference signoff 的雙迴圈</title><desc id="desc">Reference signoff 建立權威時序狀態，INSTA 以 GPU 快速評估實體設計候選，只有經正式驗證的候選才能放行。</desc>
<style>.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#315f84;stroke-width:2}.fast{fill:#e8f3fb;stroke:#315f84;stroke-width:2}.gate{fill:#e8f5ed;stroke:#327056;stroke-width:2}.warn{fill:#fff3dc;stroke:#a96e27;stroke-width:2}.h{font:700 26px system-ui,sans-serif;fill:#17364e}.t{font:650 19px system-ui,sans-serif;fill:#17364e}.s{font:16px system-ui,sans-serif;fill:#35536a}.a{stroke:#315f84;stroke-width:3;fill:none;marker-end:url(#arr)}.r{stroke:#a96e27;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#arr2)}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#315f84"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a96e27"/></marker></defs>
<rect class="bg" width="920" height="760" rx="24"/><text class="h" x="40" y="55">快速探索與正式放行，使用不同證據</text>
<rect class="box" x="54" y="105" width="280" height="112" rx="16"/><text class="t" x="78" y="145">Reference signoff tool</text><text class="s" x="78" y="176">netlist / SDC / library / POCV</text><text class="s" x="78" y="201">解析專有 timing semantics</text>
<path class="a" d="M334 160H410"/><rect class="fast" x="410" y="105" width="450" height="112" rx="16"/><text class="t" x="436" y="145">Versioned timing snapshot</text><text class="s" x="436" y="176">graph、arc distributions、clock latency</text><text class="s" x="436" y="201">identity + calibration evidence</text>
<path class="a" d="M635 217V278"/><rect class="fast" x="410" y="278" width="450" height="136" rx="16"/><text class="t" x="436" y="318">INSTA GPU inner loop</text><text class="s" x="436" y="348">gradient proposal → legal action</text><text class="s" x="436" y="376">Top-K propagation → rank candidates</text><text class="s" x="436" y="400">目標：高吞吐探索</text>
<rect class="box" x="54" y="289" width="280" height="112" rx="16"/><text class="t" x="78" y="330">Physical design tool</text><text class="s" x="78" y="361">placement / sizing / parasitic</text><text class="s" x="78" y="386">確保 action 合法</text><path class="a" d="M334 345H410"/><path class="a" d="M520 414V480H284V401"/>
<path class="a" d="M635 414V494"/><rect class="warn" x="410" y="494" width="450" height="92" rx="16"/><text class="t" x="436" y="532">前 N 名回到 reference tool</text><text class="s" x="436" y="561">setup / hold / power / DRC / routing</text>
<path class="a" d="M635 586V638"/><rect class="gate" x="410" y="638" width="450" height="82" rx="16"/><text class="t" x="436" y="674">R2G release gate</text><text class="s" x="436" y="702">權威證據完整才 promote checkpoint</text>
<path class="r" d="M410 540H194V217"/><text class="s" x="76" y="520">模型漂移或誤差超標：</text><text class="s" x="76" y="546">重新匯出與校準</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#315f84" i]{fill:#6c9fc8}[fill="#a96e27" i]{fill:#dead71}.bg{fill:#1a1f27}.box{fill:#1b1f20;stroke:#6c9fc8}.fast{fill:#192730;stroke:#6c9fc8}.gate{fill:#202d25;stroke:#bdd6cb}.warn{fill:#382c15;stroke:#dead71}.h{fill:#c6d6e2}.t{fill:#c6d6e2}.s{fill:#bfcbd4}.a{stroke:#6c9fc8}.r{stroke:#dead71}}</style>
</svg>
