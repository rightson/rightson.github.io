<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
<title id="title">INSTA snapshot 過期與恢復</title><desc id="desc">SDC library netlist 或寄生變更使舊 snapshot 過期，候選被隔離，reference tool 重新匯出並校準後再恢復探索。</desc>
<style>.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#365f82;stroke-width:2}.ok{fill:#e8f5ed;stroke:#367158;stroke-width:2}.bad{fill:#fdebea;stroke:#a44743;stroke-width:2}.warn{fill:#fff3dc;stroke:#a96e27;stroke-width:2}.h{font:700 26px system-ui,sans-serif;fill:#17364e}.t{font:650 18px system-ui,sans-serif;fill:#17364e}.s{font:15px system-ui,sans-serif;fill:#35536a}.a{stroke:#365f82;stroke-width:3;fill:none;marker-end:url(#arr)}.r{stroke:#a44743;stroke-width:3;fill:none;marker-end:url(#arr2)}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#365f82"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a44743"/></marker></defs>
<rect class="bg" width="920" height="760" rx="24"/><text class="h" x="40" y="55">數值仍可輸出，不代表 snapshot 仍有效</text>
<rect class="ok" x="60" y="106" width="330" height="100" rx="16"/><text class="t" x="86" y="145">VALIDATED_SNAPSHOT</text><text class="s" x="86" y="175">manifest + calibration evidence</text>
<path class="a" d="M390 156H525"/><rect class="box" x="525" y="106" width="330" height="100" rx="16"/><text class="t" x="551" y="145">Candidates in flight</text><text class="s" x="551" y="175">ranking / trajectory / ECO patch</text>
<rect class="warn" x="60" y="276" width="330" height="142" rx="16"/><text class="t" x="86" y="316">權威輸入發生變更</text><text class="s" x="86" y="347">SDC exception / library / POCV</text><text class="s" x="86" y="374">netlist topology / parasitic semantics</text><text class="s" x="86" y="401">或抽樣 reference 誤差超標</text>
<path class="r" d="M225 276V206"/><path class="r" d="M390 347H525"/><rect class="bad" x="525" y="276" width="330" height="142" rx="16"/><text class="t" x="551" y="316">SNAPSHOT_STALE</text><text class="s" x="551" y="347">隔離候選，禁止 promote</text><text class="s" x="551" y="374">保留舊輸出供 diff</text><text class="s" x="551" y="401">不以成功 exit code 放行</text>
<path class="a" d="M690 418V482"/><rect class="box" x="525" y="482" width="330" height="100" rx="16"/><text class="t" x="551" y="522">Reference re-export</text><text class="s" x="551" y="552">重建 graph / collateral / tensors</text>
<path class="a" d="M525 532H390"/><rect class="box" x="60" y="482" width="330" height="100" rx="16"/><text class="t" x="86" y="522">固定 validation set</text><text class="s" x="86" y="552">corr / tail error / critical overlap</text>
<path class="a" d="M225 582V648"/><rect class="ok" x="60" y="648" width="330" height="76" rx="16"/><text class="t" x="86" y="683">重新驗證後恢復探索</text><text class="s" x="86" y="707">候選重評估或捨棄</text>
<path class="a" d="M390 686H690V582"/>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#365f82" i]{fill:#b7c6d4}[fill="#a44743" i]{fill:#c06864}.bg{fill:#1a1f27}.box{fill:#1b1f20;stroke:#b7c6d4}.ok{fill:#202d25;stroke:#bdd4ca}.bad{fill:#311816;stroke:#c06864}.warn{fill:#382c15;stroke:#dead71}.h{fill:#c6d6e2}.t{fill:#c6d6e2}.s{fill:#bfcbd4}.a{stroke:#b7c6d4}.r{stroke:#c06864}}</style>
</svg>
