<svg xmlns="http://www.w3.org/2000/svg" width="680" height="865" viewBox="0 0 680 865" role="img" aria-labelledby="title desc"><title id="title">Search width competes with backend cost</title><desc id="desc">Search width competes with backend cost. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="865" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">Search width competes with backend cost</text>
<rect x="20" y="68" width="640" height="210" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. Many placement candidates</text>
<rect x="55" y="135" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="132.5" y="162" text-anchor="middle" class="small">candidate 1</text>
<rect x="261" y="135" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="338.5" y="162" text-anchor="middle" class="small">candidate 2</text>
<rect x="467" y="135" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="544.5" y="162" text-anchor="middle" class="small">candidate 3</text>
<rect x="55" y="200" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="132.5" y="227" text-anchor="middle" class="small">candidate 4</text>
<rect x="261" y="200" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="338.5" y="227" text-anchor="middle" class="small">candidate 5</text>
<rect x="467" y="200" width="155" height="46" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="544.5" y="227" text-anchor="middle" class="small">candidate 6</text>
<rect x="20" y="304" width="640" height="241" rx="12" fill="#f0f5fa"/>
<text x="40" y="340" text-anchor="start" class="bold">2. Cheap proxies select what gets evaluated</text>
<rect x="68" y="373" width="190" height="81" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="163.0" y="400" text-anchor="middle" class="small">fast scoring</text>
<text x="163.0" y="425" text-anchor="middle" class="small">WL / density</text>
<rect x="403" y="373" width="190" height="81" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="498.0" y="400" text-anchor="middle" class="small">keep several</text>
<text x="498.0" y="425" text-anchor="middle" class="small">trade-offs</text>
<line x1="264" y1="411" x2="397" y2="411" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<text x="45" y="514" text-anchor="start" class="small">An early discarded candidate cannot be recovered.</text>
<rect x="20" y="569" width="640" height="221" rx="12" fill="#f0f5fa"/>
<text x="40" y="605" text-anchor="start" class="bold">3. Same backend checks the selected results</text>
<rect x="63" y="635" width="200" height="78" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="163.0" y="662" text-anchor="middle" class="small">physical backend</text>
<text x="163.0" y="687" text-anchor="middle" class="small">routing + timing</text>
<rect x="399" y="635" width="200" height="78" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="499.0" y="662" text-anchor="middle" class="small">final PPA</text>
<text x="499.0" y="687" text-anchor="middle" class="small">accept / reject</text>
<line x1="269" y1="674" x2="393" y2="674" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<text x="40" y="759" text-anchor="start" class="small">Proxy ranking can change after physical implementation.</text>
<text x="36" y="830" text-anchor="start" class="small">Teaching candidate count; not the paper&#x27;s experiment.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#183047" i]{fill:#c8d5e1}[fill="#b55b0c" i]{fill:#e79c59}[fill="#b83232" i]{fill:#df8a8a}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}text{fill:#c8d5e1}}</style>
</svg>
