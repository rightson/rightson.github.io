<svg xmlns="http://www.w3.org/2000/svg" width="840" height="780" viewBox="0 0 840 780" role="img" aria-labelledby="title desc"><title id="title">兩層評估與排名變化</title><desc id="desc">代理指標留下不同取捨的候選，再由完整後端量測；此圖使用假設候選。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#52657a"/></marker></defs><rect width="840" height="780" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, sans-serif" fill="#152b40"><text x="420" y="49" text-anchor="middle" font-size="32" font-weight="bold" fill="#152b40">便宜的探索，昂貴的驗收</text><text x="420" y="84" text-anchor="middle" font-size="21" font-weight="normal" fill="#152b40">示意候選，不是論文量測結果</text><rect x="90" y="121" width="660" height="95" rx="12" fill="#edf6f4" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="159.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">第一層：線長、密度與擁塞代理指標</text><text x="420.0" y="193.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">先保留不同取捨，再控制後端候選數</text><path d="M220 216 V252" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 216 V252" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="265" width="335" height="106" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="232.5" y="309.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">候選 A</text><text x="232.5" y="343.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">較短線長 / 較高擁塞</text><rect x="440" y="265" width="335" height="106" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="607.5" y="309.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">候選 B</text><text x="607.5" y="343.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">稍長線長 / 較低擁塞</text><text x="420" y="411" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">C 被支配，暫不送後端</text><path d="M232 371 V447" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M607 371 V447" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="460" width="660" height="112" rx="12" fill="#eef4fa" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="490.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">第二層：相同基準與後端 flow</text><text x="420.0" y="524.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">實際完成 place-opt、CTS、routing</text><text x="420.0" y="558.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">取得可比較的實體結果</text><path d="M232 572 V608" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M607 572 V608" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="620" width="335" height="90" rx="12" fill="#fff0eb" stroke="#c87960" stroke-width="2"/><text x="232.5" y="656.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">A：setup slack −0.08 ns</text><text x="232.5" y="690.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">未通過 setup 條件</text><rect x="440" y="620" width="335" height="90" rx="12" fill="#edf6f4" stroke="#589b90" stroke-width="2"/><text x="607.5" y="656.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">B：setup slack +0.01 ns</text><text x="607.5" y="690.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">通過 setup 這一條</text><text x="420" y="752" text-anchor="middle" font-size="20" font-weight="normal" fill="#152b40">B 仍須通過其餘接受條件；代理 Pareto 不保證最終最優</text></g></svg>