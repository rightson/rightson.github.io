<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">IP reuse has an integration boundary</title><desc id="desc">IP reuse has an integration boundary. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="820" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">IP reuse has an integration boundary</text>
<rect x="20" y="68" width="640" height="420" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. A subsystem enters a new SoC</text>
<rect x="55" y="132" width="300" height="275" rx="12" fill="#e4f3ec" stroke="#087c72" stroke-width="2"/>
<text x="205" y="164" text-anchor="middle" class="bold">reusable baseline</text>
<rect x="80" y="201" width="110" height="66" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="135.0" y="228" text-anchor="middle" class="small">CPU</text>
<rect x="220" y="201" width="110" height="66" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="275.0" y="228" text-anchor="middle" class="small">system IP</text>
<rect x="100" y="324" width="210" height="58" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="205.0" y="351" text-anchor="middle" class="small">shared memory map</text>
<line x1="135" y1="271" x2="135" y2="319" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="275" y1="271" x2="275" y2="319" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<rect x="428" y="199" width="180" height="91" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="518.0" y="226" text-anchor="middle" class="small">custom</text>
<text x="518.0" y="251" text-anchor="middle" class="small">accelerator</text>
<text x="518.0" y="276" text-anchor="middle" class="small">DMA</text>
<path d="M 518,293 L 518,352 L 317,352" fill="none" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<text x="410" y="404" text-anchor="start" class="small">new traffic</text>
<text x="42" y="460" text-anchor="start" class="small">The extension must preserve shared assumptions.</text>
<rect x="20" y="513" width="640" height="232" rx="12" fill="#f0f5fa"/>
<text x="40" y="549" text-anchor="start" class="bold">2. Reuse evidence only where assumptions hold</text>
<rect x="52" y="550" width="570" height="39" rx="12" fill="#ffffff"/>
<text x="70" y="575" text-anchor="start">addresses + ordering</text>
<rect x="52" y="600" width="570" height="39" rx="12" fill="#ffffff"/>
<text x="70" y="625" text-anchor="start">clock / reset / power</text>
<rect x="52" y="650" width="570" height="39" rx="12" fill="#ffffff"/>
<text x="70" y="675" text-anchor="start">versions + validation conditions</text>
<text x="36" y="785" text-anchor="start" class="small">Author reference model; not Arm&#x27;s internal block diagram.</text>
