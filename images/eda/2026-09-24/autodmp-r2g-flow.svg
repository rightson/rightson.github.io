<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" role="img" aria-labelledby="title desc"><title id="title">AutoDMP 的 R2G 整合接點</title><desc id="desc">依據公開程式整理的 PreDP、GPU 搜尋和 PostDP 三段流程。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#52657a"/></marker></defs><rect width="840" height="900" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, sans-serif" fill="#152b40"><text x="420" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#152b40">AutoDMP 的 R2G 整合接點</text><text x="420" y="82" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">前處理、探索與後端各有明確責任</text><rect x="130" y="115" width="580" height="90" rx="12" fill="#eef4fa" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="151.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">netlist · SDC · libraries · floorplan</text><text x="420.0" y="185.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">既有 synthesis / physical 設定</text><path d="M420 205 V239" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130" y="250" width="580" height="95" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="288.5" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">PreDP：準備並保存設計狀態</text><text x="420.0" y="322.5" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">checkpoint + Bookshelf 匯出</text><path d="M420 345 V386" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="399" width="740" height="205" rx="16" fill="#edf6f4" stroke="#589b90" stroke-width="2"/><text x="420" y="434" text-anchor="middle" font-size="23" font-weight="bold" fill="#152b40">探索節點（CPU 調度 / GPU 求解）</text><rect x="75" y="462" width="290" height="86" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="220.0" y="496.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">MOTPE</text><text x="220.0" y="530.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">參數提議 / 樣本更新</text><rect x="450" y="462" width="315" height="86" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="607.5" y="496.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">DREAMPlace + ABCDPlace</text><text x="607.5" y="530.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">佈局、合法化與代理評分</text><path d="M365 486 H440" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="405" y="476" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">參數</text><path d="M607 548 V581 H220 V558" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="575" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">線長 / 密度 / 擁塞</text><path d="M607 604 V631 H420 V647" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="130" y="657" width="580" height="66" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="698.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">Pareto 篩選後的候選 DEF</text><path d="M420 723 V758" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="75" y="770" width="690" height="89" rx="12" fill="#eef4fa" stroke="#8fa5bc" stroke-width="2"/><text x="420.0" y="805.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">CPU 後端：重載基準並匯入候選</text><text x="420.0" y="839.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">place-opt → CTS → route → post-route</text><text x="420" y="887" text-anchor="middle" font-size="19" font-weight="normal" fill="#152b40">研究流程的工具報告，不等於所有量產 signoff 已完成</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#152b40" i]{fill:#cad7e3}[fill="#52657a" i]{fill:#bbc1c9}[fill="#edf6f4" i]{fill:#1f2a28}[fill="#eef4fa" i]{fill:#1b232c}[fill="#f8fafc" i]{fill:#1a2026}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#52657a" i]{stroke:#bbc1c9}[stroke="#589b90" i]{stroke:#7cb4ab}[stroke="#8fa5bc" i]{stroke:#a6b7ca}}</style>
</svg>