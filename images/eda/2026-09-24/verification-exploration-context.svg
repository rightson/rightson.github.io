<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" aria-labelledby="title desc"><title id="title">Stimulus search needs fixed acceptance</title><desc id="desc">Stimulus search needs fixed acceptance. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="850" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">Stimulus search needs fixed acceptance</text>
<rect x="20" y="68" width="640" height="516" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. Explore behavior; retain the evidence</text>
<rect x="63" y="142" width="200" height="80" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="163.0" y="169" text-anchor="middle" class="small">stimulus</text>
<text x="163.0" y="194" text-anchor="middle" class="small">proposal</text>
<rect x="406" y="142" width="200" height="80" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="506.0" y="169" text-anchor="middle" class="small">DUT + simulator</text>
<text x="506.0" y="194" text-anchor="middle" class="small">run identity</text>
<rect x="406" y="389" width="200" height="80" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="506.0" y="416" text-anchor="middle" class="small">coverage</text>
<text x="506.0" y="441" text-anchor="middle" class="small">observations</text>
<rect x="63" y="389" width="200" height="80" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="163.0" y="416" text-anchor="middle" class="small">next stimulus</text>
<text x="163.0" y="441" text-anchor="middle" class="small">selection</text>
<line x1="269" y1="182" x2="400" y2="182" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="506" y1="228" x2="506" y2="383" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="400" y1="429" x2="269" y2="429" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<line x1="163" y1="383" x2="163" y2="228" stroke="#1766ad" stroke-width="3" marker-end="url(#blue)"/>
<text x="47" y="540" text-anchor="start" class="small">Feedback guides the next attempt, not the verdict.</text>
<rect x="20" y="608" width="640" height="174" rx="12" fill="#f0f5fa"/>
<text x="40" y="644" text-anchor="start" class="bold">2. Acceptance remains independently defined</text>
<rect x="60" y="668" width="215" height="69" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="167.5" y="695" text-anchor="middle" class="small">locked assertions</text>
<text x="167.5" y="720" text-anchor="middle" class="small">coverage model</text>
<rect x="407" y="668" width="215" height="69" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="514.5" y="695" text-anchor="middle" class="small">independent</text>
<text x="514.5" y="720" text-anchor="middle" class="small">checks / verdict</text>
<line x1="281" y1="702" x2="401" y2="702" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<text x="36" y="824" text-anchor="start" class="small">Author design; not a disclosed Qualcomm/AWS system.</text>
