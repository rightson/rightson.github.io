<svg xmlns="http://www.w3.org/2000/svg" width="840" height="780" viewBox="0 0 840 780" role="img" aria-labelledby="title desc"><title id="title">候選與基準設計的驗收邊界</title><desc id="desc">作者提出的移植方案：先比對設計身分，再執行驗收，失敗不得晉升。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#52657a"/></marker></defs><rect width="840" height="780" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, sans-serif" fill="#152b40"><text x="420" y="49" text-anchor="middle" font-size="31" font-weight="bold" fill="#152b40">先驗設計身分，再信工具結果</text><text x="420" y="83" text-anchor="middle" font-size="21" font-weight="normal" fill="#152b40">作者設計：移植到共用平台的補強</text><rect x="50" y="117" width="485" height="84" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="292.5" y="150.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">候選 DEF + 基準設計識別</text><text x="292.5" y="184.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">netlist / SDC / checkpoint 摘要</text><path d="M292 201 V235" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="248" width="485" height="80" rx="12" fill="#eef4fa" stroke="#8fa5bc" stroke-width="2"/><text x="292.5" y="296.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">版本、instance 與單位吻合？</text><path d="M535 288 H574" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="555" y="276" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">否</text><rect x="585" y="250" width="205" height="120" rx="12" fill="#fff0eb" stroke="#c87960" stroke-width="2"/><text x="687.5" y="284.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">隔離候選</text><text x="687.5" y="318.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">保存診斷</text><text x="687.5" y="352.0" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">禁止匯入</text><path d="M292 328 V361" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="313" y="352" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">是</text><rect x="50" y="374" width="485" height="90" rx="12" fill="#ffffff" stroke="#8fa5bc" stroke-width="2"/><text x="292.5" y="410.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">建立獨立 run</text><text x="292.5" y="444.0" text-anchor="middle" font-size="24" font-weight="normal" fill="#152b40">執行已核准的後端 flow</text><path d="M292 464 V498" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="512" width="485" height="93" rx="12" fill="#eef4fa" stroke="#8fa5bc" stroke-width="2"/><text x="292.5" y="549.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">輸出完整且接受條件通過？</text><text x="292.5" y="583.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#152b40">stage / corner / flow 版本一致</text><path d="M535 559 H574" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="555" y="547" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">否</text><rect x="585" y="508" width="205" height="121" rx="12" fill="#fff0eb" stroke="#c87960" stroke-width="2"/><text x="687.5" y="542.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">記錄失敗</text><text x="687.5" y="576.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">保留基準</text><text x="687.5" y="610.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">依策略重跑</text><path d="M687 508 V419 H546" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M292 605 V637" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="313" y="629" text-anchor="middle" font-size="18" font-weight="normal" fill="#152b40">是</text><rect x="50" y="650" width="485" height="81" rx="12" fill="#edf6f4" stroke="#589b90" stroke-width="2"/><text x="292.5" y="681.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">建立接受紀錄</text><text x="292.5" y="715.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#152b40">結果與輸入可追溯</text><text x="420" y="765" text-anchor="middle" font-size="21" font-weight="normal" fill="#152b40">完成旗標或部分報告，不是接受紀錄</text></g></svg>