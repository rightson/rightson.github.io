<rect x="32" y="464" width="776" height="150" rx="14" fill="white" stroke="#c7d3df"/>
<text x="54" y="501" class="tag">2026／09／08 · 官方計畫</text><text x="54" y="541" class="t">AWS／Bedrock：深化 EDA 工作負載使用</text>
