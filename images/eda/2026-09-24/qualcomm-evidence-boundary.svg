<text x="54" y="242" class="b">Project C：每個 block 的 grid usage −10–15%</text>
<rect x="32" y="294" width="776" height="150" rx="14" fill="white" stroke="#c7d3df"/>
<text x="54" y="331" class="tag">2026／09／03 · 研究發表與作者分享</text><text x="54" y="371" class="t">FunCovr.ai：對準驗證不足的邏輯</text>
