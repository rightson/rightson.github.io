<svg xmlns="http://www.w3.org/2000/svg" width="680" height="965" viewBox="0 0 680 965" role="img" aria-labelledby="title desc"><title id="title">Facility power supports both IT and cooling</title><desc id="desc">Facility power supports both IT and cooling. Conceptual diagram, not to scale.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#183047"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183047;font-size:22px}.small{font-size:19px}.head{font-size:25px;font-weight:700}.bold{font-weight:700}</style>
<rect x="0" y="0" width="680" height="965" rx="12" fill="#ffffff"/>
<text x="28" y="42" text-anchor="start" class="head">Facility power supports both IT and cooling</text>
<rect x="20" y="68" width="640" height="279" rx="12" fill="#f0f5fa"/>
<text x="40" y="104" text-anchor="start" class="bold">1. The connection limit is shared</text>
<rect x="198" y="122" width="284" height="70" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="340.0" y="149" text-anchor="middle" class="small">facility input power</text>
<rect x="45" y="245" width="255" height="70" rx="12" fill="#ffffff" stroke="#087c72" stroke-width="2"/>
<text x="172.5" y="272" text-anchor="middle" class="small">IT load</text>
<text x="172.5" y="297" text-anchor="middle" class="small">useful compute</text>
<rect x="380" y="245" width="255" height="70" rx="12" fill="#ffffff" stroke="#b55b0c" stroke-width="2"/>
<text x="507.5" y="272" text-anchor="middle" class="small">cooling + losses</text>
<text x="507.5" y="297" text-anchor="middle" class="small">support overhead</text>
<line x1="278" y1="198" x2="175" y2="239" stroke="#087c72" stroke-width="3" marker-end="url(#teal)"/>
<line x1="402" y1="198" x2="505" y2="239" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<rect x="20" y="373" width="640" height="368" rx="12" fill="#f0f5fa"/>
<text x="40" y="409" text-anchor="start" class="bold">2. Racks use different heat removal paths</text>
<rect x="50" y="440" width="240" height="70" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="170.0" y="467" text-anchor="middle" class="small">existing air rack</text>
<rect x="390" y="440" width="240" height="70" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="510.0" y="467" text-anchor="middle" class="small">liquid-cooled rack</text>
<rect x="50" y="582" width="240" height="70" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="170.0" y="609" text-anchor="middle" class="small">air cooling path</text>
<rect x="390" y="582" width="240" height="70" rx="12" fill="#ffffff" stroke="#1766ad" stroke-width="2"/>
<text x="510.0" y="609" text-anchor="middle" class="small">cold plate + CDU</text>
<line x1="170" y1="516" x2="170" y2="576" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<line x1="510" y1="516" x2="510" y2="576" stroke="#b55b0c" stroke-width="3" marker-end="url(#orange)"/>
<text x="340" y="708" text-anchor="middle" class="small">heat ultimately leaves the facility</text>
<rect x="20" y="765" width="640" height="139" rx="12" fill="#f0f5fa"/>
<text x="40" y="801" text-anchor="start" class="bold">3. Efficiency is a capacity allocation decision</text>
<text x="42" y="825" text-anchor="start" class="small">PUE = facility energy / IT equipment energy</text>
<text x="42" y="874" text-anchor="start" class="small">Retrofit cost and actual utilization still matter.</text>
<text x="36" y="940" text-anchor="start" class="small">Generic heat paths; not a vendor product plumbing diagram.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#183047" i]{fill:#c8d5e1}[fill="#b55b0c" i]{fill:#e79c59}[fill="#b83232" i]{fill:#df8a8a}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}}</style>
</svg>
