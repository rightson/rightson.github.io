<svg xmlns="http://www.w3.org/2000/svg" width="600" height="940" viewBox="0 0 600 940" role="img" aria-labelledby="title desc"><title id="title">800G EML DR8 的雙向訊號路徑</title><desc id="desc">主機端 PCS/FEC 與模組等化重定時分開，左側發射，右側接收。一般 retimed 架構示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:26px}.small{font-size:22px;fill:#536575}.head{font-size:30px;font-weight:700}.bold{font-weight:700}</style><rect width="600" height="940" rx="16" fill="#ffffff"/><text x="24" y="44" text-anchor="start" class="head">從主機到光纖，工作如何分配</text><text x="24" y="78" text-anchor="start" class="small">800G EML DR8・一般 retimed 架構</text><rect x="70" y="102" width="460" height="96" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="300.0" y="133" text-anchor="middle" class="bold">主機 ASIC</text><text x="300.0" y="164" text-anchor="middle" class="small">PCS／FEC ＋ SerDes</text><rect x="20" y="224" width="560" height="576" rx="16" fill="none" stroke="#8c99a6" stroke-width="2" stroke-dasharray="8 6"/><text x="38" y="257" text-anchor="start" class="small">可插拔模組</text><rect x="42" y="280" width="516" height="90" rx="12" fill="#efeaf7" stroke="#8c99a6"/><text x="300.0" y="311" text-anchor="middle" class="bold">模組 DSP</text><text x="300.0" y="342" text-anchor="middle" class="small">等化、重定時</text><line x1="265" y1="200" x2="265" y2="278" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="335" y1="278" x2="335" y2="200" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="411" text-anchor="middle" class="bold">發射</text><text x="520" y="411" text-anchor="middle" class="bold">接收</text><rect x="40" y="430" width="240" height="88" rx="12" fill="#fdf3ea" stroke="#8c99a6"/><text x="160.0" y="461" text-anchor="middle" class="bold">Driver</text><text x="160.0" y="492" text-anchor="middle" class="small">提供調變驅動</text><rect x="40" y="554" width="240" height="88" rx="12" fill="#fdf3ea" stroke="#8c99a6"/><text x="160.0" y="585" text-anchor="middle" class="bold">EML ×8</text><text x="160.0" y="616" text-anchor="middle" class="small">光源＋調變</text><rect x="40" y="678" width="240" height="88" rx="12" fill="#fdf3ea" stroke="#8c99a6"/><text x="160.0" y="709" text-anchor="middle" class="bold">透鏡／FA</text><text x="160.0" y="740" text-anchor="middle" class="small">耦合進光纖</text><rect x="320" y="430" width="240" height="88" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="440.0" y="461" text-anchor="middle" class="bold">TIA</text><text x="440.0" y="492" text-anchor="middle" class="small">電流轉電壓</text><rect x="320" y="554" width="240" height="88" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="440.0" y="585" text-anchor="middle" class="bold">PD</text><text x="440.0" y="616" text-anchor="middle" class="small">光轉電流</text><rect x="320" y="678" width="240" height="88" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="440.0" y="709" text-anchor="middle" class="bold">透鏡／FA</text><text x="440.0" y="740" text-anchor="middle" class="small">接收光</text><line x1="160" y1="370" x2="160" y2="428" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="160" y1="518" x2="160" y2="552" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="160" y1="642" x2="160" y2="676" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="160" y1="766" x2="160" y2="824" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="824" x2="440" y2="768" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="676" x2="440" y2="644" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="552" x2="440" y2="520" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><line x1="440" y1="428" x2="440" y2="372" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><re