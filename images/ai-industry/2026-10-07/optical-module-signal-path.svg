<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img" aria-labelledby="title desc"><title id="title">800G 光收發模組的訊號路徑</title><desc id="desc">主機電訊號經 DSP、Driver、EML 雷射與光學次組件轉成光送出；回程光經光學次組件、PD、TIA 回到 DSP。依據股癌 EP702 口述與公開規格重繪的示意圖，不按比例。</desc><defs><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><style>text{font-family:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","WenQuanYi Zen Hei",Arial,sans-serif;fill:#183047;font-size:20px}.small{font-size:17px;fill:#5b6b7a}.head{font-size:24px;font-weight:700}.bold{font-weight:700}.w{fill:#ffffff;font-weight:700}</style><rect x="0" y="0" width="680" height="880" rx="12" fill="#ffffff"/><text x="28" y="42" class="head">800G 光收發模組裡的兩條路</text><rect x="150" y="66" width="380" height="70" rx="10" fill="#eef1f4" stroke="#8c99a6" stroke-width="2"/><text x="340.0" y="95.0" text-anchor="middle" class="bold">交換器或 GPU 伺服器</text><text x="340.0" y="121.0" text-anchor="middle" class="small">高速電訊號</text><rect x="20" y="160" width="640" height="560" rx="14" fill="none" stroke="#8c99a6" stroke-width="2" stroke-dasharray="8 6"/><text x="340" y="714" text-anchor="middle" class="small">模組外殼另含 PCB、MCU、TEC</text><rect x="40" y="190" width="600" height="90" rx="10" fill="#efeaf7" stroke="#6a4fa3" stroke-width="2"/><text x="340.0" y="229.0" text-anchor="middle" class="bold">DSP</text><text x="340.0" y="255.0" text-anchor="middle" class="small">等化、重定時、糾錯，收發共用</text><text x="190" y="318" class="bold" style="fill:#b55b0c">發射：電 → 光</text><text x="490" y="318" text-anchor="end" class="bold" style="fill:#1766ad">接收：光 → 電</text><rect x="40" y="336" width="270" height="92" rx="10" fill="#fdf3ea" stroke="#b55b0c" stroke-width="2"/><text x="175.0" y="376.0" text-anchor="middle" class="bold">Driver</text><text x="175.0" y="402.0" text-anchor="middle" class="small">放大以驅動雷射</text><rect x="40" y="466" width="270" height="92" rx="10" fill="#fdf3ea" stroke="#b55b0c" stroke-width="2"/><text x="175.0" y="506.0" text-anchor="middle" class="bold">EML 雷射 ×8</text><text x="175.0" y="532.0" text-anchor="middle" class="small">電訊號調變成光</text><rect x="40" y="596" width="270" height="92" rx="10" fill="#fdf3ea" stroke="#b55b0c" stroke-width="2"/><text x="175.0" y="636.0" text-anchor="middle" class="bold">透鏡・隔離器・FA</text><text x="175.0" y="662.0" text-anchor="middle" class="small">把光對準耦合進光纖</text><rect x="370" y="336" width="270" height="92" rx="10" fill="#e9f1fa" stroke="#1766ad" stroke-width="2"/><text x="505.0" y="376.0" text-anchor="middle" class="bold">TIA</text><text x="505.0" y="402.0" text-anchor="middle" class="small">電流轉電壓並放大</text><rect x="370" y="466" width="270" height="92" rx="10" fill="#e9f1fa" stroke="#1766ad" stroke-width="2"/><text x="505.0" y="506.0" text-anchor="middle" class="bold">PD 光偵測器</text><text x="505.0" y="532.0" text-anchor="middle" class="small">光轉成電流</text><rect x="370" y="596" width="270" height="92" rx="10" fill="#e9f1fa" stroke="#1766ad" stroke-width="2"/><text x="505.0" y="636.0" text-anchor="middle" class="bold">透鏡・FA</text><text x="505.0" y="662.0" text-anchor="middle" class="small">光從光纖耦合回來</text><line x1="175" y1="280" x2="175" y2="334" stroke="#b55b0c" stroke-width="3" marker-end="url(#o)"/><line x1="175" y1="428" x2="175" y2="464" stroke="#b55b0c" stroke-width="3" marker-end="url(#o)"/><line x1="175" y1="558" x2="175" y2="594" stroke="#b55b0c" stroke-width="3" marker-end="url(#o)"/><line x1="175" y1="688" x2="175" y2="754" stroke="#b55b0c" stroke-width="3" marker-end="url(#o)"/><line x1="505" y1="754" x2="505" y2="690" stroke="#1766ad" stroke-width="3" marker-end="url(#b)"/><line x1="505" y1="594" x2="505" y2="560" stroke="#1766ad" stroke-width="3" marker-end="url(#b)"/><line x1="505" y1="464" x2="505" y2="430" stroke="#1766ad" stroke-width="3" marker-end="url(#b)"/><line x1="505" y1="334" x2="505" y2="282" stroke="#1766ad" stroke-width="3" marker-end="url(#b)"/><line x1="340" y1="136" x2="340" y2="188" stroke="#b55b0c" stroke-width="3" marker-end="url(#o)"/><rect x="40" y="758" width="600" height="70" rx="10" fill="#e8f5f3" stroke="#087c72" stroke-width="2"/><text x="340.0" y="787.0" text-anchor="middle" class="bold">單模光纖</text><text x="340.0" y="813.0" text-anchor="middle" class="small">DR8 為 8 對平行光纖，傳 500 公尺</text><text x="340" y="862" text-anchor="middle" class="small">出去經 Driver，回來經 TIA，兩邊都經過 DSP</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#b55b0c" i]{fill:#e79c59}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#eef1f4" i]{fill:#212529}[fill="#efeaf7" i]{fill:#241e2d}[fill="#fdf3ea" i]{fill:#312316}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#6a4fa3" i]{stroke:#8b74bb}[stroke="#8c99a6" i]{stroke:#6f7f90}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}.small{fill:#a2aeba}.w{fill:#1b1f20}[style*="fill:#1766ad"]{fill:#5ca5e8 !important}[style*="fill:#b55b0c"]{fill:#e79c59 !important}}</style>
</svg>