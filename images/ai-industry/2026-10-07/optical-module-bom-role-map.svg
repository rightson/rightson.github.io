<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2170" viewBox="0 0 1440 2170" role="img" aria-labelledby="title desc"><title id="title">800G EML DR8 訊號、BOM 與產品分工拆解</title><desc id="desc">每顆模組315美元是假設算例。DSP88、EML92、Driver與TIA合計38、PD24、被動光學29與支援材料44及未解差額6各計一次。公司為有公開能力的例子，不是該算例的已確認供應商。下半部另列矽光及CPO的角色和產品階段。</desc><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:28px}.title{font-size:40px;font-weight:700}.head{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:24px;fill:#536575}.signature{font-size:14px;fill:#536575}</style><rect x="0" y="0" width="1440" height="2170" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><defs><marker id="e" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><defs><marker id="o" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker></defs><defs><marker id="l" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker></defs><defs><marker id="n" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><text x="40" y="56" class="title" text-anchor="start">把功能位置、315 美元與產品階段放在同一張圖</text><text x="40" y="96" class="small" text-anchor="start">基準：800G EML DR8・8×100G・retimed 可插拔・美元／顆模組</text><path d="M40,142 L110,142" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><text x="125" y="150" class="small" text-anchor="start">高速電訊號</text><path d="M350,142 L420,142" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><text x="435" y="150" class="small" text-anchor="start">承載資料的光</text><path d="M730,142 L800,142" fill="none" stroke="#087c72" stroke-width="4" marker-end="url(#l)" stroke-dasharray="10 6"/><text x="815" y="150" class="small" text-anchor="start">CW 供光（尚未調變）</text><rect x="70" y="195" width="740" height="125" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="440.0" y="234" class="bold" text-anchor="middle">主機 ASIC：PCS／FEC ＋ SerDes</text><text x="440.0" y="272" class="small" text-anchor="middle">主機晶片、主機 PCB 與外部光纜：本 BOM 範圍外</text><rect x="40" y="355" width="820" height="985" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2" stroke-dasharray="12 8"/><text x="62" y="393" class="bold" text-anchor="start">可插拔模組</text><text x="355" y="393" class="small" text-anchor="start">每項成本計一次</text><rect x="100" y="438" width="700" height="135" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="450.0" y="477" class="bold" text-anchor="middle">DSP：88 美元・27.9%</text><text x="450.0" y="515" class="small" text-anchor="middle">發射／接收等化與重定時；晶片數與整合依料號</text><path d="M270,321 L270,436" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><path d="M610,436 L610,321" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><text x="80" y="612" class="bold" text-anchor="start">發射 TX</text><text x="665" y="612" class="bold" text-anchor="start">接收 RX</text><rect x="80" y="642" width="740" height="152" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="450" y="681" class="bold" text-anchor="middle">Driver ＋ TIA 合計 38 美元・12.1%</text><rect x="100" y="704" width="280" height="68" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="240.0" y="743" class="bold" text-anchor="middle">Driver：調變驅動</text><rect x="500" y="704" width="280" height="68" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="640.0" y="743" class="bold" text-anchor="middle">TIA：電流轉電壓</text><path d="M240,574 L240,640" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><path d="M640,640 L640,574" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><rect x="100" y="840" width="280" height="140" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="240.0" y="879" class="bold" text-anchor="middle">EML ×8</text><text x="240.0" y="917" class="small" text-anchor="middle">92 美元・29.2%</text><text x="240.0" y="951" class="small" text-anchor="middle">雷射＋EAM 調變器</text><rect x="500" y="840" width="280" height="140" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="640.0" y="879" class="bold" text-anchor="middle">PD：八條接收通道</text><text x="640.0" y="917" class="small" text-anchor="middle">24 美元・7.6%</text><text x="640.0" y="951" class="small" text-anchor="middle">光轉電流</text><path d="M240,795 L240,838" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><path d="M640,838 L640,795" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><rect x="80" y="1030" width="740" height="144" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="450" y="1068" class="bold" text-anchor="middle">被動光學合計 29 美元・9.2%</text><rect x="100" y="1094" width="280" height="60" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="240.0" y="1133" class="bold" text-anchor="middle">發射透鏡／FA</text><rect x="500" y="1094" width="280" height="60" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="640.0" y="1133" class="bold" text-anchor="middle">接收透鏡／FA</text><path d="M240,981 L240,1028" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><path d="M640,1028 L640,981" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><rect x="100" y="1220" width="680" height="83" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="440.0" y="1259" class="bold" text-anchor="middle">8 條 TX ＋ 8 條 RX 單模光纖</text><text x="440.0" y="1297" class="small" text-anchor="middle">畫的是光通道數，非封裝內裸晶數</text><path d="M240,1175 L240,1218" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><path d="M640,1218 L640,1175" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><text x="905" y="235" class="head" text-anchor="start">對應能力例子與公開階段</text><text x="905" y="275" class="small" text-anchor="start">公司名稱對應功能，價格對應成本類別。</text><text x="905" y="309" class="small" text-anchor="start">實際採購名單與報價仍需供應鏈資料。</text><rect x="900" y="435" width="500" height="252" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="922" y="474" class="bold" text-anchor="start">DSP／類比電路</text><text x="922" y="512" class="small" text-anchor="start">Marvell Spica Gen2：800G 產品</text><text x="922" y="546" class="small" text-anchor="start">800G 平台：2026/3 已有量產實績</text><text x="922" y="580" class="small" text-anchor="start">達發 AN8928：106G×8，內建 Driver</text><text x="922" y="614" class="small" text-anchor="start">2026/3/17 公開方案；量產待查</text><text x="922" y="648" class="small" text-anchor="start">Perseus 已列整合 Driver／TIA</text><path d="M860,505 L898,505" fill="none" stroke="#536575" stroke-width="4" marker-end="url(#n)" stroke-dasharray="10 6"/><rect x="900" y="747" width="500" height="243" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="922" y="786" class="bold" text-anchor="start">EML 光源</text><text x="922" y="824" class="small" text-anchor="start">Lumentum：100G EML 官方產品</text><text x="922" y="858" class="small" text-anchor="start">既有 400G 大量製造；列 800G 路徑</text><text x="922" y="892" class="small" text-anchor="start">Coherent：100G/lane EML、800G DR8</text><text x="922" y="926" class="small" text-anchor="start">2024 年報已揭露製造與量產</text><text x="922" y="960" class="small" text-anchor="start">92 美元為整類 EML 假設金額</text><path d="M860,910 L898,910" fill="none" stroke="#536575" stroke-width="4" marker-end="url(#n)" stroke-dasharray="10 6"/><rect x="900" y="1040" width="500" height="267" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="922" y="1079" class="bold" text-anchor="start">PD／耦合／模組整合</text><text x="922" y="1117" class="small" text-anchor="start">PD、透鏡、FA：本例料號待查</text><text x="922" y="1151" class="small" text-anchor="start">被動光學 29 美元涵蓋兩個方向</text><text x="922" y="1185" class="small" text-anchor="start">EML／PD 數是通道級示意</text><text x="922" y="1219" class="small" text-anchor="start">組裝、良率與測試：另核成本範圍</text><text x="922" y="1253" class="small" text-anchor="start">公司能力與產品採用須分別確認</text><path d="M860,1110 L898,1110" fill="none" stroke="#536575" stroke-width="4" marker-end="url(#n)" stroke-dasharray="10 6"/><rect x="40" y="1385" width="820" height="230" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="62" y="1424" class="bold" text-anchor="start">支援材料也是 BOM，未畫進資料串列</text><text x="62" y="1462" class="small" text-anchor="start">PCB／陶瓷基板 14.5（4.6%）</text><text x="62" y="1496" class="small" text-anchor="start">外殼／散熱／連接器 14.5（4.6%）</text><text x="62" y="1530" class="small" text-anchor="start">電源／電阻／電容等 9（2.9%）</text><text x="62" y="1564" class="small" text-anchor="start">原文未解釋差額 6（1.9%）</text><rect x="900" y="1385" width="500" height="230" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="922" y="1424" class="bold" text-anchor="start">成本核對</text><text x="922" y="1462" class="small" text-anchor="start">88＋38＋92＋24＋29＝271</text><text x="922" y="1496" class="small" text-anchor="start">14.5＋14.5＋9＋6＝44</text><text x="922" y="1530" class="small" text-anchor="start">271＋44＝315 美元</text><text x="922" y="1564" class="small" text-anchor="start">整合晶片需合併計價，避免重複</text><text x="40" y="1678" class="head" text-anchor="start">改用矽光／CPO 時，新增角色要另建 BOM</text><text x="40" y="1721" class="small" text-anchor="start">以下是替代架構的產品分工，不列入上方 EML 315 美元。</text><rect x="40" y="1760" width="410" height="292" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="62" y="1799" class="bold" text-anchor="start">CW 光源 → 矽光調變</text><text x="62" y="1837" class="small" text-anchor="start">聯亞：CW 雷射／磊晶</text><text x="62" y="1871" class="small" text-anchor="start">2025 年報揭露產品</text><text x="62" y="1905" class="small" text-anchor="start">特定產品量產份額待查</text><text x="62" y="1939" class="small" text-anchor="start">Lumentum：CW／ELSFP-350</text><text x="62" y="1973" class="small" text-anchor="start">官方產品頁；特定採用待查</text><rect x="515" y="1760" width="410" height="292" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="537" y="1799" class="bold" text-anchor="start">PIC／EIC → 光引擎封裝</text><text x="537" y="1837" class="small" text-anchor="start">台積電：矽光製造</text><text x="537" y="1871" class="small" text-anchor="start">SPIL：光電封裝、組裝、測試</text><text x="537" y="1905" class="small" text-anchor="start">NVIDIA 2026/6 量產平台</text><text x="537" y="1939" class="small" text-anchor="start">公開分工已列；個別收入待查</text><text x="537" y="1973" class="small" text-anchor="start">封裝費與晶粒費分清</text><rect x="990" y="1760" width="410" height="292" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="1012" y="1799" class="bold" text-anchor="start">光引擎 → 完整交換器</text><text x="1012" y="1837" class="small" text-anchor="start">NVIDIA：Spectrum-X Photonics</text><text x="1012" y="1871" class="small" text-anchor="start">2026/6 已宣布量產</text><text x="1012" y="1905" class="small" text-anchor="start">鴻海：系統組裝</text><text x="1012" y="1939" class="small" text-anchor="start">同一量產平台已列分工</text><text x="1012" y="1973" class="small" text-anchor="start">整機收入另按台數建模</text><text x="40" y="2097" class="small" text-anchor="start">假設金額：公開個人拆解；產品階段：IEEE、Marvell、達發、Lumentum、Coherent、聯亞、NVIDIA。</text><text x="40" y="2129" class="small" text-anchor="start">尺寸、光路與公司位置為功能對應示意；315 美元未確認包含所有管理元件、製造、測試及良率成本。</text><text x="1416" y="2152" class="signature" text-anchor="end">Scott Yo-Ru Chen · 2026-10-08</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#536575" i]{fill:#bcc3c9}[fill="#b55b0c" i]{fill:#e79c59}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#efeaf7" i]{fill:#241e2d}[fill="#fdf3ea" i]{fill:#312316}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#536575" i]{stroke:#bcc3c9}[stroke="#8c99a6" i]{stroke:#6f7f90}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}.small{fill:#bcc3c9}.signature{fill:#bcc3c9}}</style>
</svg>