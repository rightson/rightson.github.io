<svg xmlns="http://www.w3.org/2000/svg" width="600" height="935" viewBox="0 0 600 935" role="img" aria-labelledby="title desc"><title id="title">Retimed、LPO 與 CPO 的分工</title><desc id="desc">三個垂直面板依序比較 retimed 可插拔、LPO 與 CPO 的功能位置和取捨，光源可另外選擇。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:26px}.small{font-size:22px;fill:#536575}.head{font-size:30px;font-weight:700}.bold{font-weight:700}</style><rect width="600" height="935" rx="16" fill="#ffffff"/><text x="24" y="43" text-anchor="start" class="head">處理工作與封裝位置怎麼變</text><text x="24" y="78" text-anchor="start" class="small">功能比較示意・光源架構另選</text><rect x="20" y="108" width="560" height="247" rx="16" fill="#e9f1fa" stroke="#8c99a6"/><text x="40" y="145" text-anchor="start" class="bold">Retimed 可插拔</text><text x="40" y="193" text-anchor="start" class="">主機 SerDes → 模組 DSP</text><text x="40" y="230" text-anchor="start" class="">→ 光電轉換 → 光纖</text><text x="40" y="279" text-anchor="start" class="small">模組自行等化與重定時</text><text x="40" y="312" text-anchor="start" class="small">付出 DSP 的材料與功耗</text><rect x="20" y="378" width="560" height="247" rx="16" fill="#e8f5f3" stroke="#8c99a6"/><text x="40" y="415" text-anchor="start" class="bold">LPO</text><text x="40" y="463" text-anchor="start" class="">主機 SerDes → 線性光電轉換</text><text x="40" y="500" text-anchor="start" class="">→ 光纖</text><text x="40" y="549" text-anchor="start" class="small">模組省去數位處理</text><text x="40" y="582" text-anchor="start" class="small">主機、PCB 與鏈路協同要求提高</text><rect x="20" y="648" width="560" height="247" rx="16" fill="#efeaf7" stroke="#8c99a6"/><text x="40" y="685" text-anchor="start" class="bold">CPO</text><text x="40" y="733" text-anchor="start" class="">主機 ASIC → 鄰近光引擎</text><text x="40" y="770" text-anchor="start" class="">→ 光纖</text><text x="40" y="819" text-anchor="start" class="small">縮短高速電氣距離</text><text x="40" y="852" text-anchor="start" class="small">改變封裝、配線與維修分工</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#536575" i]{fill:#bcc3c9}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#efeaf7" i]{fill:#241e2d}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#8c99a6" i]{stroke:#6f7f90}text{fill:#c8d5e1}.small{fill:#bcc3c9}}</style>
</svg>