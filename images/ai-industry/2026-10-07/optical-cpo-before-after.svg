<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1855" viewBox="0 0 1440 1855" role="img" aria-labelledby="title desc"><title id="title">矽光可插拔改成CPO的架構前後</title><desc id="desc">固定使用CW雷射加矽光PIC比較。原本交換ASIC經長PCB電氣通道到面板DSP、EIC和PIC；CPO把EIC和PIC搬到ASIC同一封裝，短電氣通道取代板級高速路徑。外部ELS送未調變CW光到PIC，資料光由光纖到面板被動連接器再去遠端。兩端架構分開。</desc><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:28px}.title{font-size:40px;font-weight:700}.head{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:24px;fill:#536575}.signature{font-size:14px;fill:#536575}</style><rect x="0" y="0" width="1440" height="1855" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><defs><marker id="e" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><defs><marker id="o" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker></defs><defs><marker id="l" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker></defs><defs><marker id="n" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><text x="40" y="56" class="title" text-anchor="start">CPO 前後比較：縮短電氣路徑，供光與資料光分流</text><text x="40" y="100" class="small" text-anchor="start">控制比較：兩邊均採 CW＋矽光；示意單端功能，非特定晶粒 floorplan 或比例尺</text><path d="M40,148 L110,148" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)"/><text x="125" y="156" class="small" text-anchor="start">高速電訊號</text><path d="M350,148 L420,148" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)"/><text x="435" y="156" class="small" text-anchor="start">承載資料的光</text><path d="M730,148 L800,148" fill="none" stroke="#087c72" stroke-width="4" marker-end="url(#l)" stroke-dasharray="10 6"/><text x="815" y="156" class="small" text-anchor="start">CW 供光（尚未調變）</text><rect x="40" y="200" width="1360" height="520" rx="12" fill="#f4f6f5" stroke="#8c99a6" stroke-width="2"/><text x="62" y="243" class="head" text-anchor="start">BEFORE  矽光 retimed 可插拔</text><rect x="65" y="280" width="290" height="330" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2" stroke-dasharray="10 6"/><text x="82" y="314" class="small" text-anchor="start">ASIC 封裝</text><rect x="84" y="355" width="250" height="210" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="209.0" y="394" class="bold" text-anchor="middle">交換 ASIC</text><text x="209.0" y="432" class="small" text-anchor="middle">交換功能</text><text x="209.0" y="466" class="small" text-anchor="middle">PCS／FEC</text><text x="209.0" y="500" class="small" text-anchor="middle">SerDes</text><rect x="630" y="280" width="745" height="420" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2" stroke-dasharray="10 6"/><text x="650" y="314" class="small" text-anchor="start">面板可插拔資料模組（可抽換）</text><rect x="651" y="355" width="180" height="210" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="741.0" y="394" class="bold" text-anchor="middle">DSP</text><text x="741.0" y="432" class="small" text-anchor="middle">TX／RX</text><text x="741.0" y="466" class="small" text-anchor="middle">等化</text><text x="741.0" y="500" class="small" text-anchor="middle">重定時</text><rect x="855" y="355" width="198" height="210" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="954.0" y="394" class="bold" text-anchor="middle">EIC</text><text x="954.0" y="432" class="small" text-anchor="middle">TX Driver</text><text x="954.0" y="466" class="small" text-anchor="middle">RX TIA</text><text x="954.0" y="500" class="small" text-anchor="middle">類比電路</text><rect x="1094" y="355" width="254" height="210" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="1221.0" y="394" class="bold" text-anchor="middle">矽光 PIC</text><text x="1221.0" y="432" class="small" text-anchor="middle">TX 調變器</text><text x="1221.0" y="466" class="small" text-anchor="middle">RX PD</text><text x="1221.0" y="500" class="small" text-anchor="middle">光波導／耦合</text><path d="M356,450 L629,450" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)" marker-start="url(#e)"/><text x="380" y="389" class="small" text-anchor="start">長 PCB 路徑</text><text x="380" y="422" class="small" text-anchor="start">＋連接介面</text><path d="M832,450 L853,450" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)" marker-start="url(#e)"/><path d="M1054,450 L1092,450" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)" marker-start="url(#e)"/><rect x="870" y="631" width="310" height="64" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="1025.0" y="670" class="bold" text-anchor="middle">模組內 CW 雷射</text><path d="M1181,663 L1220,663 L1220,567" fill="none" stroke="#087c72" stroke-width="4" marker-end="url(#l)" stroke-dasharray="10 6"/><path d="M1350,450 L1393,450" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)" marker-start="url(#o)"/><text x="66" y="675" class="small" text-anchor="start">資料光從模組接到外部光纖；光源、DSP 與光學均隨模組維修。</text><rect x="40" y="770" width="1360" height="560" rx="12" fill="#f4f6f5" stroke="#8c99a6" stroke-width="2"/><text x="62" y="813" class="head" text-anchor="start">AFTER  外部 ELS 供光的矽光 CPO</text><rect x="65" y="850" width="910" height="330" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2" stroke-dasharray="10 6"/><text x="82" y="883" class="small" text-anchor="start">共同封裝／MCM：交換 ASIC ＋ 光引擎</text><rect x="84" y="931" width="250" height="210" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="209.0" y="970" class="bold" text-anchor="middle">交換 ASIC</text><text x="209.0" y="1008" class="small" text-anchor="middle">交換功能</text><text x="209.0" y="1042" class="small" text-anchor="middle">PCS／FEC</text><text x="209.0" y="1076" class="small" text-anchor="middle">SerDes</text><rect x="485" y="931" width="190" height="210" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="580.0" y="970" class="bold" text-anchor="middle">EIC</text><text x="580.0" y="1008" class="small" text-anchor="middle">TX Driver</text><text x="580.0" y="1042" class="small" text-anchor="middle">RX TIA</text><text x="580.0" y="1076" class="small" text-anchor="middle">控制／校正</text><rect x="716" y="931" width="235" height="210" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="833.5" y="970" class="bold" text-anchor="middle">矽光 PIC</text><text x="833.5" y="1008" class="small" text-anchor="middle">TX 調變器</text><text x="833.5" y="1042" class="small" text-anchor="middle">RX PD</text><text x="833.5" y="1076" class="small" text-anchor="middle">光波導／耦合</text><path d="M356,1036 L483,1036" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)" marker-start="url(#e)"/><text x="355" y="965" class="small" text-anchor="start">封裝內短</text><text x="355" y="997" class="small" text-anchor="start">電氣路徑</text><path d="M677,1036 L714,1036" fill="none" stroke="#1766ad" stroke-width="4" marker-end="url(#e)" marker-start="url(#e)"/><rect x="1068" y="951" width="306" height="170" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="1221.0" y="990" class="bold" text-anchor="middle">面板被動光纖介面</text><text x="1221.0" y="1028" class="small" text-anchor="middle">耦合／光纖配線</text><text x="1221.0" y="1062" class="small" text-anchor="middle">接往外部資料光纖</text><path d="M953,1036 L1066,1036" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)" marker-start="url(#o)"/><path d="M1376,1036 L1394,1036" fill="none" stroke="#b55b0c" stroke-width="4" marker-end="url(#o)" marker-start="url(#o)"/><rect x="990" y="1220" width="384" height="81" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="1182.0" y="1259" class="bold" text-anchor="middle">外部 ELS：CW 雷射供光</text><text x="1182.0" y="1297" class="small" text-anchor="middle">可更換；設於 ASIC 封裝外</text><path d="M988,1260 L835,1260 L835,1143" fill="none" stroke="#087c72" stroke-width="4" marker-end="url(#l)" stroke-dasharray="10 6"/><text x="66" y="1255" class="small" text-anchor="start">板級長電氣通道改由封裝內短介面承接。</text><text x="66" y="1290" class="small" text-anchor="start">此類方案省去面板獨立 DSP；類比功能仍在 EIC。</text><text x="40" y="1388" class="small" text-anchor="start">右側箭頭連到相同遠端；遠端仍可為可插拔，依相容的速率與光學規格配置。</text><rect x="40" y="1420" width="1360" height="150" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="62" y="1459" class="bold" text-anchor="start">採購內容怎麼搬</text><text x="62" y="1497" class="small" text-anchor="start">DSP／模組 PCB → 光引擎與先進封裝；模組內雷射 → 外部 ELS 與供光光纖。</text><text x="62" y="1531" class="small" text-anchor="start">台積電：矽光製造；SPIL：光電封裝／測試；鴻海：系統組裝（NVIDIA 2026/6 量產平台）。</text><text x="62" y="1565" class="small" text-anchor="start">CPO 金額另估：EIC／PIC＋封裝＋耦合／配線＋ELS 分攤＋電力與熱管理。</text><rect x="40" y="1620" width="1360" height="170" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="62" y="1659" class="bold" text-anchor="start">NVIDIA 公開例子：Spectrum-X Ethernet Photonics</text><text x="62" y="1697" class="small" text-anchor="start">單一 ASIC 封裝：32 個光引擎 × 每引擎 16 TX／16 RX 通道 × 200G/lane。</text><text x="62" y="1731" class="small" text-anchor="start">每引擎 3.2Tb/s；單 ASIC 102.4Tb/s，四 ASIC 系統合計 409.6Tb/s（單方向口徑）。</text><text x="62" y="1765" class="small" text-anchor="start">2025/8 技術文件揭露配置；2026/1 技術更新；2026/6 宣布量產。各款維修與光源數須按型號核對。</text><text x="1416" y="1837" class="signature" text-anchor="end">Scott Yo-Ru Chen · 2026-10-08</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#536575" i]{fill:#bcc3c9}[fill="#b55b0c" i]{fill:#e79c59}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#efeaf7" i]{fill:#241e2d}[fill="#f4f6f5" i]{fill:#202426}[fill="#fdf3ea" i]{fill:#312316}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#087c72" i]{stroke:#44e4d6}[stroke="#1766ad" i]{stroke:#5ca5e8}[stroke="#8c99a6" i]{stroke:#6f7f90}[stroke="#b55b0c" i]{stroke:#e79c59}text{fill:#c8d5e1}.small{fill:#bcc3c9}.signature{fill:#bcc3c9}}</style>
</svg>