<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1990" viewBox="0 0 1440 1990" role="img" aria-labelledby="title desc"><title id="title">光源、訊號處理與封裝的三次選型</title><desc id="desc">三個維度分別比較EML、CW矽光與VCSEL，雙向retimed、發射端retimed和LPO，以及面板可插拔與CPO。功能可組合，需一起滿足距離、光功率和電氣通道條件。</desc><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:28px}.title{font-size:40px;font-weight:700}.head{font-size:32px;font-weight:700}.bold{font-weight:700}.small{font-size:24px;fill:#536575}.signature{font-size:14px;fill:#536575}</style><rect x="0" y="0" width="1440" height="1990" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><defs><marker id="e" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><defs><marker id="o" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker></defs><defs><marker id="l" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#087c72"/></marker></defs><defs><marker id="n" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><text x="40" y="56" class="title" text-anchor="start">先固定鏈路需求，再選三個互相約束的維度</text><text x="40" y="100" class="small" text-anchor="start">比較前固定：總速率／每通道速率／距離／光纖／誤碼與 FEC／功耗／維修方式</text><text x="40" y="168" class="head" text-anchor="start">① 光從哪裡來，資料在哪裡寫進光？</text><rect x="40" y="205" width="440" height="236" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="62" y="244" class="bold" text-anchor="start">EML</text><text x="62" y="282" class="small" text-anchor="start">InP DFB 雷射 ＋ EAM</text><text x="62" y="316" class="small" text-anchor="start">電資料 → EAM → 已調變光</text><text x="62" y="350" class="small" text-anchor="start">一條 TX 通道配置一組 EML</text><text x="62" y="384" class="small" text-anchor="start">高速 InP 製程與耦合是成本項</text><rect x="510" y="205" width="440" height="236" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="532" y="244" class="bold" text-anchor="start">CW ＋ 矽光</text><text x="532" y="282" class="small" text-anchor="start">CW 雷射 → 矽 PIC</text><text x="532" y="316" class="small" text-anchor="start">電資料 → 矽調變器 → 已調變光</text><text x="532" y="350" class="small" text-anchor="start">CW 本身只供光；PD 可整合於 PIC</text><text x="532" y="384" class="small" text-anchor="start">光源數量依分光、功率預算配置</text><rect x="980" y="205" width="440" height="236" rx="12" fill="#fdf3ea" stroke="#8c99a6" stroke-width="2"/><text x="1002" y="244" class="bold" text-anchor="start">VCSEL</text><text x="1002" y="282" class="small" text-anchor="start">電流調變 VCSEL</text><text x="1002" y="316" class="small" text-anchor="start">電資料 → 雷射 → 已調變光</text><text x="1002" y="350" class="small" text-anchor="start">常搭多模光纖、短距離鏈路</text><text x="1002" y="384" class="small" text-anchor="start">距離與光纖條件另依規格</text><text x="40" y="503" class="head" text-anchor="start">② 模組是否做數位等化與重定時？</text><rect x="40" y="540" width="440" height="242" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="62" y="579" class="bold" text-anchor="start">雙向 retimed</text><text x="62" y="617" class="small" text-anchor="start">TX：主機 → DSP → Driver</text><text x="62" y="651" class="small" text-anchor="start">RX：TIA → DSP → 主機</text><text x="62" y="685" class="small" text-anchor="start">DSP 處理兩個方向；模組較自主</text><text x="62" y="719" class="small" text-anchor="start">BOM 需查類比功能是否已整合</text><rect x="510" y="540" width="440" height="242" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="532" y="579" class="bold" text-anchor="start">TRO／部分重定時</text><text x="532" y="617" class="small" text-anchor="start">TX：主機 → DSP → Driver</text><text x="532" y="651" class="small" text-anchor="start">RX：TIA → 主機（線性接收）</text><text x="532" y="685" class="small" text-anchor="start">TX 留 DSP，RX 品質由主機協同</text><text x="532" y="719" class="small" text-anchor="start">Ara T：2026 Q1 起送樣，非全 LPO</text><rect x="980" y="540" width="440" height="242" rx="12" fill="#e9f1fa" stroke="#8c99a6" stroke-width="2"/><text x="1002" y="579" class="bold" text-anchor="start">LPO</text><text x="1002" y="617" class="small" text-anchor="start">TX：主機 → 線性 Driver</text><text x="1002" y="651" class="small" text-anchor="start">RX：線性 TIA → 主機</text><text x="1002" y="685" class="small" text-anchor="start">模組省去數位等化／重定時</text><text x="1002" y="719" class="small" text-anchor="start">主機 SerDes、PCB 與光路共同匹配</text><text x="40" y="844" class="head" text-anchor="start">③ 光電轉換放在面板，還是交換 ASIC 的封裝旁？</text><rect x="40" y="882" width="675" height="220" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="62" y="921" class="bold" text-anchor="start">面板可插拔</text><text x="62" y="959" class="small" text-anchor="start">ASIC → 主機 PCB 電氣通道 → 模組 → 光纖</text><text x="62" y="993" class="small" text-anchor="start">模組內可選 EML／矽光／VCSEL 及處理方式</text><text x="62" y="1027" class="small" text-anchor="start">模組可抽換；長電氣通道由整條鏈路管理</text><text x="62" y="1061" class="small" text-anchor="start">成本單位：每顆模組＋主機端支援</text><rect x="740" y="882" width="660" height="220" rx="12" fill="#e8f5f3" stroke="#8c99a6" stroke-width="2"/><text x="762" y="921" class="bold" text-anchor="start">CPO</text><text x="762" y="959" class="small" text-anchor="start">ASIC → 封裝內短電氣通道 → 光引擎 → 光纖</text><text x="762" y="993" class="small" text-anchor="start">典型矽光方案：EIC＋PIC，雷射可放外部</text><text x="762" y="1027" class="small" text-anchor="start">封裝、光纖連接與光源維修需共同設計</text><text x="762" y="1061" class="small" text-anchor="start">成本單位：每光引擎＋ELS 分攤＋封裝</text><text x="40" y="1163" class="head" text-anchor="start">將三個選項組成產品，再對照成本與公開產品</text><text x="54" y="1220" class="bold" text-anchor="start">配置</text><text x="159" y="1220" class="bold" text-anchor="start">光源／調變</text><text x="479" y="1220" class="bold" text-anchor="start">處理與位置</text><text x="844" y="1220" class="bold" text-anchor="start">成本變化／產品例子</text><rect x="40" y="1248" width="1360" height="106" rx="12" fill="#f4f6f5" stroke="#8c99a6" stroke-width="2"/><text x="54" y="1291" class="bold" text-anchor="start">A</text><text x="159" y="1291" class="" text-anchor="start">EML</text><text x="479" y="1291" class="" text-anchor="start">雙向 retimed・可插拔</text><text x="844" y="1285" class="small" text-anchor="start">本文 800G 假設：315 美元</text><text x="844" y="1319" class="small" text-anchor="start">Coherent 800G DR8 產品路徑</text><rect x="40" y="1360" width="1360" height="106" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2"/><text x="54" y="1403" class="bold" text-anchor="start">B</text><text x="159" y="1403" class="" text-anchor="start">CW＋矽光 PIC</text><text x="479" y="1403" class="" text-anchor="start">雙向 retimed・可插拔</text><text x="844" y="1397" class="small" text-anchor="start">重列 CW、PIC、耦合與 DSP</text><text x="844" y="1431" class="small" text-anchor="start">Coherent 2026 OFC 多技術展示</text><rect x="40" y="1472" width="1360" height="106" rx="12" fill="#f4f6f5" stroke="#8c99a6" stroke-width="2"/><text x="54" y="1515" class="bold" text-anchor="start">C</text><text x="159" y="1515" class="" text-anchor="start">EML／矽光等</text><text x="479" y="1515" class="" text-anchor="start">TRO・可插拔</text><text x="844" y="1509" class="small" text-anchor="start">仍有 TX DSP 與類比晶片</text><text x="844" y="1543" class="small" text-anchor="start">Marvell Ara T：Q1 2026 起送樣</text><rect x="40" y="1584" width="1360" height="106" rx="12" fill="#ffffff" stroke="#8c99a6" stroke-width="2"/><text x="54" y="1627" class="bold" text-anchor="start">D</text><text x="159" y="1627" class="" text-anchor="start">依 LPO 光學規格</text><text x="479" y="1627" class="" text-anchor="start">LPO・可插拔</text><text x="844" y="1621" class="small" text-anchor="start">移除模組數位處理，新增協同成本</text><text x="844" y="1655" class="small" text-anchor="start">LPO MSA：100G/lane 規範</text><rect x="40" y="1696" width="1360" height="106" rx="12" fill="#f4f6f5" stroke="#8c99a6" stroke-width="2"/><text x="54" y="1739" class="bold" text-anchor="start">E</text><text x="159" y="1739" class="" text-anchor="start">ELS CW＋矽光 PIC</text><text x="479" y="1739" class="" text-anchor="start">短電氣介面・CPO</text><text x="844" y="1733" class="small" text-anchor="start">保留 Driver／TIA、PIC 與供光</text><text x="844" y="1767" class="small" text-anchor="start">NVIDIA Spectrum-X：2026/6 量產</text><rect x="40" y="1830" width="1360" height="105" rx="12" fill="#efeaf7" stroke="#8c99a6" stroke-width="2"/><text x="62" y="1869" class="bold" text-anchor="start">改一個維度，重新檢查另外兩個</text><text x="62" y="1907" class="small" text-anchor="start">CPO 是封裝配置；LPO 是訊號處理配置。工程相依使各組合需逐一驗證，排列數量不等於可用產品。</text><text x="1416" y="1972" class="signature" text-anchor="end">Scott Yo-Ru Chen · 2026-10-08</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#536575" i]{fill:#bcc3c9}[fill="#b55b0c" i]{fill:#e79c59}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#efeaf7" i]{fill:#241e2d}[fill="#f4f6f5" i]{fill:#202426}[fill="#fdf3ea" i]{fill:#312316}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#8c99a6" i]{stroke:#6f7f90}text{fill:#c8d5e1}.small{fill:#bcc3c9}.signature{fill:#bcc3c9}}</style>
</svg>