<svg xmlns="http://www.w3.org/2000/svg" width="600" height="905" viewBox="0 0 600 905" role="img" aria-labelledby="title desc"><title id="title">零件訂單如何變成收入、利益與現金</title><desc id="desc">假設年收入400萬美元，毛利160萬，新增營業利益100萬，稅後營業利益80萬，扣擴產與營運資金後自由現金流負50萬。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:26px}.small{font-size:22px;fill:#536575}.head{font-size:30px;font-weight:700}.bold{font-weight:700}</style><rect width="600" height="905" rx="16" fill="#ffffff"/><text x="24" y="43" text-anchor="start" class="head">從零件訂單算到現金</text><text x="24" y="78" text-anchor="start" class="small">假設算例・單位：美元</text><rect x="24" y="108" width="552" height="110" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="300.0" y="139" text-anchor="middle" class="bold">設備 100 萬台 × 每台 2 顆</text><text x="300.0" y="170" text-anchor="middle" class="small">× 份額 20% × 單價 10</text><line x1="300" y1="219" x2="300" y2="257" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="259" width="552" height="110" rx="12" fill="#e9f1fa" stroke="#8c99a6"/><text x="300.0" y="290" text-anchor="middle" class="bold">新增營收 400 萬</text><text x="300.0" y="321" text-anchor="middle" class="small">× 毛利率 40% → 毛利 160 萬</text><line x1="300" y1="370" x2="300" y2="408" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="410" width="552" height="110" rx="12" fill="#e8f5f3" stroke="#8c99a6"/><text x="300.0" y="441" text-anchor="middle" class="bold">新增營業利益 100 萬</text><text x="300.0" y="472" text-anchor="middle" class="small">毛利 160 萬 − 營業費用 60 萬</text><line x1="300" y1="521" x2="300" y2="559" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="561" width="552" height="110" rx="12" fill="#e8f5f3" stroke="#8c99a6"/><text x="300.0" y="592" text-anchor="middle" class="bold">稅後營業利益 80 萬</text><text x="300.0" y="623" text-anchor="middle" class="small">營業利益 100 萬 × (1 − 20%稅率)</text><line x1="300" y1="672" x2="300" y2="710" stroke="#536575" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="712" width="552" height="110" rx="12" fill="#fdf3ea" stroke="#8c99a6"/><text x="300.0" y="743" text-anchor="middle" class="bold">近似新增自由現金流 −50 萬</text><text x="300.0" y="774" text-anchor="middle" class="small">80＋折舊20−CapEx100−營運資金增加50</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#536575" i]{fill:#bcc3c9}[fill="#e8f5f3" i]{fill:#202d2b}[fill="#e9f1fa" i]{fill:#1a242f}[fill="#fdf3ea" i]{fill:#312316}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#536575" i]{stroke:#bcc3c9}[stroke="#8c99a6" i]{stroke:#6f7f90}text{fill:#c8d5e1}.small{fill:#bcc3c9}}</style>
</svg>