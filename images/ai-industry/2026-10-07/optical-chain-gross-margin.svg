<svg xmlns="http://www.w3.org/2000/svg" width="680" height="654" viewBox="0 0 680 654" role="img" aria-labelledby="title desc"><title id="title">光通訊供應鏈各環節毛利率</title><desc id="desc">雷射晶片廠毛利率 80.4%，光纖連接 62.5%，雷射元件 50.4%，模組廠約 47–49%，代工 12.2%。依據各公司 2026 年財報整理。</desc><defs><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><style>text{font-family:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","WenQuanYi Zen Hei",Arial,sans-serif;fill:#183047;font-size:20px}.small{font-size:17px;fill:#5b6b7a}.head{font-size:24px;font-weight:700}.bold{font-weight:700}.w{fill:#ffffff;font-weight:700}</style><rect x="0" y="0" width="680" height="654" rx="12" fill="#ffffff"/><text x="28" y="42" class="head">越接近晶片，毛利率越高</text><text x="28" y="72" class="small">毛利率，依據各公司 2026 年財報整理</text><text x="28" y="116" class="bold">源杰</text><text x="88" y="116" class="small">雷射晶片・2026 上半年</text><rect x="28" y="130" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="130" width="418.1" height="28" rx="6" fill="#b55b0c"/><text x="562" y="152" class="bold">80.4%</text><text x="28" y="200" class="bold">光聖</text><text x="88" y="200" class="small">MPO 與光纖跳線・2026 Q2</text><rect x="28" y="214" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="214" width="325.0" height="28" rx="6" fill="#087c72"/><text x="562" y="236" class="bold">62.5%</text><text x="28" y="284" class="bold">Lumentum</text><text x="140" y="284" class="small">EML 等元件・FQ4'26 非 GAAP</text><rect x="28" y="298" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="298" width="262.1" height="28" rx="6" fill="#b55b0c"/><text x="562" y="320" class="bold">50.4%</text><text x="28" y="368" class="bold">新易盛</text><text x="110" y="368" class="small">光收發模組・2026 上半年</text><rect x="28" y="382" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="382" width="252.2" height="28" rx="6" fill="#1766ad"/><text x="562" y="404" class="bold">48.5%</text><text x="28" y="452" class="bold">中際旭創</text><text x="132" y="452" class="small">光收發模組・2026 上半年</text><rect x="28" y="466" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="466" width="242.3" height="28" rx="6" fill="#1766ad"/><text x="562" y="488" class="bold">46.6%</text><text x="28" y="536" class="bold">Fabrinet</text><text x="140" y="536" class="small">代工組裝・FQ4'26 非 GAAP</text><rect x="28" y="550" width="520" height="28" rx="6" fill="#eef1f4"/><rect x="28" y="550" width="63.4" height="28" rx="6" fill="#8c99a6"/><text x="562" y="572" class="bold">12.2%</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#8c99a6" i]{fill:#6f7f90}[fill="#b55b0c" i]{fill:#e79c59}[fill="#eef1f4" i]{fill:#212529}[fill="#ffffff" i]{fill:#1b1f20}text{fill:#c8d5e1}.small{fill:#a2aeba}.w{fill:#1b1f20}}</style>
