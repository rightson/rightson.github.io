<svg xmlns="http://www.w3.org/2000/svg" width="600" height="875" viewBox="0 0 600 875" role="img" aria-labelledby="title desc"><title id="title">800G EML 假設 BOM 成本</title><desc id="desc">315 美元是假設成本；四類晶片合計 218美元。各零件國別需另查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536575"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#183047;font-size:26px}.small{font-size:22px;fill:#536575}.head{font-size:30px;font-weight:700}.bold{font-weight:700}</style><rect width="600" height="875" rx="16" fill="#ffffff"/><text x="24" y="43" text-anchor="start" class="head">800G EML 假設 BOM</text><text x="24" y="77" text-anchor="start" class="small">美元／顆模組・合計 315 美元</text><text x="24" y="125" text-anchor="start" class="bold">EML 雷射</text><text x="575" y="125" text-anchor="end" class="small">92 美元  29.2%</text><rect x="24" y="138" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="138" width="551.00" height="17" rx="4" fill="#b55b0c"/><text x="24" y="195" text-anchor="start" class="bold">DSP</text><text x="575" y="195" text-anchor="end" class="small">88 美元  27.9%</text><rect x="24" y="208" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="208" width="527.04" height="17" rx="4" fill="#b55b0c"/><text x="24" y="265" text-anchor="start" class="bold">Driver ＋ TIA</text><text x="575" y="265" text-anchor="end" class="small">38 美元  12.1%</text><rect x="24" y="278" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="278" width="227.59" height="17" rx="4" fill="#b55b0c"/><text x="24" y="335" text-anchor="start" class="bold">被動光學</text><text x="575" y="335" text-anchor="end" class="small">29 美元  9.2%</text><rect x="24" y="348" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="348" width="173.68" height="17" rx="4" fill="#087c72"/><text x="24" y="405" text-anchor="start" class="bold">PD</text><text x="575" y="405" text-anchor="end" class="small">24 美元  7.6%</text><rect x="24" y="418" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="418" width="143.74" height="17" rx="4" fill="#1766ad"/><text x="24" y="475" text-anchor="start" class="bold">PCB／基板</text><text x="575" y="475" text-anchor="end" class="small">14.5 美元  4.6%</text><rect x="24" y="488" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="488" width="86.84" height="17" rx="4" fill="#087c72"/><text x="24" y="545" text-anchor="start" class="bold">外殼／散熱／連接器</text><text x="575" y="545" text-anchor="end" class="small">14.5 美元  4.6%</text><rect x="24" y="558" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="558" width="86.84" height="17" rx="4" fill="#087c72"/><text x="24" y="615" text-anchor="start" class="bold">電源／被動元件</text><text x="575" y="615" text-anchor="end" class="small">9 美元  2.9%</text><rect x="24" y="628" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="628" width="53.90" height="17" rx="4" fill="#8c99a6"/><text x="24" y="685" text-anchor="start" class="bold">原文未分列</text><text x="575" y="685" text-anchor="end" class="small">6 美元  1.9%</text><rect x="24" y="698" width="551" height="17" rx="4" fill="#eef1f4"/><rect x="24" y="698" width="35.93" height="17" rx="4" fill="#8c99a6"/><rect x="24" y="759" width="551" height="90" rx="12" fill="#efeaf7" stroke="#8c99a6"/><text x="299.5" y="790" text-anchor="middle" class="bold">前三項 218 美元，占 69.2%</text><text x="299.5" y="821" text-anchor="middle" class="small">元件占比；國別須依實際料號查證</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#087c72" i]{fill:#44e4d6}[fill="#1766ad" i]{fill:#5ca5e8}[fill="#536575" i]{fill:#bcc3c9}[fill="#8c99a6" i]{fill:#6f7f90}[fill="#b55b0c" i]{fill:#e79c59}[fill="#eef1f4" i]{fill:#212529}[fill="#efeaf7" i]{fill:#241e2d}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#8c99a6" i]{stroke:#6f7f90}text{fill:#c8d5e1}.small{fill:#bcc3c9}}</style>
