<svg xmlns="http://www.w3.org/2000/svg" width="680" height="788" viewBox="0 0 680 788" role="img" aria-labelledby="title desc"><title id="title">800G EML 光收發模組 BOM 成本拆解</title><desc id="desc">九個成本項目的美元金額與占比，合計約 315 美元；EML、DSP、Driver 與 TIA 以美系供應為主。依據東方財富財富號 2026 年 4 月拆解整理，屬估算。</desc><defs><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b55b0c"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1766ad"/></marker></defs><style>text{font-family:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei","WenQuanYi Zen Hei",Arial,sans-serif;fill:#183047;font-size:20px}.small{font-size:17px;fill:#5b6b7a}.head{font-size:24px;font-weight:700}.bold{font-weight:700}.w{fill:#ffffff;font-weight:700}</style><rect x="0" y="0" width="680" height="788" rx="12" fill="#ffffff"/><text x="28" y="42" class="head">一顆 800G EML 模組約 315 美元成本</text><text x="28" y="72" class="small">依據公開拆解整理（估算），橫條長度依金額</text><text x="28" y="118" class="bold">EML 雷射 ×8</text><text x="652" y="118" text-anchor="end" class="small">美系為主</text><rect x="28" y="128" width="430" height="22" rx="5" fill="#eef1f4"/><rect x="28" y="128" width="430.0" height="22" rx="5" fill="#b55b0c"/><text x="472" y="146">92 美元・29.2%</text><text x="28" y="180" class="bold">DSP ×1</text><text x="652" y="180" text-anchor="end" class="small">美系為主</text><rect x="28" y="190" width="430" height="22" rx="5" fill="#eef1f4"/><rect x="28" y="190" width="411.3" height="22" rx="5" fill="#b55b0c"/><text x="472" y="208">88 美元・27.9%</text><text x="28" y="242" class="bold">Driver＋TIA ×4</text><text x="652" y="242" text-anchor="end" class="small">美系為主</text><rect x="28" y="252" width="430" height="22" rx="5" fill="#eef1f4"/><rect x="28" y="252" width="177.6" height="22" rx="5" fill="#b55b0c"/><text x="472" y="270">38 美元・12.1%</text><text x="28" y="304" class="bold">被動光學</text><text x="652" y="304" text-anchor="end" class=