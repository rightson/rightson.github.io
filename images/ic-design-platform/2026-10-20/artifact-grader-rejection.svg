<svg xmlns="http://www.w3.org/2000/svg" width="640" height="739" viewBox="0 0 640 739" role="img">
<title>Ask which execution the report belongs to</title>
<rect width="640" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#315e86"/></marker></defs>
<g font-family="sans-serif" fill="#172c3d">
<text x="32" y="42" font-size="25" font-weight="bold">Ask which execution the report belongs to</text>
<text x="32" y="75" font-size="18" fill="#475c6d">Reference design · Tools check, engineers accept</text>
<rect x="32" y="100" width="576" height="108" rx="12" fill="#eef5fb" stroke="#a7bfd1"/>
<text x="52" y="130" font-size="23" font-weight="bold">1  Read completion and output records</text>
<text x="52" y="161" font-size="20">Require a completed job and sealed output</text>
<text x="52" y="188" font-size="20">Timeout / missing file: retain diagnostics</text>
<path d="M320,212 V230" stroke="#315e86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="236" width="576" height="108" rx="12" fill="#eef5fb" stroke="#a7bfd1"/>
<text x="52" y="266" font-size="23" font-weight="bold">2  Match inputs and execution</text>
<text x="52" y="297" font-size="20">Compare RTL, test, seed and tool versions</text>
<text x="52" y="324" font-size="20">Old RTL / other stimulus: reject the result</text>
<path d="M320,348 V366" stroke="#315e86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="372" width="576" height="108" rx="12" fill="#eef5fb" stroke="#a7bfd1"/>
<text x="52" y="402" font-size="23" font-weight="bold">3  Verify content and same-trace check</text>
<text x="52" y="433" font-size="20">Digest detects changes after sealing</text>
<text x="52" y="460" font-size="20">Missing checker / wrong data: reject</text>
<path d="M320,484 V502" stroke="#315e86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="508" width="576" height="108" rx="12" fill="#eef5fb" stroke="#a7bfd1"/>
<text x="52" y="538" font-size="23" font-weight="bold">4  Merge qualified coverage only</text>
<text x="52" y="569" font-size="20">Add bins from valid executions</text>
<text x="52" y="596" font-size="20">A new RTL revision gets its own result set</text>
<text x="32" y="684" font-size="17">Digests compare content; producer trust is a separate task.</text>
<text x="608" y="719" text-anchor="end" font-size="10" fill="#475c6d">Scott Yo-Ru Chen · 2026-10-20</text>
</g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172c3d" i]{fill:#ccd8e2}[fill="#475c6d" i]{fill:#bfc7cd}[fill="#eef5fb" i]{fill:#19242d}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#315e86" i]{stroke:#6d9eca}[stroke="#a7bfd1" i]{stroke:#a1bbce}}</style>
</svg>
