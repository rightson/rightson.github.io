<svg xmlns="http://www.w3.org/2000/svg" width="840" height="930" viewBox="0 0 840 930" role="img"><title>Shared configuration;|tool-native work and evidence</title><desc>Author reference architecture informed by GDP concepts</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#40576c"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183249}.edge{fill:none;stroke:#40576c;stroke-width:3;marker-end:url(#arrow)}</style><rect width="840" height="930" rx="20" fill="#f6f9fc"/><text x="35" y="50" font-size="32" font-weight="700">Shared configuration;</text><text x="35" y="88" font-size="32" font-weight="700">tool-native work and evidence</text><text x="35" y="130" font-size="23" font-weight="400">Author reference architecture informed by GDP concepts</text><rect x="50" y="165" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="200" font-size="26" font-weight="700">Design teams</text><text x="70" y="235" font-size="22" font-weight="400">IP / RTL / SDC owners</text><text x="70" y="262" font-size="22" font-weight="400">Commit coherent changes</text><rect x="445" y="165" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="465" y="200" font-size="24" font-weight="700">Configuration registry</text><text x="465" y="235" font-size="19" font-weight="400">Fixed versions + dependencies</text><text x="465" y="262" font-size="18" font-weight="400">Release selection + permissions</text><rect x="445" y="350" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="465" y="385" font-size="26" font-weight="700">Workspace resolver</text><text x="465" y="420" font-size="22" font-weight="400">Resolve exact tool inputs</text><text x="465" y="447" font-size="22" font-weight="400">Preserve access scope</text><rect x="50" y="350" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="385" font-size="26" font-weight="700">Native tool adapters</text><text x="70" y="420" font-size="22" font-weight="400">Synthesis / APR / STA</text><text x="70" y="447" font-size="20" font-weight="400">Keep vendor-native databases</text><rect x="50" y="565" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="600" font-size="26" font-weight="700">Evidence registry</text><text x="70" y="635" font-size="22" font-weight="400">Artifact digests + reports + input identity</text><text x="70" y="662" font-size="22" font-weight="400">Retain tool-specific acceptance obligations</text><rect x="50" y="765" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="800" font-size="26" font-weight="700">Approved milestone release</text><text x="70" y="835" font-size="22" font-weight="400">Domain owners approve the complete configuration</text><text x="70" y="862" font-size="22" font-weight="400">One delivery decision; distinct sources and tool formats</text><path d="M395 225H444" class="edge"/><path d="M617 285V349" class="edge"/><path d="M445 410H396" class="edge"/><text x="400" y="395" font-size="21" font-weight="400">inputs</text><path d="M222 470V564" class="edge"/><text x="60" y="525" font-size="21" font-weight="400">outputs + reports</text><path d="M420 685V764" class="edge"/><text x="440" y="727" font-size="21" font-weight="400">acceptance checks</text><text x="35" y="915" font-size="17" font-weight="400">Not NVIDIA internal topology; adapters and release control are author design.</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#40576c" i]{fill:#bfc8d0}[fill="#eaf2fc" i]{fill:#182330}[fill="#f6f9fc" i]{fill:#192128}[stroke="#7891aa" i]{stroke:#6c88a3}text{fill:#c8d5e1}.edge{stroke:#bfc8d0}}</style>
</svg>