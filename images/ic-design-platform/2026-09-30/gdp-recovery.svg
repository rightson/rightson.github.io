<svg xmlns="http://www.w3.org/2000/svg" width="840" height="930" viewBox="0 0 840 930" role="img"><title>Interruptions and competing|release transactions</title><desc>Author failure and recovery model</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#40576c"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183249}.edge{fill:none;stroke:#40576c;stroke-width:3;marker-end:url(#arrow)}</style><rect width="840" height="930" rx="20" fill="#f6f9fc"/><text x="35" y="50" font-size="32" font-weight="700">Interruptions and competing</text><text x="35" y="88" font-size="32" font-weight="700">release transactions</text><text x="35" y="130" font-size="23" font-weight="400">Author failure and recovery model</text><rect x="50" y="165" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="200" font-size="26" font-weight="700">Run candidate; retain stable request identity</text><text x="70" y="235" font-size="22" font-weight="400">Immutable inputs + expected release parent cfg42</text><text x="70" y="262" font-size="22" font-weight="400">Each execution attempt retains its own artifacts</text><rect x="50" y="355" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="390" font-size="26" font-weight="700">Interrupted worker</text><text x="70" y="425" font-size="22" font-weight="400">Partial outputs</text><text x="70" y="452" font-size="22" font-weight="400">No complete marker</text><rect x="445" y="355" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="465" y="390" font-size="26" font-weight="700">Complete result</text><text x="465" y="425" font-size="22" font-weight="400">All required evidence</text><text x="465" y="452" font-size="22" font-weight="400">Candidate bound to inputs</text><rect x="50" y="550" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="585" font-size="25" font-weight="700">Reject incomplete set</text><text x="70" y="620" font-size="22" font-weight="400">Preserve failed attempt</text><text x="70" y="647" font-size="22" font-weight="400">Resume or rerun</text><rect x="445" y="550" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="465" y="585" font-size="23" font-weight="700">Conditional transaction</text><text x="465" y="620" font-size="22" font-weight="400">Pointer parent must match</text><text x="465" y="647" font-size="20" font-weight="400">Retry key returns same result</text><rect x="50" y="755" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="790" font-size="26" font-weight="700">Preserve history and expose the decision</text><text x="70" y="825" font-size="22" font-weight="400">Transaction succeeds: publish once; timeout retry: replay</text><text x="70" y="852" font-size="21" font-weight="400">Parent changed: HEAD_CONFLICT; reconcile before new request</text><path d="M420 285V320H222V354" class="edge"/><path d="M420 320H617V354" class="edge"/><path d="M222 475V549" class="edge"/><text x="70" y="520" font-size="21" font-weight="400">hold release</text><path d="M617 475V549" class="edge"/><text x="465" y="520" font-size="21" font-weight="400">validated set</text><path d="M617 670V714H420V754" class="edge"/><text x="440" y="737" font-size="21" font-weight="400">decision</text><text x="35" y="915" font-size="20" font-weight="400">No exactly-once tool execution claim; old release remains usable.</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#40576c" i]{fill:#bfc8d0}[fill="#eaf2fc" i]{fill:#182330}[fill="#f6f9fc" i]{fill:#192128}[stroke="#7891aa" i]{stroke:#6c88a3}text{fill:#c8d5e1}.edge{stroke:#bfc8d0}}</style>
</svg>