<svg xmlns="http://www.w3.org/2000/svg" width="840" height="930" viewBox="0 0 840 930" role="img"><title>Parallel changes need|matching combined evidence</title><desc>Author scenario: cfg42 = RTL r11 + SDC s7</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#40576c"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183249}.edge{fill:none;stroke:#40576c;stroke-width:3;marker-end:url(#arrow)}</style><rect width="840" height="930" rx="20" fill="#f6f9fc"/><text x="35" y="50" font-size="32" font-weight="700">Parallel changes need</text><text x="35" y="88" font-size="32" font-weight="700">matching combined evidence</text><text x="35" y="130" font-size="23" font-weight="400">Author scenario: cfg42 = RTL r11 + SDC s7</text><rect x="50" y="165" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="200" font-size="26" font-weight="700">Stable configuration cfg42</text><text x="70" y="235" font-size="22" font-weight="400">Both teams start from one published state</text><text x="70" y="262" font-size="22" font-weight="400">Independent development continues</text><rect x="50" y="355" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="390" font-size="26" font-weight="700">RTL branch</text><text x="70" y="425" font-size="22" font-weight="400">r12 tested with s7</text><text x="70" y="452" font-size="22" font-weight="400">New interface</text><rect x="445" y="355" width="345" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="465" y="390" font-size="26" font-weight="700">Constraint branch</text><text x="465" y="425" font-size="22" font-weight="400">s8 tested with r11</text><text x="465" y="452" font-size="22" font-weight="400">New timing intent</text><rect x="50" y="550" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="585" font-size="26" font-weight="700">Explicit candidate cfg43 = r12 + s8</text><text x="70" y="620" font-size="22" font-weight="400">Old branch reports do not validate the combined design</text><text x="70" y="647" font-size="22" font-weight="400">Resolve inputs; rerun affected regression / SYN / LEC</text><rect x="50" y="755" width="740" height="120" rx="14" fill="#eaf2fc" stroke="#7891aa"/><text x="70" y="790" font-size="26" font-weight="700">Publication gate</text><text x="70" y="825" font-size="22" font-weight="400">Matching complete evidence: release cfg43</text><text x="70" y="852" font-size="22" font-weight="400">Missing or failing evidence: keep cfg42; retain candidate</text><path d="M420 285V320H222V354" class="edge"/><path d="M420 320H617V354" class="edge"/><path d="M222 475V510H420V549" class="edge"/><path d="M617 475V510H420" class="edge"/><path d="M420 670V754" class="edge"/><text x="440" y="718" font-size="21" font-weight="400">new evidence</text><text x="35" y="915" font-size="19" font-weight="400">Atomic content submission does not establish engineering compatibility.</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#40576c" i]{fill:#bfc8d0}[fill="#eaf2fc" i]{fill:#182330}[fill="#f6f9fc" i]{fill:#192128}[stroke="#7891aa" i]{stroke:#6c88a3}text{fill:#c8d5e1}.edge{stroke:#bfc8d0}}</style>
</svg>