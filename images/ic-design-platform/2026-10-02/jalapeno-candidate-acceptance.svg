<svg xmlns="http://www.w3.org/2000/svg" width="600" height="880" viewBox="0 0 600 880" role="img" aria-labelledby="title desc"><title id="title">位元寬度錯誤與候選回退</title><desc id="desc">作者假設案例：65535加1，16位元加法丟失進位。等價失敗保存反例，修正後重新驗收。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect width="600" height="880" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="25" fill="#172033"><text x="300" y="44" text-anchor="middle" font-weight="700">小數值通過，邊界值卻失敗</text><text x="300" y="81" text-anchor="middle" font-size="23">作者假設案例 · 非 Jalapeño 實測</text><rect x="65" y="110" width="470" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="145" text-anchor="middle" font-weight="700">固定規格：完整 17-bit 結果</text><text x="300" y="183" text-anchor="middle" font-size="23">兩個 unsigned 16-bit 輸入</text><path d="M300 210 V243" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="255" width="470" height="100" rx="12" fill="#fff7ed" stroke="#64748b" stroke-width="2"/><text x="300" y="290" text-anchor="middle" font-weight="700">錯誤候選：先加，再擴充</text><text x="300" y="328" text-anchor="middle" font-size="23">16-bit：65,535 + 1 → 0</text><path d="M300 355 V388" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="400" width="470" height="100" rx="12" fill="#fff7ed" stroke="#64748b" stroke-width="2"/><text x="300" y="435" text-anchor="middle" font-weight="700">語意驗收：保留反例</text><text x="300" y="473" text-anchor="middle" font-size="23">期望 65,536，實際 0 → 不採納</text><path d="M300 500 V533" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="545" width="470" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="580" text-anchor="middle" font-weight="700">恢復：保留 baseline</text><text x="300" y="618" text-anchor="middle" font-size="23">新候選先擴充 operand 再相加</text><path d="M300 645 V678" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="690" width="470" height="100" rx="12" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/><text x="300" y="725" text-anchor="middle" font-weight="700">重新驗證，再量測 PPA</text><text x="300" y="763" text-anchor="middle" font-size="23">整合／實體驗收另有義務</text><text x="300" y="833" text-anchor="middle" font-size="23">timeout / proof 未完成 → 未知</text><text x="300" y="868" text-anchor="middle" font-size="23">沒有反例，不等於已證明正確</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172033" i]{fill:#d0d5e1}[fill="#334155" i]{fill:#c6ccd5}[fill="#eff6ff" i]{fill:#132031}[fill="#f0fdf4" i]{fill:#162e1e}[fill="#fff7ed" i]{fill:#322413}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#334155" i]{stroke:#c6ccd5}[stroke="#64748b" i]{stroke:#929eb0}}</style>
</svg>