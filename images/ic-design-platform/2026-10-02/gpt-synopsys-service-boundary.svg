<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">GPT-Synopsys 的服務與驗收邊界</title>
  <desc id="desc">客戶目標與治理透過 agent harness 連接專用模型、Autopilot 與 EDA 工具；產物及工具證據通過工程驗收後才放行。</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #3269a8; stroke-width: 2; }
    .vendor { fill: #e8f2ff; stroke: #2765a9; stroke-width: 2; }
    .gate { fill: #e8f8ef; stroke: #238250; stroke-width: 2; }
    .warn { fill: #fff5dc; stroke: #a56a00; stroke-width: 2; }
    .line { fill: none; stroke: #40556f; stroke-width: 2.5; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8a5b13; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-warn); }
    text { fill: #17263a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .h { font-size: 24px; font-weight: 700; }
    .t { font-size: 18px; font-weight: 650; }
    .s { font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #101722; }
      .panel { fill: #172131; stroke: #78b7ff; }
      .vendor { fill: #172b42; stroke: #78b7ff; }
      .gate { fill: #173329; stroke: #64d49a; }
      .warn { fill: #3a2d15; stroke: #f3ba52; }
      .line { stroke: #b8c7da; }
      .dash { stroke: #f3ba52; }
      text { fill: #edf4ff; }
    }
    @media (max-width: 680px) {
      .h { font-size: 22px; }
      .t { font-size: 17px; }
      .s { font-size: 14px; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#40556f"/></marker>
    <marker id="arrow-warn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a56a00"/></marker>
  </defs>
  <rect class="bg" width="900" height="660" rx="24"/>
  <text class="h" x="450" y="42" text-anchor="middle">服務能操作工具，客戶仍掌握驗收與放行</text>

  <rect class="panel" x="45" y="82" width="250" height="150" rx="16"/>
  <text class="t" x="170" y="116" text-anchor="middle">Customer agent harness</text>
  <text class="s" x="70" y="150">• design objective／policy</text>
  <text class="s" x="70" y="178">• artifact identity／access</text>
  <text class="s" x="70" y="206">• acceptance／rollback</text>

  <rect class="vendor" x="345" y="82" width="235" height="150" rx="16"/>
  <text class="t" x="462" y="116" text-anchor="middle">GPT-Synopsys</text>
  <text class="s" x="372" y="150">專用模型解讀工具結果</text>
  <text class="s" x="372" y="178">規劃下一個受控 action</text>
  <text class="s" x="372" y="206">OpenAI-hosted service</text>

  <rect class="vendor" x="630" y="82" width="225" height="150" rx="16"/>
  <text class="t" x="742" y="116" text-anchor="middle">Autopilot／EDA tools</text>
  <text class="s" x="656" y="150">orchestration／memory</text>
  <text class="s" x="656" y="178">tool execution／telemetry</text>
  <text class="s" x="656" y="206">ground-truth reports</text>

  <path class="line" d="M295 150 H337"/>
  <path class="line" d="M580 150 H622"/>
  <path class="line" d="M742 232 V292 H492"/>

  <rect class="panel" x="105" y="286" width="390" height="145" rx="16"/>
  <text class="t" x="300" y="320" text-anchor="middle">Versioned design state</text>
  <text class="s" x="132" y="354">RTL／SDC／UPF／checkpoint／tool build</text>
  <text class="s" x="132" y="382">input／output digest＋run identity</text>
  <text class="s" x="132" y="410">證據有效範圍與失效關係</text>

  <rect class="gate" x="555" y="286" width="300" height="145" rx="16"/>
  <text class="t" x="705" y="320" text-anchor="middle">Evidence gate</text>
  <text class="s" x="582" y="354">simulation／formal／LEC</text>
  <text class="s" x="582" y="382">STA／DRC／LVS／review</text>
  <text class="s" x="582" y="410">通過後才發布下一階段</text>

  <path class="line" d="M495 358 H547"/>
  <path class="line" d="M705 431 V486 H450"/>

  <rect class="warn" x="105" y="492" width="690" height="115" rx="16"/>
  <text class="t" x="450" y="526" text-anchor="middle">失敗與恢復邊界</text>
  <text class="s" x="140" y="560">tool timeout／license loss／stale checkpoint → 隔離候選、檢查殘留狀態、由 verified checkpoint 重跑</text>
  <text class="s" x="140" y="588">資料治理：retention／audit／permission 已有方向；residency、跨工具 schema 與重播契約仍待公開</text>

  <path class="dash" d="M450 492 V455 H300 V439"/>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#40556f" i]{fill:#bec6d0}[fill="#a56a00" i]{fill:#e4ab44}.bg{fill:#1a1f27}.panel{fill:#1b1f20;stroke:#80aad9}.vendor{fill:#142234;stroke:#71a5de}.gate{fill:#1d2f24;stroke:#56d291}.warn{fill:#382e15;stroke:#e4ab44}.line{stroke:#bec6d0}.dash{stroke:#e4a544}text{fill:#cdd6e2}.bg{fill:#d5dbe4}.panel{fill:#d1d7e1;stroke:#82b4ed}.vendor{fill:#cad5e2;stroke:#82b4ed}.gate{fill:#d0e1db;stroke:#8fe0b6}.warn{fill:#e3dbcd;stroke:#edc782}.line{stroke:#a1b5ce}.dash{stroke:#edc782}text{fill:#131f32}}</style>
</svg>
