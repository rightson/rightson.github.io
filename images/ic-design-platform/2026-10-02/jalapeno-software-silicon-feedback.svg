<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc">
<title id="title">從軟體評估到矽晶片的驗證回饋</title>
<desc id="desc">依採訪整理的參考設計。軟體團隊先在模擬器評估工作負載，再做設計與 EDA 檢查。I/O chiplet 提早驗證介面，A0 用於軟體 bring-up，B0 用於量產驗證，實測結果用來修正模擬與軟體。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="600" height="1100" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="25" fill="#172033">
<text x="300" y="43" text-anchor="middle" font-weight="700">從軟體評估到晶片實測</text>
<text x="300" y="78" text-anchor="middle" font-size="23">參考設計</text><rect x="70" y="110" width="460" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="146" text-anchor="middle" font-weight="700">代表性工作負載與服務需求</text><text x="300" y="184" text-anchor="middle" font-size="23">模型／context／併發／效能目標</text><path d="M300 210 V243" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="255" width="460" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="291" text-anchor="middle" font-weight="700">軟體團隊以模擬器評估</text><text x="300" y="329" text-anchor="middle" font-size="23">compiler／kernel／推論映射</text><path d="M300 355 V388" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="400" width="460" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="436" text-anchor="middle" font-weight="700">設計修改與 EDA 檢查</text><text x="300" y="474" text-anchor="middle" font-size="23">修改原始碼 → 驗證與實作</text><path d="M300 500 V533" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="545" width="460" height="100" rx="12" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/><text x="300" y="581" text-anchor="middle" font-weight="700">提前取得的 I/O 元件</text><text x="300" y="619" text-anchor="middle" font-size="23">先驗證已可取得的介面與路徑</text><path d="M300 645 V678 M300 678 H165 V703 M300 678 H435 V703" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M165 698 V706 M435 698 V706" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="720" width="230" height="139" rx="12" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/>
<rect x="315" y="720" width="230" height="139" rx="12" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="170" y="759" text-anchor="middle" font-weight="700">A0</text><text x="170" y="801" text-anchor="middle" font-size="24">軟體 bring-up</text><text x="170" y="839" text-anchor="middle" font-size="23">開始跑軟體</text>
<text x="430" y="759" text-anchor="middle" font-weight="700">B0</text><text x="430" y="801" text-anchor="middle" font-size="24">量產驗證</text><text x="430" y="839" text-anchor="middle" font-size="23">確認量產條件</text>
<text x="300" y="899" text-anchor="middle" font-size="23">A0／B0 是預先規劃的兩次 stepping</text>
<path d="M170 859 V929 H300 M430 859 V929 H300 V947" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="960" width="460" height="83" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="300" y="995" text-anchor="middle" font-weight="700">用實測修正模擬與軟體</text><text x="300" y="1029" text-anchor="middle" font-size="23">保存版本／輸入／量測條件</text>
<path d="M70 1001 H30 V305 H58" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="300" y="1080" text-anchor="middle" font-size="23">箭頭不表示日期、規模或全部驗證範圍</text>
</g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172033" i]{fill:#d0d5e1}[fill="#334155" i]{fill:#c6ccd5}[fill="#eff6ff" i]{fill:#132031}[fill="#f0fdf4" i]{fill:#162e1e}[fill="#f8fafc" i]{fill:#1a2026}[fill="#fff7ed" i]{fill:#322413}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#334155" i]{stroke:#c6ccd5}[stroke="#64748b" i]{stroke:#929eb0}}</style>
</svg>