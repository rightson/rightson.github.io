<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1050" viewBox="0 0 600 1050" role="img" aria-labelledby="title desc"><title id="title">模型候選如何接入晶片設計</title><desc id="desc">作者參考流程：固定規格，模型提出 XLS 候選，compiler 生成 RTL，工具產生證據，工程師驗收。失敗保留 baseline。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect width="600" height="1050" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="25" fill="#172033"><text x="300" y="43" text-anchor="middle" font-weight="700">模型探索與工程驗收的交接</text><text x="300" y="78" text-anchor="middle" font-size="23">作者參考設計 · 非 OpenAI 內部架構</text><rect x="65" y="110" width="470" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="145" text-anchor="middle" font-weight="700">工程師：固定設計問題</text><text x="300" y="183" text-anchor="middle" font-size="23">規格／版本／效能與面積目標</text><path d="M300 210 V243" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="255" width="470" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="290" text-anchor="middle" font-weight="700">LLM：提出候選修改</text><text x="300" y="328" text-anchor="middle" font-size="23">XLS 原始碼與修改理由</text><path d="M300 355 V388" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="400" width="470" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="2"/><text x="300" y="435" text-anchor="middle" font-weight="700">XLS compiler：生成 RTL</text><text x="300" y="473" text-anchor="middle" font-size="23">IR 最佳化／排程／codegen</text><path d="M300 500 V533" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="545" width="470" height="100" rx="12" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/><text x="300" y="580" text-anchor="middle" font-weight="700">驗證：候選是否符合規格？</text><text x="300" y="618" text-anchor="middle" font-size="23">測試／適用的等價與整合檢查</text><path d="M300 645 V678" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="690" width="470" height="100" rx="12" fill="#f0fdf4" stroke="#64748b" stroke-width="2"/><text x="300" y="725" text-anchor="middle" font-weight="700">EDA：實作結果是否可用？</text><text x="300" y="763" text-anchor="middle" font-size="23">綜合／實體實作／適用 signoff</text><path d="M300 790 V823" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="835" width="470" height="100" rx="12" fill="#fff7ed" stroke="#64748b" stroke-width="2"/><text x="300" y="870" text-anchor="middle" font-weight="700">工程師：採納或退回</text><text x="300" y="908" text-anchor="middle" font-size="23">成套來源與報告 → 核准交付</text><path d="M65 885 H28 V305 H53" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="300" y="985" text-anchor="middle" font-size="23">失敗：保存反例，保留已核准版本</text><text x="300" y="1022" text-anchor="middle" font-size="23">模型不能自行改規格或宣告 tapeout</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172033" i]{fill:#d0d5e1}[fill="#334155" i]{fill:#c6ccd5}[fill="#eff6ff" i]{fill:#132031}[fill="#f0fdf4" i]{fill:#162e1e}[fill="#fff7ed" i]{fill:#322413}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#334155" i]{stroke:#c6ccd5}[stroke="#64748b" i]{stroke:#929eb0}}</style>
</svg>