<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1210" viewBox="0 0 680 1210" role="img" aria-labelledby="title desc">
<title id="title">Strata 依快取狀態與資源需求安排請求</title>
<desc id="desc">三種排程決策。Delay hit：共同前綴仍在佇列或執行中時，後續請求等待前綴完成，避免重算。Bundle hit：共同前綴已在 Host DRAM 時，將同前綴請求放入同批以共用載入，並搭配計算需求較多的互補請求。若仍受載入限制，讓 CPU 到 GPU 的 KV 載入與既有 decode 工作重疊，待 KV 就緒才開始新 prefill。圖中區塊長度並非實測時間。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.3" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L7.3 4.5 L1 8" fill="none" stroke="#62768b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1210" rx="22" fill="#f8fafc"/>
<text x="340" y="52" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#172b42">排程同時看快取狀態與資源空檔</text>
<text x="340" y="90" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#42566d">三種決策，銜接同一條請求路徑</text>
<rect x="24" y="121" width="632" height="287" rx="13" fill="#ffffff" stroke="#c9d5e2" stroke-width="1.6"/>
<rect x="45" y="143" width="42" height="42" rx="10" fill="#e1efff"/>
<text x="66" y="174" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#215f9a">1</text>
<text x="101" y="174" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#172b42">等待前綴完成，避免重算</text>
<text x="52" y="215" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#42566d">delay hit · P 尚在佇列／執行中</text>
<rect x="52" y="237" width="206" height="54" rx="9" fill="#fff0da"/>
<text x="155" y="273" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#8a4f13">請求 A 產生 P</text>
<path d="M270 264 L313 264" fill="none" stroke="#62768b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="326" y="237" width="301" height="54" rx="9" fill="#dff4eb"/>
<text x="476.5" y="273" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#116447">P 轉為可重用</text>
<rect x="52" y="330" width="206" height="54" rx="9" fill="#fff0da"/>
<text x="155" y="366" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#8a4f13">請求 B 等待</text>
<path d="M270 357 L313 357" fill="none" stroke="#62768b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="326" y="330" width="301" height="54" rx="9" fill="#dff4eb"/>
<text x="476.5" y="366" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#116447">沿用 P 的 KV</text>
<path d="M477 298 L477 319" fill="none" stroke="#62768b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<rect x="24" y="434" width="632" height="317" rx="13" fill="#ffffff" stroke="#c9d5e2" stroke-width="1.6"/>
<rect x="45" y="456" width="42" height="42" rx="10" fill="#e1efff"/>
<text x="66" y="487" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#215f9a">2</text>
<text x="101" y="487" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#172b42">合併命中，搭配互補工作</text>
<text x="52" y="528" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#42566d">bundle hit · P 已在 Host DRAM</text>
<rect x="52" y="552" width="210" height="48" rx="9" fill="#dff4eb"/>
<text x="157" y="585" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#116447">P＋問題 A</text>
<rect x="52" y="614" width="210" height="48" rx="9" fill="#dff4eb"/>
<text x="157" y="647" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#116447">P＋問題 B</text>
<path d="M271 576 L290 576 L290 607 L313 607" fill="none" stroke="#62768b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M271 638 L290 638 L290 607" fill="none" stroke="#62768b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="326" y="552" width="301" height="110" rx="13" fill="#dff4eb" stroke="#c9d5e2" stroke-width="1.6"/>
<text x="476.5" y="594" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#116447">同批共用 P</text>
<text x="476.5" y="634" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#116447">減少重複載入</text>
<rect x="52" y="688" width="264" height="43" rx="7" fill="#dff4eb"/>
<text x="184" y="718" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#116447">載入較多的請求</text>
<text x="340" y="718" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#42566d">＋</text>
<rect x="363" y="688" width="264" height="43" rx="7" fill="#e1efff"/>
<text x="495" y="718" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#215f9a">計算較多的請求</text>
<rect x="24" y="777" width="632" height="364" rx="13" fill="#ffffff" stroke="#c9d5e2" stroke-width="1.6"/>
<rect x="45" y="799" width="42" height="42" rx="10" fill="#e1efff"/>
<text x="66" y="830" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#215f9a">3</text>
<text x="101" y="830" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#172b42">仍受載入限制，就補上 decode</text>
<text x="52" y="871" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#42566d">讓資料載入與既有解碼工作重疊</text>
<text x="626" y="900" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#42566d">時間 →</text>
<text x="48" y="950" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#42566d">CPU→GPU</text>
<text x="48" y="1013" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#42566d">GPU 工作</text>
<path d="M198 962 L628 962" fill="none" stroke="#c9d5e2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="197" y="915" width="254" height="49" rx="8" fill="#fff0da"/>
<text x="324" y="949" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#8a4f13">載入 KV</text>
<rect x="197" y="977" width="254" height="49" rx="8" fill="#e1efff"/>
<text x="324" y="1011" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#215f9a">既有 decode</text>
<rect x="474" y="977" width="154" height="49" rx="8" fill="#dff4eb"/>
<text x="551" y="1011" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#116447">新 prefill</text>
<path d="M462 912 L462 1036" fill="none" stroke="#62768b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
<text x="462" y="1070" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#42566d">KV 就緒</text>
<text x="340" y="1114" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#172b42">prefill 在載入就緒後執行</text>
<text x="340" y="1181" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#42566d">排程示意，區塊長度不代表實測時間</text>
