<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 813" role="img" aria-labelledby="title desc"><title id="title">PR 已建立但回覆遺失時，先核對相同工作與遠端物件</title><desc id="desc">建立 PR 已在外部成功，回覆途中遺失。恢復相同工作或 session 並查遠端物件；找到相符結果就連回原工作，確認不存在且可安全重試才再操作。盲目重送新任務可能產生重複 PR。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker></defs><rect width="640" height="813" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="28" fill="#172c42" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Recover an unknown outcome</tspan></text><text x="28" y="77" font-size="22" fill="#52687a" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Reference recovery path / author design</tspan></text><rect x="28" y="110" width="364" height="86" rx="14" fill="#eef5fb" stroke="#1769aa" stroke-width="2"/><text x="210" y="146" font-size="23" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="210" dy="0">Send PR creation request</tspan><tspan x="210" dy="29.900000000000002">External PR is created</tspan></text><path d="M 210 196 L 210 235" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="249" width="364" height="82" rx="14" fill="#fff0ef" stroke="#a7353b" stroke-width="2"/><text x="210" y="283" font-size="23" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="210" dy="0">Reply is lost</tspan><tspan x="210" dy="29.900000000000002">Application outcome: unknown</tspan></text><path d="M 210 331 L 210 372" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="386" width="364" height="106" rx="14" fill="#eef5fb" stroke="#1769aa" stroke-width="2"/><text x="210" y="423" font-size="22" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="210" dy="0">Recover the same job / session</tspan><tspan x="210" dy="28.6">Read remote PR and branch</tspan><tspan x="210" dy="28.6">Check identity and revision</tspan></text><rect x="422" y="249" width="190" height="160" rx="14" fill="#fff0ef" stroke="#a7353b" stroke-width="2"/><text x="517" y="285" font-size="23" fill="#172c42" text-anchor="middle" font-weight="700"><tspan x="517" dy="0">Blindly send</tspan><tspan x="517" dy="29.900000000000002">a new task</tspan></text><text x="517" y="364" font-size="23" fill="#a7353b" text-anchor="middle" font-weight="400"><tspan x="517" dy="0">Duplicate</tspan><tspan x="517" dy="29.900000000000002">PR risk</tspan></text><path d="M 392 290 L 422 290" fill="none" stroke="#a7353b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 210 492 L 210 530 L 150 530 L 150 563" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow)"/><path d="M 210 530 L 477 530 L 477 563" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="577" width="244" height="112" rx="14" fill="#edf7f1" stroke="#207458" stroke-width="2"/><text x="150" y="614" font-size="22" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">Found + matches</tspan><tspan x="150" dy="28.6">Attach existing result</tspan><tspan x="150" dy="28.6">Then finish</tspan></text><rect x="348" y="577" width="264" height="112" rx="14" fill="#eef5fb" stroke="#1769aa" stroke-width="2"/><text x="480" y="614" font-size="22" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">Confirmed absent</tspan><tspan x="480" dy="28.6">Check retry safety</tspan><tspan x="480" dy="28.6">Then retry</tspan></text><text x="28" y="741" font-size="22" fill="#52687a" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Still uncertain? Keep the outcome unknown.</tspan><tspan x="28" dy="28.6">Session recovery alone does not prove completion.</tspan></text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172c42" i]{fill:#cad6e2}[fill="#1769aa" i]{fill:#59a8e7}[fill="#52687a" i]{fill:#bbc3c9}[fill="#a7353b" i]{fill:#d88488}[fill="#edf7f1" i]{fill:#1e2b23}[fill="#eef5fb" i]{fill:#19242d}[fill="#fff0ef" i]{fill:#311413}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1769aa" i]{stroke:#59a8e7}[stroke="#207458" i]{stroke:#57d1a8}[stroke="#a7353b" i]{stroke:#d88488}}</style>
</svg>