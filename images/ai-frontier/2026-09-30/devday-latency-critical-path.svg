<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 651" role="img" aria-labelledby="title desc"><title id="title">模型部分加速六倍，整體工作只加速一點五倍</title><desc id="desc">假設串行工作原需一百秒，其中四十秒為模型生成、六十秒為其他等待。模型部分加速六倍後，工作仍需六十六點七秒；模型生成時間歸零的下限為六十秒。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker></defs><rect width="640" height="651" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="28" fill="#172c42" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Model speed vs. total latency</tspan></text><text x="28" y="77" font-size="22" fill="#52687a" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Illustrative serial workload / not a benchmark</tspan></text><rect x="28" y="103" width="22" height="22" rx="14" fill="#e5f1ff" stroke="#1769aa" stroke-width="2"/><text x="63" y="121" font-size="22" fill="#172c42" text-anchor="start" font-weight="400"><tspan x="63" dy="0">Model generation</tspan></text><rect x="323" y="103" width="22" height="22" rx="14" fill="#edf7f1" stroke="#207458" stroke-width="2"/><text x="358" y="121" font-size="22" fill="#172c42" text-anchor="start" font-weight="400"><tspan x="358" dy="0">Tools + other waits</tspan></text><text x="28" y="175" font-size="24" fill="#172c42" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Baseline: 100 s</tspan></text><rect x="28" y="191" width="224" height="54" rx="14" fill="#e5f1ff" stroke="#1769aa" stroke-width="2"/><text x="140" y="226" font-size="24" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">40 s</tspan></text><rect x="252" y="191" width="336" height="54" rx="14" fill="#edf7f1" stroke="#207458" stroke-width="2"/><text x="420" y="226" font-size="24" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="420" dy="0">60 s</tspan></text><text x="28" y="292" font-size="24" fill="#172c42" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Model part accelerated 6x: 66.7 s</tspan></text><rect x="28" y="307" width="37.33" height="54" rx="14" fill="#e5f1ff" stroke="#1769aa" stroke-width="2"/><rect x="65.33" y="307" width="336" height="54" rx="14" fill="#edf7f1" stroke="#207458" stroke-width="2"/><text x="233.33" y="343" font-size="24" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="233.33" dy="0">60 s unchanged</tspan></text><text x="28" y="398" font-size="24" fill="#172c42" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Even zero generation time leaves 60 s.</tspan></text><rect x="28" y="415" width="336" height="54" rx="14" fill="#edf7f1" stroke="#207458" stroke-width="2"/><text x="196" y="450" font-size="24" fill="#172c42" text-anchor="middle" font-weight="400"><tspan x="196" dy="0">Lower bound: 60 s</tspan></text><text x="28" y="523" font-size="25" fill="#172c42" text-anchor="start" font-weight="400"><tspan x="28" dy="0">40 / 6 + 60 = 66.7 s</tspan><tspan x="28" dy="32.5">100 / 66.7 = 1.5x total speedup</tspan></text><text x="28" y="610" font-size="22" fill="#52687a" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Assumptions: serial path; other waits unchanged.</tspan></text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#172c42" i]{fill:#cad6e2}[fill="#1769aa" i]{fill:#59a8e7}[fill="#52687a" i]{fill:#bbc3c9}[fill="#e5f1ff" i]{fill:#142335}[fill="#edf7f1" i]{fill:#1e2b23}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1769aa" i]{stroke:#59a8e7}[stroke="#207458" i]{stroke:#57d1a8}}</style>
</svg>