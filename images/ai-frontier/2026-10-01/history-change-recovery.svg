<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img"><rect width="720" height="820" fill="#f5f8fc"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17324b} .head{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:600}.small{font-size:21px}.box{fill:#ffffff;stroke:#8ba4bc;stroke-width:2}.line{fill:none;stroke:#416b8c;stroke-width:3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416b8c"/></marker></defs><title>History mutation and recovery boundary</title><text x="40" y="55" class="head">Recover from a changed prefix</text><rect x="65" y="90" width="590" height="100" rx="15" fill="#ffffff" stroke="#8ba4bc" stroke-width="2"/><text x="360" y="127" text-anchor="middle" class="label">SAVED HISTORY</text><text x="360" y="161" text-anchor="middle" class="small">system + tools + messages + thinking</text><path d="M360 190V225" class="line" marker-end="url(#arrow)"/><rect x="65" y="235" width="590" height="100" rx="15" fill="#e4f0fb" stroke="#8ba4bc" stroke-width="2"/><text x="360" y="272" text-anchor="middle" class="label">NEXT REQUEST</text><text x="360" y="306" text-anchor="middle" class="small">Did the earlier prefix change?</text><path d="M360 335V370H195V405M360 370H530V405" class="line" marker-end="url(#arrow)"/><rect x="40" y="420" width="310" height="130" rx="15" fill="#e6f5ed" stroke="#8ba4bc" stroke-width="2"/><text x="195" y="462" text-anchor="middle" class="label">UNCHANGED PREFIX</text><text x="195" y="498" text-anchor="middle" class="small">Compatible blocks?</text><rect x="380" y="420" width="300" height="130" rx="15" fill="#fff0df" stroke="#8ba4bc" stroke-width="2"/><text x="530" y="462" text-anchor="middle" class="label">EDITED PREFIX</text><text x="530" y="498" text-anchor="middle" class="small">Reject / drop by policy</text><path d="M530 550V595H360V625" class="line" marker-end="url(#arrow)"/><rect x="65" y="635" width="590" height="100" rx="15" fill="#ffffff" stroke="#8ba4bc" stroke-width="2"/><text x="360" y="672" text-anchor="middle" class="label">RECOVER JOB STATE</text><text x="360" y="706" text-anchor="middle" class="small">Verify artifacts; restore or start new branch</text><text x="40" y="783" class="small">HTTP success does not prove state continuity</text><text x="40" y="809" class="small">Author design · account / platform dependent</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#416b8c" i]{fill:#6291b6}[fill="#e4f0fb" i]{fill:#192632}[fill="#e6f5ed" i]{fill:#1f2e26}[fill="#f5f8fc" i]{fill:#192029}[fill="#fff0df" i]{fill:#372715}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#8ba4bc" i]{stroke:#a4b8cb}text{fill:#c7d5e2}.box{fill:#1b1f20;stroke:#a4b8cb}.line{stroke:#6291b6}}</style>
</svg>
