<svg xmlns="http://www.w3.org/2000/svg" width="540" height="760" viewBox="0 0 540 760" role="img" aria-labelledby="ttl dsc">
<style>
  text{font-family:"Noto Sans CJK TC","PingFang TC",sans-serif}
  .bg{fill:#f7fafc}.cell{fill:#ffffff;stroke:#b6cbdd;stroke-width:1.6}.cap{fill:#e9f3fb;stroke:#6b9bbd;stroke-width:1.6}.accent{fill:#eaf7f3;stroke:#55a58c;stroke-width:1.6}
  .ink{fill:#17324a}.muted{fill:#526a7d}.arrow{stroke:#7192a8;stroke-width:2;fill:none}.tag{fill:#235e82}
  @media (prefers-color-scheme:dark){.bg{fill:#101923}.cell{fill:#182937;stroke:#58718a}.cap{fill:#17384f;stroke:#5b9ec3}.accent{fill:#184037;stroke:#55b69f}.ink{fill:#eef5fb}.muted{fill:#b0c3d2}.arrow{stroke:#9bb7c9}.tag{fill:#8fc5ef}}
</style>
<title id="ttl">ETH 演算法論證概念路徑</title>
<desc id="dsc">六個自上而下的研究階段，從布林精確計數到分群、共享摘要、插值、稀疏化與次指數上界。</desc>
<rect width="540" height="760" rx="16" class="bg"/>
<text x="26" y="32" class="ink" font-weight="700" font-size="19">從邏輯公式走向次指數精確計數</text>
<text x="26" y="53" class="muted" font-size="12">依據 OpenAI 論文 §2–6、Appendix D 整理</text>
<rect x="26" y="75" width="488" height="78" rx="12" class="cap"/>
    <text x="44" y="104" class="ink" font-size="17" font-weight="700">布林公式與精確計數</text><text x="44" y="129" class="muted" font-size="12.5">k-CNF 公式 → 所有滿足指派的數量 #SAT</text>
<path d="M270 153 L270 179" class="arrow"/><path d="M263 172 L270 179 L277 172" class="arrow"/>
<rect x="26" y="183" width="488" height="78" rx="12" class="cell"/>
    <text x="44" y="212" class="ink" font-size="17" font-weight="700">轉換成代數求和</text><text x="44" y="237" class="muted" font-size="12.5">條件為真取 1；條件為假取 0；對全部指派加總</text>
<path d="M270 261 L270 287" class="arrow"/><path d="M263 280 L270 287 L277 280" class="arrow"/>
<rect x="26" y="291" width="488" height="78" rx="12" class="cell"/>
    <text x="44" y="320" class="ink" font-size="17" font-weight="700">分群與共享線性摘要</text><text x="44" y="345" class="muted" font-size="12.5">把跨群交錯資訊壓縮為可重用的代數描述</text>
<path d="M270 369 L270 395" class="arrow"/><path d="M263 388 L270 395 L277 388" class="arrow"/>
<rect x="26" y="399" width="488" height="78" rx="12" class="cell"/>
    <text x="44" y="428" class="ink" font-size="17" font-weight="700">低次替代與插值</text><text x="44" y="453" class="muted" font-size="12.5">用少量評估重建所需的多項式資訊</text>
<path d="M270 477 L270 503" class="arrow"/><path d="M263 496 L270 503 L277 496" class="arrow"/>
<rect x="26" y="507" width="488" height="78" rx="12" class="cell"/>
    <text x="44" y="536" class="ink" font-size="17" font-weight="700">稀疏性、錯誤偵測與收縮</text><text x="44" y="561" class="muted" font-size="12.5">減少需要保存的項數，重組局部計算結果</text>
<path d="M270 585 L270 611" class="arrow"/><path d="M263 604 L270 611 L277 604" class="arrow"/>
<rect x="26" y="615" width="488" height="78" rx="12" class="accent"/>
    <text x="44" y="644" class="ink" font-size="17" font-weight="700">次指數時間的精確解數</text><text x="44" y="669" class="muted" font-size="12.5">固定 k：時間為 2^{o(n)} × 多項式因子</text>
<text x="514" y="743" text-anchor="end" class="muted" font-size="10">Scott Yo-Ru Chen · 2026-10-31</text></svg>