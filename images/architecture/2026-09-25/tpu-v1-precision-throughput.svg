<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#fff"/>
<style>.t{font:700 30px Arial,sans-serif;fill:#111}.s{font:22px Arial,sans-serif;fill:#222}.sm{font:18px Arial,sans-serif;fill:#444}.bar{fill:#8fb7e8}.bar2{fill:#b7cae2}.axis{stroke:#333;stroke-width:2}</style>
<text x="600" y="48" text-anchor="middle" class="t">TPU v1 throughput follows operand precision directly</text>
<text x="600" y="83" text-anchor="middle" class="sm">Matrix Unit relative speed reported by Jouppi et al.; TOPS values are derived from the 92 TOPS INT8 peak</text>
<line x1="150" y1="570" x2="1080" y2="570" class="axis"/>
<line x1="150" y1="140" x2="150" y2="570" class="axis"/>
<text x="105" y="155" class="sm">1.0×</text><text x="105" y="360" class="sm">0.5×</text><text x="105" y="575" class="sm">0</text>
<rect x="235" y="150" width="190" height="420" class="bar"/>
<rect x="510" y="360" width="190" height="210" class="bar2"/>
<rect x="785" y="465" width="190" height="105" class="bar2"/>
<text x="330" y="610" text-anchor="middle" class="s">8b × 8b</text><text x="330" y="130" text-anchor="middle" class="s">1.0× ≈ 92 TOPS</text>
<text x="605" y="610" text-anchor="middle" class="s">8b × 16b</text><text x="605" y="340" text-anchor="middle" class="s">0.5× ≈ 46 TOPS</text>
<text x="880" y="610" text-anchor="middle" class="s">16b × 16b</text><text x="880" y="445" text-anchor="middle" class="s">0.25× ≈ 23 TOPS</text>
<text x="600" y="660" text-anchor="middle" class="sm">Precision is therefore a throughput parameter in the first TPU, not only a model-format choice.</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#fff" i]{fill:#1b1f20}.t{fill:#dee1e1}.s{fill:#d8dbdb}.sm{fill:#cbcfd0}.bar{fill:#89b3e7}.bar2{fill:#2e3844}.axis{stroke:#d2d5d6}}</style>
</svg>