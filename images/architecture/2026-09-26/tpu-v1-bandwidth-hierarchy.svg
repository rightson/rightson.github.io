<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<rect width="1200" height="690" fill="white"/>
<style>
.t{font:700 28px Arial,sans-serif;fill:#111}.s{font:20px Arial,sans-serif;fill:#222}.n{font:17px Arial,sans-serif;fill:#444}
.b{fill:#eef5ff;stroke:#2458a6;stroke-width:2}.g{fill:#eef8ee;stroke:#397a3b;stroke-width:2}.o{fill:#fff4e5;stroke:#aa6b12;stroke-width:2}
</style>
<text x="600" y="45" text-anchor="middle" class="t">TPU v1 bandwidth hierarchy is deliberately asymmetric</text>
<rect x="75" y="120" width="250" height="100" rx="12" class="g"/>
<text x="200" y="160" text-anchor="middle" class="s">Host ↔ TPU</text><text x="200" y="192" text-anchor="middle" class="n">PCIe Gen3 x16</text>
<rect x="475" y="120" width="250" height="100" rx="12" class="g"/>
<text x="600" y="160" text-anchor="middle" class="s">Weight DDR3 → FIFO</text><text x="600" y="192" text-anchor="middle" class="n">30 GiB/s</text>
<rect x="875" y="120" width="250" height="100" rx="12" class="b"/>
<text x="1000" y="160" text-anchor="middle" class="s">UB → MXU</text><text x="1000" y="192" text-anchor="middle" class="n">167 GiB/s</text>
<text x="200" y="285" text-anchor="middle" class="n">Google reports ~12.5 GB/s effective host bandwidth</text>
<text x="600" y="285" text-anchor="middle" class="n">~46 bytes/cycle @ 700 MHz</text>
<text x="1000" y="285" text-anchor="middle" class="n">256 bytes/cycle @ 700 MHz</text>
<rect x="110" y="360" width="980" height="52" rx="8" fill="#f5f5f5" stroke="#333"/>
<rect x="110" y="360" width="156" height="52" rx="8" class="g"/>
<rect x="266" y="360" width="374" height="52" class="g"/>
<rect x="640" y="360" width="450" height="52" rx="8" class="b"/>
<text x="200" y="445" text-anchor="middle" class="n">host I/O</text><text x="455" y="445" text-anchor="middle" class="n">weight supply</text><text x="865" y="445" text-anchor="middle" class="n">hot activation path</text>
<text x="600" y="515" text-anchor="middle" class="s">The MXU is fed by a much wider on-chip path than either off-chip interface.</text>
<text x="600" y="555" text-anchor="middle" class="n">Therefore performance depends on keeping data resident and reusing it, not continuously streaming from DRAM.</text>
<text x="600" y="630" text-anchor="middle" class="n">Numbers are architectural interface rates, not an application-level throughput guarantee.</text>
</svg>