<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 745" role="img" aria-labelledby="title desc"><title id="title">Control and data planes</title><desc id="desc">Identity provider authenticates login. Coordination distributes keys and policy. Laptop and server use direct or relayed encrypted data paths.</desc><defs><marker id="arrow-1769aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker><marker id="arrow-b45a13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45a13"/></marker></defs><rect width="660" height="745" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#16324f" text-anchor="start" font-weight="bold">Identity and policy above; packets below</text><rect x="175" y="75" width="310" height="80" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="330.0" y="107" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Identity provider</text><text x="330.0" y="133" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">login / MFA</text><path d="M330,155 L330,188" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><rect x="125" y="195" width="410" height="100" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="330.0" y="227" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Coordination server</text><text x="330.0" y="253" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">node public keys + policy</text><text x="330.0" y="279" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">endpoint information</text><path d="M180,295 L180,350" fill="none" stroke="#b45a13" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-b45a13)"/><path d="M480,295 L480,350" fill="none" stroke="#b45a13" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-b45a13)"/><rect x="55" y="360" width="250" height="90" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="180.0" y="392" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop A</text><text x="180.0" y="418" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">private key stays here</text><rect x="355" y="360" width="250" height="90" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="480.0" y="392" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Server B</text><text x="480.0" y="418" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">private key stays here</text><path d="M305,405 L348,405" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="478" font-size="21" fill="#1769aa" text-anchor="middle" font-weight="normal">Direct UDP: WireGuard ciphertext</text><rect x="180" y="535" width="300" height="90" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="330.0" y="567" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Relay option</text><text x="330.0" y="593" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">Peer Relay or DERP</text><path d="M100,450 L100,510 L260,510 L260,528" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><path d="M400,535 L400,510 L560,510 L560,457" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="662" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">Relay forwards ciphertext; it does not end the tunnel.</text><text x="30" y="715" font-size="21" fill="#16324f" text-anchor="start" font-weight="normal">Orange: control      Blue: application data</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#16324f" i]{fill:#c5d4e2}[fill="#1769aa" i]{fill:#59a8e7}[fill="#b45a13" i]{fill:#e89b5e}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1769aa" i]{stroke:#59a8e7}[stroke="#b45a13" i]{stroke:#e89b5e}[stroke="#bacbd9" i]{stroke:#a3bacc}}</style>
</svg>