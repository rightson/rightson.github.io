<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 555" role="img" aria-labelledby="title desc"><title id="title">Different private networks</title><desc id="desc">Laptop and Linux server behind separate NATs can reach the Internet but lack a shared private route.</desc><defs><marker id="arrow-1769aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker><marker id="arrow-b45a13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45a13"/></marker></defs><rect width="660" height="555" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#16324f" text-anchor="start" font-weight="bold">Two private networks need a reachable path</text><rect x="25" y="75" width="280" height="325" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><rect x="355" y="75" width="280" height="325" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="108" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">Remote Wi-Fi</text><text x="375" y="108" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">Home LAN</text><rect x="50" y="130" width="230" height="88" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="165.0" y="162" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop</text><text x="165.0" y="188" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">192.168.50.10</text><rect x="380" y="130" width="230" height="88" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="495.0" y="162" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Linux server</text><text x="495.0" y="188" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">192.168.50.20</text><path d="M165,218 L165,260" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><path d="M495,218 L495,260" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><rect x="50" y="260" width="230" height="106" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="165.0" y="292" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">NAT + firewall</text><text x="165.0" y="318" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">198.51.100.20</text><text x="165.0" y="344" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">outbound state</text><rect x="380" y="260" width="230" height="106" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="495.0" y="292" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">NAT + firewall</text><text x="495.0" y="318" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">203.0.113.10</text><text x="495.0" y="344" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">outbound state</text><path d="M165,366 L165,450 L252,450" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><path d="M495,366 L495,450 L408,450" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><rect x="255" y="420" width="150" height="63" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="330.0" y="452" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Internet</text><path d="M280,175 L376,175" fill="none" stroke="#b45a13" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-b45a13)"/><text x="330" y="241" font-size="20" fill="#b45a13" text-anchor="middle" font-weight="normal">SSH?</text><text x="30" y="524" font-size="21" fill="#16324f" text-anchor="start" font-weight="normal">Private IPs are local; discovery + a path are needed.</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg