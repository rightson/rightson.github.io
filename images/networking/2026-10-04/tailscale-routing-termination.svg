<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 835" role="img" aria-labelledby="title desc"><title id="title">Encryption termination across routes</title><desc id="desc">Native node access ends encryption on the server. Subnet and exit routes terminate WireGuard on the router; later legs rely on application encryption.</desc><defs><marker id="arrow-1769aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker><marker id="arrow-b45a13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45a13"/></marker></defs><rect width="660" height="835" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="40" font-size="25" fill="#16324f" text-anchor="start" font-weight="bold">Where the WireGuard tunnel ends</text><rect x="25" y="75" width="610" height="175" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="110" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">1  Native node access</text><rect x="45" y="140" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="132.5" y="172" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop</text><rect x="435" y="140" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="522.5" y="172" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Server</text><path d="M220,175 L428,175" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="154" font-size="20" fill="#1769aa" text-anchor="middle" font-weight="normal">WireGuard</text><text x="330" y="232" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">Both machines are tunnel endpoints.</text><rect x="25" y="275" width="610" height="230" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="310" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">2  Subnet route to a NAS</text><rect x="45" y="335" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="132.5" y="367" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop</text><rect x="435" y="335" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="522.5" y="367" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Router</text><path d="M220,370 L428,370" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="351" font-size="20" fill="#1769aa" text-anchor="middle" font-weight="normal">WireGuard</text><path d="M522,405 L522,445 L395,445" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><rect x="210" y="415" width="175" height="65" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="297.5" y="447" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">NAS</text><text x="45" y="448" font-size="20" fill="#b45a13" text-anchor="start" font-weight="normal">LAN leg:</text><text x="45" y="478" font-size="20" fill="#b45a13" text-anchor="start" font-weight="normal">HTTPS / SSH</text><rect x="25" y="530" width="610" height="230" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="565" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">3  Exit node to the Internet</text><rect x="45" y="590" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="132.5" y="622" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop</text><rect x="435" y="590" width="175" height="70" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="522.5" y="622" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Exit node</text><path d="M220,625 L428,625" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="606" font-size="20" fill="#1769aa" text-anchor="middle" font-weight="normal">WireGuard</text><path d="M522,660 L522,700 L405,700" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><rect x="200" y="670" width="195" height="65" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="297.5" y="702" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Public website</text><text x="45" y="706" font-size="20" fill="#b45a13" text-anchor="start" font-weight="normal">Internet leg:</text><text x="45" y="736" font-size="20" fill="#b45a13" text-anchor="start" font-weight="normal">HTTPS</text><text x="30" y="805" font-size="20" fill="#16324f" text-anchor="start" font-weight="normal">Blue ends at a node; orange needs application protection.</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#16324f" i]{fill:#c5d4e2}[fill="#1769aa" i]{fill:#59a8e7}[fill="#b45a13" i]{fill:#e89b5e}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1769aa" i]{stroke:#59a8e7}[stroke="#b45a13" i]{stroke:#e89b5e}[stroke="#bacbd9" i]{stroke:#a3bacc}}</style>
</svg>