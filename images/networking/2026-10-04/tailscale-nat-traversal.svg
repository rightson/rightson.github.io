<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 885" role="img" aria-labelledby="title desc"><title id="title">NAT traversal stages</title><desc id="desc">Discover endpoints using STUN, exchange candidates, send peer probes from both sides. The diagram assumes reusable mappings and allowed outbound UDP.</desc><defs><marker id="arrow-1769aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker><marker id="arrow-b45a13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45a13"/></marker></defs><rect width="660" height="885" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#16324f" text-anchor="start" font-weight="bold">UDP hole punching with friendly NATs</text><rect x="25" y="70" width="610" height="250" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="106" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">1  Discover external endpoints</text><rect x="45" y="128" width="260" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="175.0" y="160" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop + NAT A</text><text x="175.0" y="186" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">198.51.100.20:53000</text><rect x="355" y="128" width="260" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="485.0" y="160" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Server + NAT B</text><text x="485.0" y="186" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">203.0.113.10:62001</text><path d="M175,213 L175,259 L249,259" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><path d="M485,213 L485,259 L411,259" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><rect x="255" y="230" width="150" height="65" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="330.0" y="262" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">STUN</text><rect x="25" y="345" width="610" height="190" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="381" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">2  Exchange candidates through a side channel</text><rect x="45" y="411" width="240" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="165.0" y="443" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Laptop A</text><text x="165.0" y="469" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">learns B endpoint</text><rect x="375" y="411" width="240" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="495.0" y="443" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">Server B</text><text x="495.0" y="469" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">learns A endpoint</text><path d="M285,443 L369,443" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><path d="M375,475 L291,475" fill="none" stroke="#b45a13" stroke-width="3" marker-end="url(#arrow-b45a13)"/><rect x="25" y="560" width="610" height="255" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="45" y="596" font-size="22" fill="#16324f" text-anchor="start" font-weight="bold">3  Both sides send probes</text><rect x="45" y="626" width="240" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="165.0" y="658" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">NAT A state</text><text x="165.0" y="684" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">allows peer return</text><rect x="375" y="626" width="240" height="85" rx="12" fill="#f0f5fa" stroke="#bacbd9" stroke-width="1.5"/><text x="495.0" y="658" font-size="20" fill="#16324f" text-anchor="middle" font-weight="bold">NAT B state</text><text x="495.0" y="684" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">allows peer return</text><path d="M285,653 L369,653" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><path d="M375,685 L291,685" fill="none" stroke="#1769aa" stroke-width="3" marker-end="url(#arrow-1769aa)"/><text x="330" y="752" font-size="20" fill="#16324f" text-anchor="middle" font-weight="normal">Repeated probes test bidirectional reachability.</text><text x="330" y="783" font-size="20" fill="#1769aa" text-anchor="middle" font-weight="normal">Success enables a direct encrypted UDP path.</text><text x="30" y="856" font-size="20" fill="#16324f" text-anchor="start" font-weight="normal">STUN discovery alone does not prove peer reachability.</text></g><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#16324f" i]{fill:#c5d4e2}[fill="#1769aa" i]{fill:#59a8e7}[fill="#b45a13" i]{fill:#e89b5e}[fill="#f0f5fa" i]{fill:#1b232b}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#1769aa" i]{stroke:#59a8e7}[stroke="#b45a13" i]{stroke:#e89b5e}[stroke="#bacbd9" i]{stroke:#a3bacc}}</style>
</svg>