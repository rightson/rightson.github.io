<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; fill:#111; }
    .title { font-size:28px; font-weight:700; }
    .sub { font-size:16px; fill:#444; }
    .box { fill:#f7f7f7; stroke:#333; stroke-width:2; rx:10; }
    .label { font-size:19px; font-weight:700; }
    .detail { font-size:15px; }
    .arrow { stroke:#333; stroke-width:2.5; marker-end:url(#a); }
    .dashed { stroke:#666; stroke-width:2; stroke-dasharray:7 7; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <text x="60" y="55" class="title">Fault containment：同一個 root cause，不應一路放大到整個 workload</text>
  <text x="60" y="85" class="sub">局部恢復失敗時才逐層升級，目標是縮小 recovery scope</text>
  <rect x="70" y="150" width="180" height="90" class="box"/>
  <text x="105" y="185" class="label">Signal Error</text>
  <text x="95" y="215" class="detail">BER / burst / lane degrade</text>
  <rect x="310" y="150" width="200" height="90" class="box"/>
  <text x="365" y="185" class="label">PHY</text>
  <text x="340" y="215" class="detail">FEC / PLR / UPHY</text>
  <rect x="570" y="150" width="210" height="90" class="box"/>
  <text x="620" y="185" class="label">Fabric</text>
  <text x="595" y="215" class="detail">CBFC / reroute / drain</text>
  <rect x="840" y="150" width="270" height="90" class="box"/>
  <text x="895" y="185" class="label">Runtime-visible</text>
  <text x="870" y="215" class="detail">NCCL communicator failure</text>
  <line x1="250" y1="195" x2="310" y2="195" class="arrow"/>
  <line x1="510" y1="195" x2="570" y2="195" class="arrow"/>
  <line x1="780" y1="195" x2="840" y2="195" class="arrow"/>
  <rect x="185" y="340" width="240" height="95" class="box"/>
  <text x="225" y="375" class="label">Local Recovery</text>
  <text x="215" y="405" class="detail">fault 對 workload 幾乎不可見</text>
  <rect x="485" y="340" width="240" height="95" class="box"/>
  <text x="520" y="375" class="label">Topology Recovery</text>
  <text x="515" y="405" class="detail">degraded route / link rebalance</text>
  <rect x="785" y="340" width="250" height="95" class="box"/>
  <text x="820" y="375" class="label">Process Recovery</text>
  <text x="815" y="405" class="detail">Shadow Engine / elasticity</text>
  <line x1="410" y1="240" x2="310" y2="340" class="dashed"/>
  <line x1="675" y1="240" x2="605" y2="340" class="dashed"/>
  <line x1="975" y1="240" x2="910" y2="340" class="dashed"/>
  <rect x="400" y="535" width="400" height="100" class="box"/>
  <text x="495" y="575" class="label">Checkpoint / Job Recovery</text>
  <text x="445" y="608" class="detail">只有前面層級無法恢復時，才支付最高 recovery cost</text>
  <line x1="305" y1="435" x2="515" y2="535" class="dashed"/>
  <line x1="605" y1="435" x2="600" y2="535" class="dashed"/>
  <line x1="910" y1="435" x2="685" y2="535" class="dashed"/>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#333" i]{fill:#d2d5d6}text{fill:#dee1e1}.sub{fill:#cbcfd0}.box{fill:#1f2325;stroke:#d2d5d6}.arrow{stroke:#d2d5d6}.dashed{stroke:#bfc4c5}}</style>
</svg>