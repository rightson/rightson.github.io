<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; fill:#111; }
    .title { font-size:28px; font-weight:700; }
    .sub { font-size:16px; fill:#444; }
    .box { fill:#f7f7f7; stroke:#333; stroke-width:2; rx:12; }
    .layer { font-size:21px; font-weight:700; }
    .detail { font-size:16px; }
    .time { font-size:17px; font-weight:700; }
    .arrow { stroke:#333; stroke-width:2.5; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <text x="60" y="55" class="title">NVLink 6：故障越往上逃逸，恢復成本越高</text>
  <text x="60" y="85" class="sub">核心原則：優先在最靠近 fault source 的 layer detect → contain → recover</text>
  <rect x="120" y="125" width="960" height="90" class="box"/>
  <text x="155" y="160" class="layer">Physical Layer</text>
  <text x="390" y="160" class="detail">Lightweight FEC → PLR → UPHY recovery / replay buffer</text>
  <text x="880" y="190" class="time">near-zero ～ &lt; 1 ms</text>
  <line x1="600" y1="215" x2="600" y2="255" class="arrow"/>
  <rect x="120" y="255" width="960" height="90" class="box"/>
  <text x="155" y="290" class="layer">Link / Fabric Layer</text>
  <text x="390" y="290" class="detail">CBFC、access/trunk rebalancing、local fault containment</text>
  <text x="880" y="320" class="time">sub-ms ～ ms</text>
  <line x1="600" y1="345" x2="600" y2="385" class="arrow"/>
  <rect x="120" y="385" width="960" height="90" class="box"/>
  <text x="155" y="420" class="layer">Control Plane</text>
  <text x="390" y="420" class="detail">NMX contain-and-drain、NMX-HA、data/control plane decoupling</text>
  <text x="880" y="450" class="time">~ seconds</text>
  <line x1="600" y1="475" x2="600" y2="515" class="arrow"/>
  <rect x="120" y="515" width="960" height="90" class="box"/>
  <text x="155" y="550" class="layer">Runtime / NCCL</text>
  <text x="390" y="550" class="detail">communicator elasticity、Shadow Engine failover</text>
  <text x="880" y="580" class="time">seconds</text>
  <line x1="600" y1="605" x2="600" y2="645" class="arrow"/>
  <rect x="120" y="645" width="960" height="80" class="box"/>
  <text x="155" y="680" class="layer">Application / System</text>
  <text x="390" y="680" class="detail">checkpoint / restore、rack serviceability、job reconstruction</text>
  <text x="880" y="705" class="time">10s ～ minutes</text>
</svg>