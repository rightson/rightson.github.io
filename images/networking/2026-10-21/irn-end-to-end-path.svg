<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">IRN 從 WQE 到 CQE 的資料與完成路徑</title>
<desc id="desc">Requester 將 WQE 分段成帶 PSN 的封包，lossy fabric 可丟失或重排，responder 直接 DMA 到最終位址並以 bitmap 等待缺口，連續前綴完整後才交付 CQE。</desc>
<style>
  :root{color-scheme:light dark}
  .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.data{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.ctrl{stroke:#ea580c;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#b)}
  .t{font:700 25px system-ui,sans-serif;fill:#0f172a}.s{font:19px system-ui,sans-serif;fill:#334155}.tag{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.wait{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.sig{font:14px system-ui,sans-serif;fill:#64748b}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker></defs>
<rect class="bg" width="1200" height="760"/>
<text class="t" x="60" y="62">Requester</text><text class="t" x="480" y="62">Lossy fabric</text><text class="t" x="880" y="62">Responder</text>
<rect class="box" x="55" y="100" rx="18" width="280" height="130"/><text class="t" x="85" y="145">Request WQE</text><text class="s" x="85" y="183">位址、長度、operation</text>
<rect class="tag" x="55" y="275" rx="18" width="280" height="160"/><text class="t" x="85" y="320">封包化</text><text class="s" x="85" y="360">PSN 0, 1, 2, …</text><text class="s" x="85" y="395">每包可獨立重傳</text>
<rect class="wait" x="455" y="245" rx="18" width="290" height="210"/><text class="t" x="500" y="295">丟失與重排</text><text class="s" x="500" y="338">PSN 2 遺失</text><text class="s" x="500" y="375">PSN 3–11 先抵達</text><text class="s" x="500" y="412">NACK / timeout</text>
<rect class="box" x="850" y="100" rx="18" width="295" height="125"/><text class="t" x="885" y="145">最終應用程式記憶體</text><text class="s" x="885" y="183">失序封包直接 DMA</text>
<rect class="tag" x="850" y="275" rx="18" width="295" height="125"/><text class="t" x="885" y="320">arrival bitmap</text><text class="s" x="885" y="360">追蹤已到 PSN 與尾包</text>
<rect class="wait" x="850" y="475" rx="18" width="295" height="130"/><text class="t" x="885" y="520">CQE 暫留</text><text class="s" x="885" y="558">連續前綴完整後交付</text>
<path class="data" d="M195 230 V270"/><path class="data" d="M335 355 H445"/><path class="data" d="M755 335 H840"/><path class="data" d="M998 400 V465"/><path class="ctrl" d="M850 425 C700 570,430 560,320 440"/>
<text class="s" x="490" y="555">缺口 PSN 的選擇性重傳</text><text class="sig" x="950" y="728">Scott Yo-Ru Chen · 2026-10-21</text>
<style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#2563eb" i]{fill:#82a4ed}[fill="#ea580c" i]{fill:#eda782}.bg{fill:#1a2026}.box{fill:#1b1f20;stroke:#c6ccd5}.data{stroke:#82a4ed}.ctrl{stroke:#eda782}.t{fill:#d1d7e6}.s{fill:#c6ccd5}.tag{fill:#172538;stroke:#82a4ed}.wait{fill:#3b2c16;stroke:#eda782}.sig{fill:#929eb0}}</style>
</svg>
