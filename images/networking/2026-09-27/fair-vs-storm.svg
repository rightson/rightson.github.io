<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Fair sharing versus urgency scheduling</title>
<desc id="desc">An illustrative timeline contrasts equal interleaving of a short request with two large requests against urgency scheduling that completes the short request first and then a backlog-blocking request.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17212b}
.axis{stroke:#5b6877;stroke-width:2}.a{fill:#7db6e8}.b{fill:#e9b86e}.c{fill:#97c99c}.label{font-size:24px}.head{font-size:32px;font-weight:700}.note{font-size:20px}
@media (prefers-color-scheme: dark){text{fill:#eef4fb}.axis{stroke:#a8b7c6}.a{fill:#4f91c8}.b{fill:#c78f3f}.c{fill:#67a96e}}
</style>
<text x="60" y="55" class="head">Illustrative service order: fair share vs urgency-aware</text>
<text x="60" y="125" class="label">Fair sharing</text>
<line x1="210" y1="118" x2="1120" y2="118" class="axis"/>
<rect x="230" y="90" width="70" height="56" rx="8" class="a"/><text x="250" y="126" class="note">A</text>
<rect x="305" y="90" width="150" height="56" rx="8" class="b"/><text x="365" y="126" class="note">B</text>
<rect x="460" y="90" width="180" height="56" rx="8" class="c"/><text x="535" y="126" class="note">C</text>
<rect x="645" y="90" width="70" height="56" rx="8" class="a"/><text x="665" y="126" class="note">A</text>
<rect x="720" y="90" width="150" height="56" rx="8" class="b"/><text x="780" y="126" class="note">B</text>
<rect x="875" y="90" width="180" height="56" rx="8" class="c"/><text x="950" y="126" class="note">C</text>
<text x="210" y="175" class="note">A 的完成被大 request 交錯延後</text>
<text x="60" y="300" class="label">Urgency-aware</text>
<line x1="210" y1="293" x2="1120" y2="293" class="axis"/>
<rect x="230" y="265" width="110" height="56" rx="8" class="a"/><text x="275" y="301" class="note">A</text>
<rect x="345" y="265" width="300" height="56" rx="8" class="b"/><text x="475" y="301" class="note">B</text>
<rect x="650" y="265" width="405" height="56" rx="8" class="c"/><text x="835" y="301" class="note">C</text>
<text x="210" y="350" class="note">先完成短 request，再服務 backlog 高、可能阻塞後續工作的 request</text>
<g transform="translate(210,430)">
<rect x="0" y="0" width="45" height="45" rx="6" class="a"/><text x="60" y="31" class="note">A = 64 KB, backlog 0</text>
<rect x="330" y="0" width="45" height="45" rx="6" class="b"/><text x="390" y="31" class="note">B = 8 MB, backlog 12</text>
<rect x="690" y="0" width="45" height="45" rx="6" class="c"/><text x="750" y="31" class="note">C = 16 MB, backlog 0</text>
</g>
<text x="60" y="565" class="note">示意圖只表達 scheduling intuition；不是 STORM 論文的實驗時間線。</text>
</svg>