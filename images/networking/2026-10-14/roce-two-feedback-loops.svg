<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="title desc">
<title id="title">Two feedback loops in a four-to-one RoCE burst</title><desc id="desc">Data passes through four ingress priority groups into one egress queue. PFC returns to the neighbour. Receiver-generated CNP returns to original senders.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c05a13"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17324d;font-size:23px} .small{font-size:18px} .head{font-size:28px;font-weight:700} .tiny{font-size:10px}</style>
<rect width="600" height="820" fill="#ffffff"/>
<text x="30" y="42" text-anchor="start" class="head">Four inputs, one bottleneck</text>
<text x="30" y="76" text-anchor="start" class="small">Hypothetical data rates and reaction delays</text>
<rect x="135" y="115" width="330" height="92" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="153" text-anchor="middle" class="">Senders A / B / C / D</text>
<text x="300" y="185" text-anchor="middle" class="small">4 × 400 Gb/s</text>
<rect x="75" y="300" width="450" height="300" rx="12" fill="#f5f8fc" stroke="#668099" stroke-width="2"/>
<text x="300" y="582" text-anchor="middle" class="">Ingress PGs + egress queue</text>
<path d="M145,208 L145,357" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<rect x="105" y="357" width="80" height="55" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="145" y="393" text-anchor="middle" class="">A</text>
<path d="M145,413 L145,440 L300,440 L300,465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<path d="M245,208 L245,357" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<rect x="205" y="357" width="80" height="55" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="245" y="393" text-anchor="middle" class="">B</text>
<path d="M245,413 L245,440 L300,440 L300,465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<path d="M345,208 L345,357" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<rect x="305" y="357" width="80" height="55" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="345" y="393" text-anchor="middle" class="">C</text>
<path d="M345,413 L345,440 L300,440 L300,465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<path d="M445,208 L445,357" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<rect x="405" y="357" width="80" height="55" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="445" y="393" text-anchor="middle" class="">D</text>
<path d="M445,413 L445,440 L300,440 L300,465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<rect x="185" y="465" width="230" height="95" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="503" text-anchor="middle" class="">Egress queue</text>
<text x="300" y="539" text-anchor="middle" class="small">ECN marks data</text>
<path d="M300,560 L300,665" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="313" y="635" text-anchor="start" class="small">400 Gb/s</text>
<rect x="185" y="665" width="230" height="95" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="704" text-anchor="middle" class="">Receiver D</text>
<text x="300" y="739" text-anchor="middle" class="small">Creates CNP</text>
<path d="M105,382 L45,382 L45,161 L130,161" fill="none" stroke="#c05a13" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#orange)"/>
<text x="55" y="244" text-anchor="start" class="small" fill="#c05a13">PFC</text>
<text x="55" y="271" text-anchor="start" class="small" fill="#c05a13">2 µs*</text>
<path d="M415,713 L560,713 L560,161 L470,161" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#purple)"/>
<text x="459" y="624" text-anchor="start" class="small" fill="#7c3aed">CNP</text>
<text x="425" y="651" text-anchor="start" class="small" fill="#7c3aed">8 µs*</text>
<text x="30" y="790" text-anchor="start" class="small">* Stop-arrival / effective rate-change assumptions</text>
<text x="580" y="804" text-anchor="end" class="tiny">Scott Yo-Ru Chen · 2026-10-14</text>
