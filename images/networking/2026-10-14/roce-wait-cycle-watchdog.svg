<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 835" role="img" aria-labelledby="title desc">
<title id="title">A wait cycle and watchdog mitigation</title><desc id="desc">Three occupied buffers wait on each other. A watchdog can break sustained PFC stalls by dropping or forwarding affected packets. Transport and application handle losses.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c05a13"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17324d;font-size:23px} .small{font-size:18px} .head{font-size:28px;font-weight:700} .tiny{font-size:10px}</style>
<rect width="600" height="835" fill="#ffffff"/>
<text x="30" y="42" text-anchor="start" class="head">Persistent stalls need a break</text>
<text x="30" y="77" text-anchor="start" class="small">Buffer dependencies, not physical link arrows</text>
<rect x="60" y="130" width="170" height="80" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="145" y="179" text-anchor="middle" class="">Buffer A</text>
<rect x="370" y="130" width="170" height="80" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="455" y="179" text-anchor="middle" class="">Buffer B</text>
<rect x="215" y="280" width="170" height="80" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="329" text-anchor="middle" class="">Buffer C</text>
<path d="M230,169 L365,169" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="300" y="153" text-anchor="middle" class="small">waits</text>
<path d="M455,210 L455,320 L390,320" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<path d="M215,320 L145,320 L145,215" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="38" y="385" text-anchor="start" class="small">Occupied + no service + sustained XOFF</text>
<path d="M300,365 L300,422" fill="none" stroke="#c05a13" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#orange)"/>
<rect x="65" y="430" width="470" height="90" rx="12" fill="#fff4e9" stroke="#c05a13" stroke-width="2"/>
<text x="300" y="469" text-anchor="middle" class="">Detect persistent pause</text>
<text x="300" y="503" text-anchor="middle" class="small">Platform-specific counters and timer</text>
<path d="M300,520 L300,560" fill="none" stroke="#c05a13" stroke-width="3" marker-end="url(#orange)"/>
<rect x="65" y="567" width="470" height="95" rx="12" fill="#fff4e9" stroke="#c05a13" stroke-width="2"/>
<text x="300" y="605" text-anchor="middle" class="">Temporarily ignore PFC</text>
<text x="300" y="641" text-anchor="middle" class="small">Drop or forward affected traffic</text>
<path d="M300,662 L300,703" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/>
<rect x="65" y="710" width="470" height="85" rx="12" fill="#f3eefe" stroke="#7c3aed" stroke-width="2"/>
<text x="300" y="745" text-anchor="middle" class="">Transport / job handles loss</text>
<text x="300" y="778" text-anchor="middle" class="small">Re-enable PFC after the stall clears</text>
<text x="580" y="819" text-anchor="end" class="tiny">Scott Yo-Ru Chen · 2026-10-14</text>
