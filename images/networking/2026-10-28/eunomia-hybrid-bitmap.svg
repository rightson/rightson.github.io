<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><style>text{font-family:Inter,Noto Sans TC,Arial,sans-serif}.t{font-size:28px;font-weight:700;fill:#0f172a}.h{font-size:18px;font-weight:650;fill:#0f172a}.b{font-size:15px;fill:#334155}.s{font-size:13px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs><rect width="900" height="650" fill="#ffffff"/><text class="t" x="40" y="54">Hybrid bitmap 以 linear 區段吸收擴張</text>
