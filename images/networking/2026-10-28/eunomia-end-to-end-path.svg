<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><style>text{font-family:Inter,Noto Sans TC,Arial,sans-serif}.t{font-size:28px;font-weight:700;fill:#0f172a}.h{font-size:18px;font-weight:650;fill:#0f172a}.b{font-size:15px;fill:#334155}.s{font-size:13px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs><rect width="900" height="650" fill="#ffffff"/><text class="t" x="40" y="54">Eunomia 介入的位置：DMA 前的 ordering gate</text>
<rect class="blue" x="45" y="110" width="150" height="90" rx="14"/><text class="h" x="120" y="145" text-anchor="middle">Sender RNIC</text><text class="s" x="120" y="174" text-anchor="middle">Head 32b + Last 1b</text>
<path class="arrow" d="M195 155H270"/>
<rect class="box" x="270" y="84" width="175" height="142" rx="14"/><text class="h" x="357" y="118" text-anchor="middle">多路徑 fabric</text><path d="M296 155 Q357 88 418 155" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M296 155 Q357 155 418 155" fill="none" stroke="#7c3aed" stroke-width="4"/><path d="M296 155 Q357 222 418 155" fill="none" stroke="#ea580c" stroke-width="4"/><text class="s" x="357" y="210" text-anchor="middle">不同延遲造成 OOO</text>
<path class="arrow" d="M445 155H515"/>
<rect class="purple" x="515" y="88" width="160" height="72" rx="12"/><text class="h" x="595" y="120" text-anchor="middle">Packet driver</text><text class="s" x="595" y="145" text-anchor="middle">解析 PSN / Head / Last</text>
<path class="arrow" d="M595 160V215"/>
<rect class="orange" x="515" y="215" width="160" height="92" rx="12"/><text class="h" x="595" y="250" text-anchor="middle">HD bitmap</text><text class="s" x="595" y="277" text-anchor="middle">set bit · 推進 Head</text><text class="s" x="595" y="297" text-anchor="middle">ACK / SACK / NACK</text>
<path class="arrow" d="M675 261H735"/>
<rect class="green" x="735" y="215" width="125" height="92" rx="12"/><text class="h" x="797" y="248" text-anchor="middle">Memory</text><text class="s" x="797" y="275" text-anchor="middle">2-byte blocks</text><text class="s" x="797" y="296" text-anchor="middle">共享配置器</text>
<path class="arrow" d="M595 307V380"/>
<rect class="blue" x="490" y="380" width="210" height="82" rx="12"/><text class="h" x="595" y="413" text-anchor="middle">DMA 到 host memory</text><text class="s" x="595" y="442" text-anchor="middle">資料可先寫入，完成仍被 gate</text>
<path class="arrow" d="M595 462V520"/>
<rect class="box" x="490" y="520" width="210" height="62" rx="12"/><text class="h" x="595" y="558" text-anchor="middle">Completion Queue</text>
<rect class="box" x="45" y="350" width="350" height="190" rx="14"/><text class="h" x="70" y="390">只有連續前綴才能完成</text><text class="b" x="70" y="426">• 收到 100, 101, 108：配置 bitmap</text><text class="b" x="70" y="460">• 108 已 DMA，但 Head 停在 102</text><text class="b" x="70" y="494">• 102–Last 全到齊後才發 completion</text><text x="872" y="632" text-anchor="end" font-size="11" fill="#64748b">Scott Yo-Ru Chen · 2026-10-28</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#475569" i]{fill:#c0c6cd}[fill="#64748b" i]{fill:#929eb0}[fill="#ffffff" i]{fill:#1b1f20}[stroke="#2563eb" i]{stroke:#82a4ed}[stroke="#7c3aed" i]{stroke:#aa82ed}[stroke="#ea580c" i]{stroke:#eda782}.t{fill:#d1d7e6}.h{fill:#d1d7e6}.b{fill:#c6ccd5}.s{fill:#c0c6cd}.box{fill:#1a2026;stroke:#5b6f8a}.blue{fill:#172538;stroke:#82a4ed}.purple{fill:#1b1532;stroke:#aa82ed}.orange{fill:#3b2c16;stroke:#eda782}.green{fill:#193723;stroke:#52e689}.arrow{stroke:#c0c6cd}}</style>
</svg>