<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><style>text{font-family:Inter,Noto Sans TC,Arial,sans-serif}.t{font-size:28px;font-weight:700;fill:#0f172a}.h{font-size:18px;font-weight:650;fill:#0f172a}.b{font-size:15px;fill:#334155}.s{font-size:13px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs><rect width="900" height="650" fill="#ffffff"/><text class="t" x="40" y="54">三種重排位置，三種主要風險</text>
<rect class="purple" x="40" y="105" width="255" height="430" rx="16"/><text class="h" x="167" y="145" text-anchor="middle">Eunomia 動態端點</text><text class="b" x="62" y="190">狀態位置</text><text class="s" x="62" y="216">receiver RNIC 共享 block pool</text><text class="b" x="62" y="260">優點</text><text class="s" x="62" y="286">按 active 失序與跨度付費</text><text class="s" x="62" y="310">支援大範圍 packet spraying</text><text class="b" x="62" y="354">主要風險</text><text class="s" x="62" y="380">allocator / metadata 耗盡</text><text class="s" x="62" y="404">WRITE 末包增加一個 RTT</text><text class="b" x="62" y="450">適用訊號</text><text class="s" x="62" y="476">active ratio 低且跨度長尾</text>
<rect class="blue" x="322" y="105" width="255" height="430" rx="16"/><text class="h" x="449" y="145" text-anchor="middle">固定 BDP 端點</text><text class="b" x="344" y="190">狀態位置</text><text class="s" x="344" y="216">每條 QP 固定 bitmap</text><text class="b" x="344" y="260">優點</text><text class="s" x="344" y="286">索引簡單、容量上界清楚</text><text class="s" x="344" y="310">selective repeat 路徑成熟</text><text class="b" x="344" y="354">主要風險</text><text class="s" x="344" y="380">大量 QP 常駐 SRAM</text><text class="s" x="344" y="404">跨度超過 BDP 仍失效</text><text class="b" x="344" y="450">適用訊號</text><text class="s" x="344" y="476">失序上界小、QP 數可控</text>
<rect class="orange" x="604" y="105" width="255" height="430" rx="16"/><text class="h" x="731" y="145" text-anchor="middle">目的 ToR 重排</text><text class="b" x="626" y="190">狀態位置</text><text class="s" x="626" y="216">交換器 queue / route state</text><text class="b" x="626" y="260">優點</text><text class="s" x="626" y="286">commodity RNIC 不需修改</text><text class="s" x="626" y="310">到端點前恢復順序</text><text class="b" x="626" y="354">主要風險</text><text class="s" x="626" y="380">交換器 buffer 與狀態回收</text><text class="s" x="626" y="404">failure / reroute 一致性</text><text class="b" x="626" y="450">適用訊號</text><text class="s" x="626" y="476">既有 RNIC 無法變更</text>
<rect class="green" x="170" y="565" width="560" height="42" rx="10"/><text class="b" x="450" y="591" text-anchor="middle">共同驗證：p99 FCT、state occupancy、failure fallback、completion 語意</text><text x="872" y="632" text-anchor="end" font-size="11" fill="#64748b">Scott Yo-Ru Chen · 2026-10-28</text><style>/* auto dark mode */@media (prefers-color-scheme: dark){svg:not([fill]){fill:#e4e6e7}[fill="#475569" i]{fill:#c0c6cd}[fill="#64748b" i]{fill:#929eb0}[fill="#ffffff" i]{fill:#1b1f20}.t{fill:#d1d7e6}.h{fill:#d1d7e6}.b{fill:#c6ccd5}.s{fill:#c0c6cd}.box{fill:#1a2026;stroke:#5b6f8a}.blue{fill:#172538;stroke:#82a4ed}.purple{fill:#1b1532;stroke:#aa82ed}.orange{fill:#3b2c16;stroke:#eda782}.green{fill:#193723;stroke:#52e689}.arrow{stroke:#c0c6cd}}</style>
</svg>