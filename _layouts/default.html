<!doctype html>
<html lang="{{ page.lang | default: 'zh-Hant' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% assign description = page.description | default: page.excerpt | default: site.description %}
  <meta name="description" content="{{ description | strip_html | normalize_whitespace | truncate: 180 | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ description | strip_html | normalize_whitespace | truncate: 180 | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.github.build_revision | default: 'byline-20260922' }}-byline-1">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.github.build_revision | default: 'speechify-20260922' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header"><div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Rightson 首頁"><span class="brand-mark" aria-hidden="true">R.</span><span>RIGHTSON<span class="brand-caption">RESEARCH & ENGINEERING</span></span></a>
    <nav aria-label="主要導覽">
      <a href="{{ '/' | relative_url }}" {% if page.layout == 'home' %}aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/categories/' | relative_url }}" {% if page.url == '/categories/' %}aria-current="page"{% endif %}>分類</a>
      <a href="{{ '/search/' | relative_url }}" {% if page.url == '/search/' %}aria-current="page"{% endif %}>搜尋</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>關於</a>
    </nav>
  </div></header>
  <main id="main" class="shell" tabindex="-1">{{ content }}</main>
  <footer class="site-footer shell"><span>Rightson · 網路、晶片、AI 與市場</span><div><a href="{{ '/feed.xml' | relative_url }}">RSS 訂閱</a><a href="https://github.com/rightson">GitHub ↗</a><a href="#main">回到頂端 ↑</a></div></footer>
  {% include analytics.html %}
</body>
</html>
