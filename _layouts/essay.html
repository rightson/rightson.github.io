---
layout: default
---
<div class="article-top"><a href="{{ '/' | relative_url }}">← 所有文章</a></div>
<article class="post">
  <header class="article-header">
    <h1>{{ page.title | escape }}</h1>
    {% include post-byline.html %}
    {% if page.takeaways %}
    <section class="article-summary article-takeaways" aria-label="重點">
      <p class="article-summary-label">重點</p>
      <dl>
        {% for item in page.takeaways %}
        <div class="takeaway"><dt>{{ item.who | escape }}</dt><dd>{{ item.value | escape }}</dd></div>
        {% endfor %}
      </dl>
    </section>
    {% endif %}
  </header>
  <div class="article-grid">
    <div class="entry" data-article>{{ content }}</div>
    <aside class="toc" data-toc hidden><details open><summary>文章目錄</summary><nav aria-label="文章章節"><ol></ol></nav></details></aside>
  </div>
  <footer class="article-footer"><a href="{{ '/' | relative_url }}">← 返回文章列表</a><a href="{{ '/search/' | relative_url }}">搜尋更多文章 →</a></footer>
</article>
